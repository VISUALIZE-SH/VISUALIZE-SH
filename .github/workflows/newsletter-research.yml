name: Prepare weekly newsletter review

on:
  # GitHub Actions cron is UTC. These two possible UTC times cover 6 PM Pacific
  # across daylight-saving changes; the gate job admits only local Sunday 18:00.
  schedule:
    - cron: '0 1 * * 1'
    - cron: '0 2 * * 1'
  workflow_dispatch:
    inputs:
      issue_date:
        description: 'Optional Pacific issue date (YYYY-MM-DD); defaults to today in Pacific time'
        required: false
        type: string

permissions: {}

concurrency:
  group: newsletter-research
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
      issue_date: ${{ steps.gate.outputs.issue_date }}
    steps:
      - id: gate
        name: Allow only an enabled schedule at Sunday 6 PM Pacific
        env:
          EVENT_NAME: ${{ github.event_name }}
          AUTOMATION_ENABLED: ${{ vars.NEWSLETTER_AUTOMATION_ENABLED }}
          REQUESTED_ISSUE_DATE: ${{ inputs.issue_date }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            issue_date="${REQUESTED_ISSUE_DATE:-$(TZ=America/Los_Angeles date +%F)}"
            [[ "$issue_date" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
            echo 'should_run=true' >> "$GITHUB_OUTPUT"
            echo "issue_date=$issue_date" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          weekday="$(TZ=America/Los_Angeles date +%u)"
          hour="$(TZ=America/Los_Angeles date +%H)"
          if [[ "$AUTOMATION_ENABLED" == "true" && "$weekday" == "7" && "$hour" == "18" ]]; then
            echo 'should_run=true' >> "$GITHUB_OUTPUT"
            echo "issue_date=$(TZ=America/Los_Angeles date +%F)" >> "$GITHUB_OUTPUT"
          else
            echo 'should_run=false' >> "$GITHUB_OUTPUT"
            echo 'issue_date=' >> "$GITHUB_OUTPUT"
          fi

  research:
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - name: Checkout the trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Research the weekly evidence window
        env:
          ISSUE_DATE: ${{ needs.gate.outputs.issue_date }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_RESEARCH_MODEL: ${{ vars.OPENAI_RESEARCH_MODEL || 'gpt-5.5' }}
          OPENAI_RESEARCH_EFFORT: ${{ vars.OPENAI_RESEARCH_EFFORT || 'low' }}
          # The YAML watchlist is private operational research strategy. Keep it
          # in Actions secrets rather than committing it to this public repo.
          NEWS_SOURCE_REGISTRY_YAML: ${{ secrets.NEWS_SOURCE_REGISTRY_YAML }}
          RESEARCH_LOOKBACK_DAYS: '7'
        shell: bash
        run: |
          set -euo pipefail
          args=(--end-date "$ISSUE_DATE")
          npm run newsletter:research -- "${args[@]}"
      - name: Apply only draft-safe changes
        run: npm run newsletter:apply
      - name: Render the public and email-safe issue
        env:
          ISSUE_DATE: ${{ needs.gate.outputs.issue_date }}
        run: npm run newsletter:render -- --date "$ISSUE_DATE"
      - name: Validate data, newsletter, and public-repository safety
        run: |
          npm run newsletter:validate
          npm run typecheck
      - name: Create a review pull request
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_DATE: ${{ needs.gate.outputs.issue_date }}
        shell: bash
        run: |
          set -euo pipefail
          allowed=(data public/graph.json public/digests)
          if [[ -z "$(git status --porcelain -- "${allowed[@]}")" ]]; then
            echo 'No newsletter or data changes were produced.'
            exit 0
          fi

          branch="codex/newsletter-${ISSUE_DATE}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch --create "$branch"
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]'
          git add -- "${allowed[@]}"
          if git diff --cached --quiet; then
            echo 'Only out-of-scope changes were produced; refusing to create a PR.' >&2
            exit 1
          fi
          git commit -m "chore(newsletter): ${ISSUE_DATE} research draft"
          authorization="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${authorization}" push origin "HEAD:refs/heads/${branch}"
          unset authorization
          gh pr create \
            --base main \
            --head "$branch" \
            --title "Weekly newsletter research draft — ${ISSUE_DATE}" \
            --body "Automated research draft for ${ISSUE_DATE}. Review every source link, new draft entity, pulse change, and public digest before merging. Delivery remains a separate protected action."

          # Events created by GITHUB_TOKEN normally do not start another workflow.
          # workflow_dispatch is the documented exception, so explicitly attach
          # the security checks to the generated branch/PR head commit.
          gh workflow run security.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"
