# Conditions / anatomy — the disease entities in non-valvular structural heart.
# Schema: schema/condition.schema.json   |   See schema/DATA_DICTIONARY.md
# id prefix: cond-
# Recommended `category` vocabulary (keep consistent for filtering/coloring):
#   "Atrial fibrillation / stroke prevention", "Septal & congenital defect",
#   "Cardiomyopathy", "Infiltrative cardiomyopathy", "Heart failure",
#   "Coronary microvascular", "Aortic valve disease", "Mitral valve disease",
#   "Tricuspid valve disease", "Pulmonary valve disease"
# `pulse`: 0-10 newsworthiness score (10 = most recent coverage). Optional; drives
#   label font size. Maintained by the update routine — see schema/DATA_DICTIONARY.md.

- id: cond-af
  type: condition
  name: "Atrial Fibrillation"
  abbreviation: "AF"
  category: "Atrial fibrillation / stroke prevention"
  anatomy: ["left atrium", "left atrial appendage"]
  description: "Most common sustained arrhythmia; thrombus typically forms in the left atrial appendage, the target of LAA closure for stroke prevention when anticoagulation is unsuitable."
  pulse: 7
  curation:
    status: draft
    lastUpdated: '2026-10-03'
    sources: ['https://www.ahajournals.org/doi/10.1161/CIR.0000000000001193']

- id: cond-pfo
  type: condition
  name: "Patent Foramen Ovale (PFO-associated stroke)"
  abbreviation: "PFO"
  category: "Septal & congenital defect"
  anatomy: ["interatrial septum", "fossa ovalis"]
  description: "Residual interatrial communication implicated in paradoxical embolism and cryptogenic stroke; transcatheter closure reduces recurrent stroke in selected patients."
  curation:
    status: draft
    lastUpdated: '2026-10-03'
    sources: ['https://www.jscai.org/article/S2772-9303(22)00094-4/fulltext', 'https://www.scai.org/media-center/news-and-articles/scai-issues-official-guidelines-management-patent-foramen-ovale']

- id: cond-asd
  type: condition
  name: "Atrial Septal Defect"
  abbreviation: "ASD"
  category: "Septal & congenital defect"
  anatomy: ["interatrial septum"]
  description: "Congenital opening in the atrial septum causing left-to-right shunt; secundum defects are amenable to transcatheter closure."
  curation:
    status: draft
    lastUpdated: '2026-10-03'
    sources: ['https://www.jacc.org/doi/10.1016/j.jacc.2025.09.006']

- id: cond-vsd
  type: condition
  name: "Ventricular Septal Defect"
  abbreviation: "VSD"
  category: "Septal & congenital defect"
  anatomy: ["interventricular septum"]
  description: "Congenital communication in the ventricular septum or, rarely, acquired septal rupture after myocardial infarction. Management depends on anatomy and hemodynamics; transcatheter closure is used for selected congenital defects and is an evolving option in some post-infarction cases."
  curation:
    status: draft
    lastUpdated: '2026-10-03'
    sources: ['https://www.jacc.org/doi/10.1016/j.jacc.2025.09.006', 'https://www.jacc.org/doi/10.1016/j.jacc.2024.11.009']

- id: cond-pda
  type: condition
  name: "Patent Ductus Arteriosus"
  abbreviation: "PDA"
  category: "Septal & congenital defect"
  anatomy: ["ductus arteriosus", "aorta", "pulmonary artery"]
  description: "Persistent fetal vessel connecting the aorta and pulmonary artery. Management depends on hemodynamic significance and patient age; in preterm infants, the benefits and timing of closure remain debated, with transcatheter closure considered for selected persistent hemodynamically significant cases."
  curation:
    status: draft
    lastUpdated: '2026-10-03'
    sources: ['https://www.jacc.org/doi/10.1016/j.jacc.2025.09.006', 'https://publications.aap.org/pediatrics/article/155/5/e2025071425/201674/Patent-Ductus-Arteriosus-in-Preterm-Infants']

- id: cond-hcm
  type: condition
  name: "Hypertrophic Cardiomyopathy"
  abbreviation: "HCM"
  category: "Cardiomyopathy"
  anatomy: ["interventricular septum", "left ventricle", "left ventricular outflow tract"]
  description: "Sarcomeric cardiomyopathy with LV hypertrophy; the obstructive form (HOCM) features dynamic LVOT obstruction treated by septal reduction or cardiac myosin inhibitors."
  pulse: 7
  curation:
    status: draft
    lastUpdated: '2026-10-03'
    sources: ['https://www.ahajournals.org/doi/10.1161/CIR.0000000000001250']

- id: cond-attr-cm
  type: condition
  name: "Transthyretin Amyloid Cardiomyopathy"
  abbreviation: "ATTR-CM"
  category: "Infiltrative cardiomyopathy"
  anatomy: ["myocardium", "left ventricle"]
  description: "Infiltrative cardiomyopathy from misfolded transthyretin (wild-type or hereditary) depositing in the myocardium; treated with TTR stabilizers and silencers."
  pulse: 8
  curation:
    status: draft
    lastUpdated: '2026-10-03'
    sources: ['https://www.jacc.org/doi/10.1016/j.jacc.2022.11.022']

- id: cond-hfref
  type: condition
  name: "Heart Failure with Reduced Ejection Fraction"
  abbreviation: "HFrEF"
  category: "Heart failure"
  anatomy: ["left ventricle"]
  description: "Heart failure with left ventricular ejection fraction of 40% or less, managed with guideline-directed medical and device therapies tailored to the clinical profile."
  pulse: 5
  curation:
    status: draft
    lastUpdated: '2026-10-03'
    sources: ['https://www.ahajournals.org/doi/10.1161/CIR.0000000000001063']

- id: cond-hfpef
  type: condition
  name: "Heart Failure with Preserved Ejection Fraction"
  abbreviation: "HFpEF"
  category: "Heart failure"
  anatomy: ["left ventricle", "left atrium"]
  description: "Heart failure with left ventricular ejection fraction of 50% or greater and evidence of elevated filling pressures. Current treatment is guided by clinical phenotype and contemporary heart-failure recommendations."
  pulse: 6
  curation:
    status: draft
    lastUpdated: '2026-10-03'
    sources: ['https://www.ahajournals.org/doi/10.1161/CIR.0000000000001063']

- id: cond-cmd
  type: condition
  name: "Coronary Microvascular Dysfunction & Refractory Angina"
  abbreviation: "CMD"
  category: "Coronary microvascular"
  anatomy: ["coronary microvasculature", "coronary sinus"]
  description: "Angina from impaired microvascular function (often with non-obstructive coronaries); device approaches include coronary sinus narrowing to redistribute perfusion."
  pulse: 3
  curation:
    status: draft
    lastUpdated: '2026-10-03'
    sources: ['https://doi.org/10.1093/eurheartj/ehae177']

# ============================ VALVULAR DISEASE ============================
# Valvular structural heart disease and its transcatheter/surgical therapies.

- id: cond-as
  type: condition
  name: "Aortic Stenosis"
  abbreviation: "AS"
  category: "Aortic valve disease"
  anatomy: ["aortic valve", "left ventricular outflow tract", "aortic root"]
  description: "Progressive narrowing of the aortic valve (commonly calcific/degenerative); severe symptomatic disease is treated by TAVR or surgical AVR, with trials now extending TAVR to low-risk and asymptomatic patients."
  pulse: 9
  curation:
    status: draft
    lastUpdated: '2026-10-03'
    notes: "CMS finalized the NCD on 2026-09-10: Medicare covers TAVR for symptomatic severe AS without the former CED requirement, while asymptomatic severe AS remains covered only under CED in a CMS-approved study and with a device FDA-approved for that indication. This does not create unrestricted asymptomatic coverage. The 2026-06 proposed-NCD articles retained from the prior note are historical only."
    sources:
      - 'https://academic.oup.com/eurheartj/article/46/44/4635/8234488'
      - 'https://www.acc.org/Latest-in-Cardiology/Articles/2026/06/17/17/38/CMS-Proposes-Updates-to-TAVR-National-Coverage-Determination'
      - 'https://www.tctmd.com/news/cms-proposes-expanding-tavi-coverage-asymptomatic-patients'
      - 'https://www.cms.gov/medicare-coverage-database/view/ncacal-decision-memo.aspx?NCAId=321&proposed=N'

- id: cond-ar
  type: condition
  name: "Aortic Regurgitation"
  abbreviation: "AR"
  category: "Aortic valve disease"
  anatomy: ["aortic valve", "aortic root", "left ventricle"]
  description: "Diastolic backflow through an incompetent aortic valve causing LV volume overload; historically surgical, now with the first dedicated transcatheter device (JenaValve Trilogy) for symptomatic severe AR."
  pulse: 7
  curation:
    status: draft
    lastUpdated: '2026-10-03'
    sources: ['https://academic.oup.com/eurheartj/article/46/44/4635/8234488']

- id: cond-mr
  type: condition
  name: "Mitral Regurgitation"
  abbreviation: "MR"
  category: "Mitral valve disease"
  anatomy: ["mitral valve", "mitral annulus", "left atrium", "left ventricle"]
  description: "Systolic backflow through the mitral valve, either primary/degenerative (leaflet/chordal) or secondary/functional (annular dilation, LV remodeling); treated by transcatheter edge-to-edge repair (TEER), transcatheter replacement (TMVR), annuloplasty, or surgery."
  pulse: 8
  curation:
    status: draft
    lastUpdated: '2026-10-03'
    sources: ['https://academic.oup.com/eurheartj/article/46/44/4635/8234488']

- id: cond-ms
  type: condition
  name: "Mitral Stenosis"
  abbreviation: "MS"
  category: "Mitral valve disease"
  anatomy: ["mitral valve", "mitral annulus", "left atrium"]
  description: "Obstruction to LA-to-LV inflow, most often rheumatic (commissural fusion) or degenerative with mitral annular calcification; treated by percutaneous balloon commissurotomy or surgery."
  pulse: 3
  curation:
    status: draft
    lastUpdated: '2026-10-03'
    sources: ['https://academic.oup.com/eurheartj/article/46/44/4635/8234488']

- id: cond-tr
  type: condition
  name: "Tricuspid Regurgitation"
  abbreviation: "TR"
  category: "Tricuspid valve disease"
  anatomy: ["tricuspid valve", "tricuspid annulus", "right atrium", "right ventricle"]
  description: "Backflow through the tricuspid valve, frequently functional from annular dilation/right-heart remodeling; long undertreated, now addressed by transcatheter edge-to-edge repair (TriClip) and transcatheter replacement (EVOQUE)."
  pulse: 9
  curation:
    status: draft
    lastUpdated: '2026-10-03'
    sources: ['https://academic.oup.com/eurheartj/article/46/44/4635/8234488']

- id: cond-pv
  type: condition
  name: "Pulmonary Valve Disease"
  abbreviation: "PVD"
  category: "Pulmonary valve disease"
  anatomy: ["pulmonary valve", "right ventricular outflow tract", "pulmonary artery"]
  description: "Pulmonary regurgitation/stenosis or RVOT conduit dysfunction, often in repaired congenital heart disease (e.g. tetralogy of Fallot); treated by transcatheter pulmonary valve replacement (Melody, Harmony) or surgery."
  pulse: 4
  curation:
    status: draft
    lastUpdated: '2026-10-03'
    sources: ['https://www.jacc.org/doi/10.1016/j.jacc.2025.09.006']

- id: cond-pvl
  type: condition
  name: Prosthetic paravalvular leak
  abbreviation: PVL
  category: Prosthetic valve complication
  anatomy: [prosthetic valve sewing ring, native annulus, periannular channel]
  description: Regurgitant flow through a defect between a prosthetic valve and the native annulus, potentially causing heart failure or hemolysis; selected high-risk patients may undergo transcatheter closure.
  curation:
    status: draft
    lastUpdated: '2026-10-03'
    sources:
    - https://pmc.ncbi.nlm.nih.gov/articles/PMC8999580/
    - https://pmc.ncbi.nlm.nih.gov/articles/PMC10863827/

- id: cond-ischemic-lv-remodeling
  type: condition
  name: Ischemic left ventricular remodeling
  abbreviation: Ischemic LV remodeling
  category: Heart failure
  anatomy: [left ventricle, anterior myocardial scar]
  description: LV dilation and geometric distortion after extensive myocardial infarction; selected patients have been studied for surgical or hybrid scar exclusion and ventricular reconstruction.
  curation:
    status: draft
    lastUpdated: '2026-10-03'
    sources:
    - https://pmc.ncbi.nlm.nih.gov/articles/PMC9725051/
    - https://pubmed.ncbi.nlm.nih.gov/39797846/
    - https://www.jacc.org/doi/10.1016/j.jchf.2024.09.023

- id: cond-hypertension
  type: condition
  name: Systemic hypertension
  abbreviation: HTN
  category: Hypertension
  anatomy: [systemic arterial circulation, left ventricle]
  description: Persistently elevated systemic blood pressure is a cardiovascular risk condition that can cause target-organ injury, including left ventricular remodeling. Diagnosis requires confirmation using repeated or out-of-office blood-pressure measurements; the 2024 ESC guideline defines hypertension as office systolic pressure at least 140 mmHg or diastolic pressure at least 90 mmHg.
  curation:
    status: draft
    lastUpdated: '2026-10-03'
    sources:
    - https://academic.oup.com/eurheartj/article/45/38/3912/7741010
    - https://www.ahajournals.org/doi/full/10.1161/CIR.0000000000001356
