indications:
  - id: indication-portico-us-original
    decisionId: decision-portico-p190023
    versionIds:
      - ver-portico
    jurisdiction: US
    effectiveDate:
      value: "2021-09-17"
      precision: day
    text: >-
      Relief of symptomatic severe native calcific aortic stenosis in patients judged by a heart team including a
      cardiac surgeon to be at high or greater risk of open surgery, with predicted 30-day surgical mortality of at
      least 8% based on the STS score and additional comorbidities.
    textType: paraphrase
    population: Symptomatic severe native calcific AS at high or greater open surgical risk (predicted 30-day mortality ≥8%).
    sourceRefs:
      - sourceId: src-portico-p190023-ssed
        locator: PDF p. 1, section II (Indications for Use)
    reviewStatus: reviewed
