    label: FLEX-Mini 30 mm clip size (US)
    value: >-
      K263319 (2026-10-21) adds a 30 mm AtriClip Mini (AOD3) clip in the FLEX-Mini ACHM30 system for smaller appendages;
      previously available AOD3 lengths were 35, 40, 45 and 50 mm.
    availability: reported
    basis: directly_reported
    context: >-
      US 510(k) for the FLEX-Mini ACHM30 configuration; indication: LAA exclusion under direct visualization with other
      cardiac surgery.
    limitation: >-
      Configuration-specific clearance by substantial equivalence to K234125; no clinical outcome data; not a
      stroke-prevention indication.
