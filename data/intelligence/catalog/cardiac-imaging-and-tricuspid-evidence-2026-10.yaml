  - id: claim-wor81-b09-tempus-repeat-testing
    versionId: ver-tempus-ecg-mr-k254297
    category: digital
    key: repeatTestingRestriction
    label: Repeat-testing restriction
    value: Do not repeat testing of the same patient within 12 months
    availability: reported
    basis: directly_reported
    reviewStatus: reviewed
    observedAt: "2026-10-28"
    context: K254297 General Warnings and Precautions also states serial patient monitoring has not been validated.
    limitation: >-
      Label warning, not a recommended testing interval, validated longitudinal monitoring or authority to initiate MR
      treatment.
    sourceRefs:
      - sourceId: src-tempus-ecg-mr-fda-k254297
        locator: Physical PDF p.6 (Summary p.2), General Warnings and Precautions
  - id: claim-wor81-b09-ultra-pivotal-image-adequacy
    versionId: ver-ultrasight-ai-guidance-k223347
    category: evidence
    key: pivotalImageAdequacy
    label: Pivotal image-acquisition validation
    value: 240 subjects; 93–100% image adequacy for four co-primary assessments
    context: >-
      Novice users with UltraSight/Lumify versus sonographers without AI; five blinded expert readers judged adequacy
      for LV size, LV function, RV size and pericardial effusion assessment.
    limitation: >-
      Qualitative image adequacy, not diagnosis accuracy or clinical benefit. Secondary TV structure adequacy was 74%
      and IVC size 67%; the 61-subject pilot was separate. CI not specified in this summary. These are K223347 results,
      not a K251416 clinical cohort.
    sourceRefs:
      - sourceId: src-ultrasight-fda-k223347
        locator: Physical PDF  pp.12–13, Clinical Performance Data > Pivotal Study
    availability: reported
    basis: directly_reported
    reviewStatus: reviewed
    observedAt: "2026-10-28"
  - id: claim-wor81-b09-ultra-preprocessing-pccp
    versionId: ver-ultrasight-guidance-k251416
    category: design
    key: preprocessingAndPCCP
    label: Preprocessing change and governed future modifications
    value: Image preprocessing added; PCCP covers future model retraining, compatible systems and cardiac views
    context: >-
      K251416 names K223347 as predicate; the current ten-view acquisition indication and Lumify/S4-1 compatibility row
      are unchanged. PCCP changes require validation and updated labeling.
    limitation: >-
      Planned future changes do not establish implemented or marketed new hardware, views or models. No numbered
      software build or AS diagnostic indication established.
    sourceRefs:
      - sourceId: src-ultrasight-fda-k251416
        locator: Physical PDF  p.6 modification paragraph; p.8 compatibility; pp.11–12 Table 3 PCCP
    availability: reported
    basis: directly_reported
    reviewStatus: reviewed
    observedAt: "2026-10-28"
  - id: claim-wor81-b09-ultra-2025-bench-validation
    versionId: ver-ultrasight-guidance-k251416
    category: evidence
    key: standaloneBenchValidation
    label: Standalone acquisition-algorithm validation
    value: 134 patients; 26,362 quality-bar clips and 2.4 million probe-guidance frames
    context: >-
      Both standalone tests describe 134 patients (111 USA/23 Israel) from sites geographically distinct from
      development. Image/position classification acceptance criteria were reported as met.
    limitation: >-
      Bench validation, not disease accuracy or clinical benefit. Do not pool into 268 patients or call this a new
      240-patient clinical study. Exact AUC/FPR point estimates and numerical CIs are not reported here; no JAMA
      1302/NPJ 995 cohort bridge.
    sourceRefs:
      - sourceId: src-ultrasight-fda-k251416
        locator: "Physical PDF  pp.9–10 (summary5–6of8), NonClinical Performance Data: Quality Bar andProbe Guidance"
    availability: reported
    basis: directly_reported
    reviewStatus: reviewed
    observedAt: "2026-10-28"
