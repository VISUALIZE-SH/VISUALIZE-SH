claims:
  - id: claim-wor81-b09-tempus-electrode-compatibility
    versionId: ver-tempus-ecg-mr-k254297
    category: digital
    key: electrodeCompatibility
    label: ECG electrode compatibility
    value: Wet Ag/AgCl electrodes with conductive gel/paste
