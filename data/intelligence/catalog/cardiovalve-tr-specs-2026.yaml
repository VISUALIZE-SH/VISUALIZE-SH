claims:
  - id: claim-cvtr-target-tr
    versionId: ver-cardiovalve-tr
    category: evidence
    key: cvtr-target-tr
    label: TARGET TR reduction (sponsor)
    value: None or trace TR 76.7% (n=120) at 6 months; 76.9% (n=26) at 3 years
    availability: reported
    basis: directly_reported
    context: >-
      Venus Medtech voluntary announcement, 24 Nov 2026: TARGET, prospective single-arm, 157 patients at nearly 30
      centers in Germany, Spain, Italy, the UK and Canada; presented at PCR London Valves 2026.
    limitation: Sponsor filing; endpoint definitions and core-lab methods not stated.
    observedAt: "2026-11-27"
    sourceRefs:
      - sourceId: src-cvtr-venus-target-6m
        locator: PDF p. 1, results paragraph
    reviewStatus: reviewed
  - id: claim-cvtr-target-30d
    versionId: ver-cardiovalve-tr
    category: evidence
    key: cvtr-target-30d
    label: TARGET 30-day safety (sponsor)
    value: 30-day all-cause death 5.7%; HF rehospitalization 1.9%
    availability: reported
    basis: directly_reported
    context: >-
      Venus Medtech voluntary announcement, 24 Nov 2026: TARGET, prospective single-arm, 157 patients at nearly 30
      centers in Germany, Spain, Italy, the UK and Canada; presented at PCR London Valves 2026. Major access-site or
      vascular injury needing surgery 5.1%.
    limitation: Sponsor filing; the August 2026 interim report gave 2.5% HF rehospitalization at 30 days.
    observedAt: "2026-11-27"
    sourceRefs:
      - sourceId: src-cvtr-venus-target-6m
        locator: PDF p. 1, safety sentence
    reviewStatus: reviewed
  - id: claim-cvtr-target-delivery
    versionId: ver-cardiovalve-tr
    category: evidence
    key: cvtr-target-delivery
    label: Delivery-system generations (sponsor)
    value: Major bleeding 21% to 5.0% with the Enhanced Delivery System
    availability: reported
    basis: directly_reported
    context: >-
      Venus Medtech voluntary announcement, 24 Nov 2026: TARGET, prospective single-arm, 157 patients at nearly 30
      centers in Germany, Spain, Italy, the UK and Canada; presented at PCR London Valves 2026. Major vascular
      complications 8.8% to 3.0% versus the first-generation delivery system.
    limitation: Non-randomized comparison between delivery-system generations; denominators and time frame not given.
    observedAt: "2026-11-27"
    sourceRefs:
      - sourceId: src-cvtr-venus-target-6m
        locator: PDF p. 1, last sentence
    reviewStatus: reviewed
  - id: claim-cvtr-lubeck-2026
    versionId: ver-cardiovalve-tr
    category: evidence
    key: cvtr-lubeck-2026
    label: Single-center series (Lübeck)
    value: Mean TR grade 4.08 at baseline vs 0.50 at 30 days (n=12)
    availability: reported
    basis: directly_reported
    context: >-
      Genske et al. 2026: retrospective single-center comparison of Cardiovalve (n=12, TARGET or compassionate use, Feb
      2023-Oct 2024) with EVOQUE (n=13).
    limitation: >-
      Retrospective, 12 patients; two device dislocations or detachments (one patient died of right heart failure at 2
      months); sheath altered for the last 25% of procedures.
    observedAt: "2026-11-27"
    sourceRefs:
      - sourceId: src-cvtr-genske-2026
        locator: Results, TR paragraph
    reviewStatus: reviewed
