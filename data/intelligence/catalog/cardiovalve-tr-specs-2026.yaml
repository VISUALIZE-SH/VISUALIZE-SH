specs:
  - version: ver-cardiovalve-tr
    category: tricuspid-replacement
    values:
      frame-material:
        value: Nitinol, dual-frame configuration
        loc: Methods, device description paragraph
        source: src-cvtr-genske-2026
        context: Low-profile frame.
      leaflet-material:
        value: Bovine pericardium
        loc: Methods, device description paragraph
        source: src-cvtr-genske-2026
      sealing-design:
        value: Circumferential atrial flange for supra-annular sealing
        loc: Methods, device description paragraph
        source: src-cvtr-genske-2026
      anchoring-mechanism:
        value: Ventricular grasping legs capture the native leaflets
        loc: Methods, device description paragraph
        source: src-cvtr-genske-2026
        context: Active fixation without relying on annular calcification.
      repositionable:
        value: Fully retrievable before final release
        loc: Methods, device description paragraph
        source: src-cvtr-genske-2026
        context: Steerable delivery catheter with controlled leaflet capture.
      delivery-sheath:
        value: 37 Fr transfemoral delivery system
        loc: Methods, device description; Discussion, access paragraph
        source: src-cvtr-genske-2026
        context: >-
          Surgical venous cutdown in 75% of Lübeck cases; the manufacturer altered the sheath for the last 25% of
          procedures (size not given).
        limitation: Applies to the original sheath. The sponsor reports an Enhanced Delivery System without a size.
      available-sizes:
        value: 45, 50, 55 mm
        loc: Methods, device description paragraph
        source: src-cvtr-genske-2026
        context: 55 mm used in 9 and 50 mm in 3 of 12 Lübeck patients.
      anatomy-range-summary:
        value: Tricuspid diameter under 55 mm on CT (TARGET 2.0 inclusion)
        loc: Eligibility, anatomical inclusion criterion 10
        source: src-lsi-93389b1e31643a25
        context: Also right femoral vein over 9 mm and RV length over 45 mm on CT.
      imaging-guidance:
        value: Fluoroscopic and echocardiographic guidance
        loc: Methods, device description paragraph
        source: src-cvtr-genske-2026
        context: All procedures under general anesthesia.
      tissue-treatment:
        availability: not_publicly_disclosed
        loc: Detailed description (not stated)
        source: src-lsi-93389b1e31643a25
      indication-scope:
        value: Investigational; CE MDR application submitted (sponsor)
        loc: PDF p. 20, Cardiovalve pipeline paragraph
        source: src-cvtr-venus-fy2025
        context: "Sponsor: European pivotal trial fully enrolled and CE MDR application submitted."
      pivotal-trials:
        value: European pivotal trial, 150 enrolled (sponsor)
        loc: PDF pp. 19-20
        source: src-cvtr-venus-fy2025
        context: The sponsor reports interim data from this trial as the TARGET study.
