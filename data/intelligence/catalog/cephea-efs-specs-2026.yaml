claims:
  - id: claim-cephea-efs-30d
    versionId: ver-cephea-efs-2021-2024
    category: evidence
    key: cephea-efs-30d
    label: EFS and compassionate use, 30 days
    value: Implanted 30 of 31; no procedural death or stroke; survival 30 of 31
    availability: reported
    basis: directly_reported
    context: >-
      Yadav et al. 2026: 24 EFS and 7 compassionate-use patients, Aug 2021-Jun 2024; first and updated valve versions
      pooled; one conversion to surgery after misdeployment.
    limitation: Interim analysis; no comparator; EFS funded by Abbott.
    observedAt: "2026-11-27"
    sourceRefs:
      - sourceId: src-cephea-yadav-jcin-2026
        locator: Abstract; Results, procedural outcomes
    reviewStatus: reviewed
  - id: claim-cephea-efs-mr
    versionId: ver-cephea-efs-2021-2024
    category: evidence
    key: cephea-efs-mr
    label: MR at 30 days (primary endpoint)
    value: MR mild or less in 27 of 27 with evaluable imaging
    availability: reported
    basis: directly_reported
    context: All patients (EFS and compassionate use), first and updated valve versions pooled.
    limitation: Compassionate-use imaging was not core-lab assessed.
    observedAt: "2026-11-27"
    sourceRefs:
      - sourceId: src-cephea-yadav-jcin-2026
        locator: Abstract, Results
    reviewStatus: reviewed
