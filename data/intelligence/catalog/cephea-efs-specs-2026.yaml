specs:
  - version: ver-cephea-efs-2021-2024
    category: mitral-replacement
    values:
      frame-material:
        value: Nitinol dual-disc outer frame; inner circular valve frame
        loc: Methods, device description
        source: src-cephea-yadav-jcin-2026
      leaflet-material:
        value: Trileaflet valve (tissue source not stated)
        loc: Methods, device description
        source: src-cephea-yadav-jcin-2026
      sealing-design:
        value: Atrial disc rests on the left atrial floor
        loc: Methods, device description
        source: src-cephea-yadav-jcin-2026
        context: Authors describe the discs as conforming to noncircular annuli, including irregular MAC.
      anchoring-mechanism:
        value: Radial and longitudinal compression; ventricular disc tines
        loc: Methods, device description
        source: src-cephea-yadav-jcin-2026
        context: No separate docking device or subvalvular anchor.
      access-route:
        value: Transfemoral venous, transseptal, single stage
        loc: Methods, device description; Methods, procedural description
        source: src-cephea-yadav-jcin-2026
        context: Venous cutdown with the first version (n=13); large-bore percutaneous access later (n=18).
      delivery-sheath:
        value: 36 F (outer dimension) delivery system
        loc: Methods, procedural description
        source: src-cephea-yadav-jcin-2026
        limitation: One figure for the cohort; not given by valve version.
      available-sizes:
        value: First version one size; updated 32, 36, 40 mm
        loc: Methods, device description
        source: src-cephea-yadav-jcin-2026
        context: A 28 mm size was under development.
      anatomy-range-summary:
        value: Perimeter 95.5-122.5 mm (first); 88-135 mm (updated)
        loc: Methods, device description
        source: src-cephea-yadav-jcin-2026
        context: Anteroposterior 27-34 mm (first) and 24-38 mm (updated).
      imaging-guidance:
        value: CT planning; TEE and fluoroscopy guidance
        loc: Methods, screening; Methods, procedural description
        source: src-cephea-yadav-jcin-2026
      post-implant-therapy:
        value: Warfarin, INR 2.5-3.5, at least 6 months (EFS)
        loc: Methods, procedural description
        source: src-cephea-yadav-jcin-2026
        limitation: Required for EFS subjects; the compassionate-use regimen is not stated.
      indication-scope:
        value: Investigational (US EFS and compassionate use)
        loc: Methods, study design
        source: src-cephea-yadav-jcin-2026
