families:
  - id: family-direct-flow-aortic-valve
    name: Direct Flow Medical Transcatheter Aortic Valve
    manufacturer: Direct Flow Medical
    description: >-
      The DISCOVER registry identifies the 18F valve system. The separate US SALUS pivotal study compared a Direct Flow
      Medical system with commercially available valves, with exact configurations unresolved in that registry. PDL
      later reported the original developer's operational shutdown and scoped asset transactions.
    entityIds:
      - dev-direct-flow-aortic-valve
    conditionIds:
      - cond-as
  - id: family-cardiokinetix-parachute
    name: CardioKinetix Parachute
    manufacturer: CardioKinetix
    description: >-
      Catheter-delivered left ventricular partitioning implant studied in ischemic heart failure. PARACHUTE IV and other
      registered studies were terminated. CardioKinetix reported company closure as the reason. The material reviewed
      does not establish legal dissolution or subsequent device ownership.
    entityIds:
      - dev-cardiokinetix-parachute
    conditionIds:
      - cond-hfref
  - id: family-mitralign-mpas
    name: Mitralign Percutaneous Annuloplasty System
    manufacturer: Mitralign
    description: >-
      MPAS plicates the posterior mitral annulus. ALIGN and the first-in-human study enrolled or planned to enroll
      patients with chronic functional mitral regurgitation. The current registry status of ALIGN is unknown. Trialign
      studied the tricuspid application separately.
    entityIds:
      - dev-mitralign-mpas
    conditionIds:
      - cond-mr
  - id: family-mitralign-trialign
    name: Mitralign Trialign
    manufacturer: Mitralign
    description: >-
      Trialign, also recorded as TriAlign or the Percutaneous Tricuspid Valve Annuloplasty System, was studied for
      symptomatic chronic functional tricuspid regurgitation. SCOUT and SCOUT-II now have unknown registry recruitment
      status.
    entityIds:
      - dev-mitralign-trialign
    conditionIds:
      - cond-tr
  - id: family-edwards-centera
    name: Edwards CENTERA
    manufacturer: Edwards Lifesciences
    description: >-
      Edwards studied CENTERA as a self-expanding transcatheter aortic valve for severe aortic stenosis. In July 2019
      Edwards announced its decision to discontinue the CENTERA program.
    entityIds:
      - dev-edwards-centera
    conditionIds:
      - cond-as
  - id: family-medtronic-engager
    name: Medtronic Engager
    manufacturer: Medtronic
    description: >-
      Medtronic registered a European pivotal study of the Engager transapical aortic valve system for severe aortic
      stenosis. The trial is complete. Current availability and later program disposition remain unverified.
    entityIds:
      - dev-medtronic-engager
    conditionIds:
      - cond-as
  - id: family-medtronic-freestyle
    name: Medtronic Freestyle
    manufacturer: Medtronic
    description: >-
      FDA approved the Freestyle aortic root bioprosthesis model 995 in 1997 for replacement of malfunctioning native or
      prosthetic aortic valves, with the option of aortic root replacement.
    entityIds:
      - dev-medtronic-freestyle
    conditionIds:
      - cond-as
      - cond-ar
  - id: family-medtronic-hancock-ii
    name: Medtronic Hancock II
    manufacturer: Medtronic
    description: >-
      FDA's 1999 decision identifies Hancock II porcine bioprosthesis models T505 and T510 for replacement of pathologic
      or prosthetic aortic and mitral valves.
    entityIds:
      - dev-medtronic-hancock-ii
    conditionIds:
      - cond-as
      - cond-ar
      - cond-mr
      - cond-ms
  - id: family-medtronic-mosaic
    name: Medtronic Mosaic
    manufacturer: Medtronic
    description: >-
      FDA approved the Mosaic porcine bioprosthesis models 305 (aortic) and 310 (mitral) in 2000 to replace
      malfunctioning native or prosthetic valves in the respective positions.
    entityIds:
      - dev-medtronic-mosaic
    conditionIds:
      - cond-as
      - cond-ar
      - cond-mr
      - cond-ms
  - id: family-trifecta
    name: Trifecta surgical aortic valves
    manufacturer: St. Jude Medical
    description: Original Trifecta and Trifecta GT under the same US PMA. The FDA market update identifies both models.
    entityIds:
      - dev-sjm-trifecta
      - dev-sjm-trifecta-gt
    conditionIds:
      - cond-as
      - cond-ar
  - id: family-novacor-lvas
    name: Novacor LVAS
    manufacturer: Novacor (historical program)
    description: >-
      FDA approved Novacor LVAS as a bridge to transplantation in patients at imminent risk from nonreversible left
      ventricular failure. The FDA record lists July 15, 2011 as the withdrawal date. Later service and asset ownership
      remain unverified.
    entityIds:
      - dev-novacor-lvas
    conditionIds:
      - cond-hfref
  - id: family-perimount-surgical
    name: Edwards PERIMOUNT surgical tissue valves
    manufacturer: Edwards Lifesciences
    description: >-
      Source-linked aortic and mitral models under PMA P860057. Model, position, and decision scope are retained
      separately.
    entityIds:
      - dev-perimount-original
