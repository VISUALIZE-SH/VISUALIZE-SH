claims:
  - id: claim-wor85-device-study-reuse-2026-1
    versionId: ver-sikelia-fih-study
    category: design
    key: wor85-device-study-reuse-2026-1
    label: Historical study construction and delivery
    value: >-
      Self-expanding frame; polyurethane trileaflet valve and skirt, automated dip molding;22 Fstudy delivery
      sheath.
    availability: reported
    basis: directly_reported
    context: Original Methods p 0030–40; study sizes 23,26,29 mm, not proof every size was implanted.
    limitation: No current commercial specification, comparative durability or TRISKELE cohort bridge.
    observedAt: '2026-11-02'
    sourceRefs:
