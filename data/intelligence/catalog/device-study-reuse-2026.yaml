          clinical outcome narrative.
    reviewStatus: reviewed
  - id: claim-wor85-device-study-reuse-2026-2
    versionId: ver-sikelia-fih-study
    category: evidence
    key: wor85-device-study-reuse-2026-2
    label: Historical first-in-human outcomes
    value: >-
      Device success 11/12; procedural success 10/12; one fatal delayed right-coronary obstruction and one
      complete valve retrieval.
    availability: reported
    basis: directly_reported
    context: Prospective uncontrolled 12-patient cohort; original Table 2 and Results p 0065.
    limitation: Small selected cohort; no comparative safety or durability conclusion.
    observedAt: '2026-11-02'
    sourceRefs:
      - sourceId: src-wor85-sikelia
        locator: >-
          Original XML Methods Device Description p0030–35; Implantation p0040; Results p0065; Table 2/tbl2;
          clinical outcome narrative.
    reviewStatus: reviewed
  - id: claim-wor85-device-study-reuse-2026-3
    versionId: ver-articor-pulmonary-study
    category: digital
    key: wor85-device-study-reuse-2026-3
    label: Sizing agreement and limits
    value: In 26 patients, hologram-to-implant diameter agreement 13/26 (50%); length 25/26 (96.15%).
    availability: reported
    basis: directly_reported
    context: Original Table 3/tbl 3, retrospective single-center Venus P-valve planning workflow.
    limitation: >-
      Table 4 covers approach, not sizing. Tissue elasticity/distensibility limitations; no improved clinical
      outcomes or FDA build bridge.
    observedAt: '2026-11-02'
    sourceRefs:
