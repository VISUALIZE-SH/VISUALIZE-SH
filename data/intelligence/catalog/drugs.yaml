families:
  - id: family-mavacamten
    name: Mavacamten
    manufacturer: Bristol Myers Squibb
    entityIds: [rx-mavacamten]
    conditionIds: [cond-hcm]
    description: First-in-class cardiac myosin inhibitor for symptomatic obstructive HCM; a supplemental adolescent indication was under FDA priority review as of this extraction.
  - id: family-aficamten
    name: Aficamten
    manufacturer: Cytokinetics
    entityIds: [rx-aficamten]
    conditionIds: [cond-hcm]
    description: Next-generation cardiac myosin inhibitor; the graph's regulatoryStatus for rx-aficamten predates its December 2025 approval as Myqorzo and needs updating.
  - id: family-tafamidis
    name: Tafamidis
    manufacturer: Pfizer
    entityIds: [rx-tafamidis]
    conditionIds: [cond-attr-cm]
    description: TTR stabilizer marketed as two non-interchangeable oral products (Vyndaqel 80 mg, Vyndamax 61 mg) sharing one ATTR-CM indication.
  - id: family-acoramidis
    name: Acoramidis
    manufacturer: BridgeBio Pharma
    entityIds: [rx-acoramidis]
    conditionIds: [cond-attr-cm]
    description: Near-complete TTR tetramer stabilizer approved for ATTR-CM.
  - id: family-vutrisiran
    name: Vutrisiran
    manufacturer: Alnylam Pharmaceuticals
    entityIds: [rx-vutrisiran]
    conditionIds: [cond-attr-cm]
    description: GalNAc-conjugated siRNA; the ATTR-CM indication is a 2025 supplement to the 2022 hATTR-polyneuropathy approval.
  - id: family-patisiran
    name: Patisiran
    manufacturer: Alnylam Pharmaceuticals
    entityIds: [rx-patisiran]
    conditionIds: [cond-attr-cm]
    description: IV siRNA approved only for hATTR polyneuropathy; the ATTR-CM supplemental indication was not approved (2023 Complete Response Letter).
  - id: family-dapagliflozin
    name: Dapagliflozin
    manufacturer: AstraZeneca
    entityIds: [rx-dapagliflozin]
    conditionIds: [cond-hfref, cond-hfpef]
    description: SGLT2 inhibitor; the original 2020 HFrEF indication was broadened in 2023 to heart failure across the full range of LVEF.
  - id: family-empagliflozin
    name: Empagliflozin
    manufacturer: Boehringer Ingelheim
    entityIds: [rx-empagliflozin]
    conditionIds: [cond-hfref, cond-hfpef]
    description: SGLT2 inhibitor; the 2021 HFrEF indication was broadened in 2022 to heart failure regardless of ejection fraction.
  - id: family-sacubitril-valsartan
    name: Sacubitril/Valsartan
    manufacturer: Novartis
    entityIds: [rx-sacubitril-valsartan]
    conditionIds: [cond-hfref, cond-hfpef]
    description: ARNI; the 2015 chronic-HF indication was relabeled in 2021 to remove the "reduced ejection fraction" qualifier, extending use toward HFpEF.
  - id: family-vericiguat
    name: Vericiguat
    manufacturer: Merck (MSD)
    entityIds: [rx-vericiguat]
    conditionIds: [cond-hfref]
    description: Soluble guanylate cyclase stimulator for worsening chronic HFrEF.
  - id: family-finerenone
    name: Finerenone
    manufacturer: Bayer
    entityIds: [rx-finerenone]
    conditionIds: [cond-hfpef]
    description: Nonsteroidal MRA; the HF (LVEF >=40%) indication is a 2025 supplement to the original CKD-in-T2D approval.
  - id: family-omecamtiv-mecarbil
    name: Omecamtiv Mecarbil
    manufacturer: Cytokinetics
    entityIds: [rx-omecamtiv-mecarbil]
    conditionIds: [cond-hfref]
    description: Cardiac myosin activator for HFrEF; the NDA received a 2023 Complete Response Letter and Cytokinetics has stated it has no plans for an additional trial.

versions:
  - id: ver-camzyos
    familyId: family-mavacamten
    name: Camzyos (mavacamten)
    kind: pharmaceutical
    clinicalRole: treats
    summary: Oral, echocardiography-guided cardiac myosin inhibitor for symptomatic obstructive HCM; boxed warning for heart-failure risk and a REMS program.
    sourceRefs:
      - sourceId: src-camzyos-label
        locator: 'Label §1 Indications and Usage; Boxed Warning'
    reviewStatus: draft
  - id: ver-myqorzo
    familyId: family-aficamten
    name: Myqorzo (aficamten)
    kind: pharmaceutical
    clinicalRole: treats
    summary: Second cardiac myosin inhibitor approved for symptomatic obstructive HCM; also echo-guided dosing with a boxed heart-failure warning and REMS.
    sourceRefs:
      - sourceId: src-myqorzo-label
        locator: 'Label §1 Indications and Usage; Boxed Warning'
    reviewStatus: draft
  - id: ver-vyndaqel-vyndamax
    familyId: family-tafamidis
    name: Vyndaqel/Vyndamax (tafamidis)
    kind: pharmaceutical
    clinicalRole: treats
    summary: Two dose-equivalent oral formulations (meglumine 80 mg vs. free acid 61 mg) sharing the ATTR-CM indication; the original US approval was for ATTR-CM itself.
    sourceRefs:
      - sourceId: src-vyndaqel-label
        locator: 'Label §1 Indications and Usage; §2 Dosage and Administration'
    reviewStatus: draft
  - id: ver-attruby
    familyId: family-acoramidis
    name: Attruby (acoramidis)
    kind: pharmaceutical
    clinicalRole: treats
    summary: Near-complete TTR stabilizer dosed as two tablets twice daily for ATTR-CM.
    sourceRefs:
      - sourceId: src-attruby-label
        locator: 'Label §1 Indications and Usage; §2.1'
    reviewStatus: draft
  - id: ver-amvuttra
    familyId: family-vutrisiran
    name: Amvuttra (vutrisiran)
    kind: pharmaceutical
    clinicalRole: treats
    summary: Quarterly subcutaneous siRNA; ATTR-CM indication (§1.2) added 2025-03-20 alongside the original hATTR-PN indication (§1.1).
    sourceRefs:
      - sourceId: src-amvuttra-label
        locator: 'Label §1.1-1.2 Indications and Usage'
    reviewStatus: draft
  - id: ver-onpattro
    familyId: family-patisiran
    name: Onpattro (patisiran)
    kind: pharmaceutical
    clinicalRole: treats
    summary: IV siRNA approved only for hATTR polyneuropathy; a supplemental ATTR-CM indication (APOLLO-B) was not approved.
    sourceRefs:
      - sourceId: src-onpattro-label
        locator: 'Label §1 Indications and Usage (no ATTR-CM indication present)'
      - sourceId: src-patisiran-crl
        locator: Press release, regulatory update on the ATTR-CM sNDA
    reviewStatus: draft
  - id: ver-farxiga
    familyId: family-dapagliflozin
    name: Farxiga (dapagliflozin)
    kind: pharmaceutical
    clinicalRole: treats
    summary: SGLT2 inhibitor indicated for heart failure across the full range of LVEF, following sequential HFrEF (2020) then full-spectrum (2023) approvals.
    sourceRefs:
      - sourceId: src-farxiga-label
        locator: 'Label §1 Indications and Usage'
    reviewStatus: draft
  - id: ver-jardiance
    familyId: family-empagliflozin
    name: Jardiance (empagliflozin)
    kind: pharmaceutical
    clinicalRole: treats
    summary: SGLT2 inhibitor indicated for heart failure regardless of LVEF, following sequential HFrEF (2021) then HFpEF-inclusive (2022) approvals.
    sourceRefs:
      - sourceId: src-jardiance-label
        locator: 'Label §1 Indications and Usage'
    reviewStatus: draft
  - id: ver-entresto
    familyId: family-sacubitril-valsartan
    name: Entresto (sacubitril/valsartan)
    kind: pharmaceutical
    clinicalRole: treats
    summary: ARNI indicated for chronic heart failure; a 2021 label change removed the "reduced ejection fraction" qualifier, noting benefit is most evident with LVEF below normal.
    sourceRefs:
      - sourceId: src-entresto-label
        locator: 'Label §1.1 Indications and Usage'
    reviewStatus: draft
  - id: ver-verquvo
    familyId: family-vericiguat
    name: Verquvo (vericiguat)
    kind: pharmaceutical
    clinicalRole: treats
    summary: Oral sGC stimulator for symptomatic chronic HFrEF following a recent worsening event.
    sourceRefs:
      - sourceId: src-verquvo-label
        locator: 'Label §1 Indications and Usage'
    reviewStatus: draft
  - id: ver-kerendia
    familyId: family-finerenone
    name: Kerendia (finerenone)
    kind: pharmaceutical
    clinicalRole: treats
    summary: Nonsteroidal MRA; the HF indication (LVEF >=40%) was added 2025-07-11 alongside the original CKD-in-T2D indication.
    sourceRefs:
      - sourceId: src-kerendia-label
        locator: 'Label §1 Indications and Usage'
    reviewStatus: draft
  - id: ver-omecamtiv
    familyId: family-omecamtiv-mecarbil
    name: Omecamtiv Mecarbil
    kind: pharmaceutical
    clinicalRole: treats
    summary: Selective cardiac myosin activator studied in GALACTIC-HF for HFrEF; the NDA is not approved (2023 Complete Response Letter).
    sourceRefs:
      - sourceId: src-omecamtiv-crl
        locator: Press release, FDA Complete Response Letter summary
    reviewStatus: draft

