    category: evidence
    key: wor92-encircle-two-year-study-2026-2
    label: 2-year MR and clinical outcomes
    value: >-
      MR ≤1+ 97.0%; all-cause death or HF hospitalization 35.6% (death 25.1%, HFH 23.0%); 1–2-year landmark death 13.0%,
      first HFH 10.6%.
    availability: reported
    basis: directly_reported
    context: Echo core laboratory and clinical events committee; Kaplan–Meier estimates.
    limitation: Echo among survivors with data; KM may overestimate nonfatal events with competing mortality.
    observedAt: "2026-11-08"
