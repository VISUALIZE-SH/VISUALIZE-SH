    versionId: ver-sapien-m3
    category: evidence
    key: wor92-encircle-two-year-study-2026-1
    label: Main cohort and 2-year follow-up
    value: 299 treated; 2-year follow-up data in 202 of 210 eligible patients (96.2%); mean STS-PROM for MVR 6.6%.
    availability: reported
    basis: directly_reported
    context: "ENCIRCLE main cohort: symptomatic ≥3+ MR, unsuitable for surgery or TEER; transseptal SAPIEN M3."
    limitation: Single-arm; 72% screen failure, mostly anatomical; not generalizable beyond selected anatomy.
    observedAt: "2026-11-08"
    sourceRefs:
      - sourceId: src-wor92-encircle-2y
        locator: Abstract Results; Study limitations.
