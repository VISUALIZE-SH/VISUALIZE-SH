    key: wor92-encircle-two-year-study-2026-3
    label: 2-year device-related events
    value: >-
      Disabling stroke 6.6%; clinically significant valve thrombosis 7.1%; hemolysis requiring intervention 7.6%; no
      clinically significant LVOT obstruction.
    availability: reported
