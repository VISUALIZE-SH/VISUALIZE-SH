  - id: claim-lv26-evoque-eu-1y-5
    versionId: ver-evoque
    category: evidence
    key: lv26-evoque-eu-1y-5
    label: Mortality at one year
    value: >-
      26 deaths within one year; Kaplan-Meier mortality 12.8% (95% CI 8.9-18.3); one-year vital status known in 226 of
      237.
    availability: reported
    basis: directly_reported
    context: >-
      Angellotti, Dannenberg et al., JACC: Cardiovascular Interventions, journal pre-proof online 22 Nov 2026:
      single-arm, retrospective study of 237 consecutive patients treated with the commercial EVOQUE system at 11
      European centers, October 2023 to July 2025; median age 80, median TRI-SCORE 5; median follow-up 367 days.
    limitation: >-
      Journal pre-proof full text; retrospective, single-arm; echocardiography site-reported without a core laboratory
      and events not adjudicated (Limitations). Paravalvular leak was associated with higher one-year mortality;
      TRI-SCORE with death or HF hospitalization (HR 1.26 per point, 95% CI 1.06-1.50).
    observedAt: "2026-11-27"
    sourceRefs:
      - sourceId: src-lv26-evoque-eu-real-world-1y
        locator: Results (one-year outcomes)
    reviewStatus: reviewed
