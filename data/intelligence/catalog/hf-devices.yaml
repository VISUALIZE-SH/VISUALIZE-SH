specs:
  - version: ver-cardiomems
    category: hf-pressure-sensors
    source: src-cardiomems-ssed-orig
    values:
      device-design:
        value: 'Fused-silica capsule (15x3.4x2 mm), silicone-coated, nitinol anchors'
        loc: 'SSED (P100045B) p.1-2, Section V Device Description'
        context: 'Battery-free; wire-loop anchors around a coil/capacitor circuit. Capsule is a 3-D coil and pressure-sensitive capacitor between two fused-silica wafers, fully encased in medical-grade silicone; platinum/iridium marker bands aid fluoroscopic visualization.'
      sensor-location:
        value: 'Descending branch of the left or right pulmonary artery'
        loc: 'SSED (P100045B) p.2, Section V Device Description'
      measured-parameter:
        value: 'PA systolic/diastolic/mean pressure; heart rate'
        loc: 'SSED (P100045B) p.1, Section V Device Description'
        context: 'Daily patient self-measurement.'
      power-telemetry:
        value: 'Battery-free; read remotely via electromagnetic coupling'
        loc: 'SSED (P100045B) p.1-2, Section V Device Description'
        context: 'Resonant frequency of the implanted circuit read via the Hospital/Patient Electronics Systems.'
      access-route:
        value: 'Transvenous, placed during right heart catheterization'
        loc: 'SSED (P100045B) p.6, Clinical Studies'
      delivery-sheath:
        value: '12 Fr sheath; 120 cm catheter; 0.018 in wire'
        loc: 'SSED (P100045B) p.3, Section V Device Description'
        context: 'Usable-length catheter; guidewire-compatible; hydrophilic-coated distal shaft.'
      available-sizes:
        value: 'Single size (fits PA branch 7-15 mm diameter)'
        loc: 'SSED (P100045B) p.17, Enrollment Criteria'
      anatomy-range-summary:
        value: 'Target implant PA branch diameter 7-15 mm'
        loc: 'SSED (P100045B) p.17, Enrollment Criteria'
        context: 'CHAMPION pivotal-trial enrollment criterion for implant branch diameter, not restated as a separate labeled range in the 2022 supplement.'
      indication-scope:
        value: 'NYHA II/III HF with prior-year HF hospitalization or elevated BNP'
        source: src-cardiomems-s056-ssed
        loc: 'SSED (P100045/S056) p.1, Section II Indications for Use'
        context: 'Natriuretic peptides must be elevated within 30 days. 2022 expanded indication (PMA supplement P100045/S056). The original 2014 PMA indication was narrower: NYHA III with HF hospitalization in the prior year.'
      post-implant-therapy:
        value: 'Contraindicated if unable to take DAPT/anticoagulation x1 month'
        loc: 'SSED (P100045B) p.1, Section III Contraindications'
        context: 'Required for 1 month post-implant (dual antiplatelet therapy or anticoagulation).'
      pivotal-trials:
        value: 'CHAMPION (original 2014 indication); GUIDE-HF (2022 expanded indication)'
        source: src-cardiomems-s056-ssed
        loc: 'SSED (P100045/S056) p.7, GUIDE-HF Trial - Randomized Arm'

  - version: ver-cordella
    category: hf-pressure-sensors
    source: src-cordella-ssed
    values:
      device-design:
        value: 'Capacitive pressure sensor, glass body (~20x4x2 mm), nitinol anchors'
        loc: 'SSED (P230040B) p.1-3, Section V Device Description'
        context: 'Battery-less, silicone-coated (CorPASS). Used with the Cordella HF System for home vital-sign capture and clinician review.'
      sensor-location:
        value: 'Interlobar right pulmonary artery (RPA downturn diameter 12-26 mm)'
        loc: 'SSED (P230040B) p.2, Section V Device Description'
      measured-parameter:
        value: 'Pulmonary artery pressure; on-demand patient self-reading at home'
        loc: 'SSED (P230040B) p.1-2, Section V Device Description'
      power-telemetry:
        value: 'Battery-free; wirelessly powered via myCordella handheld Reader'
        loc: 'SSED (P230040B) p.4, Section V Device Description'
        context: 'Interrogated at home by the patient.'
      access-route:
        value: 'Femoral or jugular venous access'
        loc: 'SSED (P230040B) p.17, Engineering Study Results'
      delivery-sheath:
        value: '14 Fr minimum sheath ID; 122 cm delivery catheter; 0.025 in max guidewire OD'
        source: src-cordella-labeling
        loc: 'Labeling (P230040C) p.9, Delivery System specifications'
      available-sizes:
        value: 'Single size (fits RPA downturn diameter 12-26 mm)'
        loc: 'SSED (P230040B) p.2-3, Section V Device Description'
      anatomy-range-summary:
        value: 'RPA downturn diameter 12-26 mm required for secure sensor stabilization'
        loc: 'SSED (P230040B) p.2, Section V Device Description'
      indication-scope:
        value: 'NYHA III HF, on diuretics/GDMT, stable 30 days on GDMT'
        loc: 'SSED (P230040B) p.1, Section II Indications for Use'
        context: 'At-home patients.'
