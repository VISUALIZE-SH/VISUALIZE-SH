# needs-fulltext:
#   - attribute: delivery-sheath (V-Wave Ventura interatrial shunt, ver-vwave-ventura)
#     note: Reviewed sources (ESC Heart Failure 2024 fluid-dynamics paper; Structural Heart
#       2025 review) describe a "custom delivery catheter" without a stated French size.
#       RK.md blog references a sheath but does not state Fr; not used as it is not a
#       peer-reviewed/primary source.
#   - attribute: delivery-sheath (Edwards APTURE transcatheter shunt, ver-edwards-apture)
#     note: WebSearch snippets suggested 20F (transjugular) or 24F introducer figures but
#       the underlying sources (JACC:CVI 2023 Hibbert et al., doi:10.1016/j.jcin.2023.03.012;
#       ALT-FLOW II design paper, doi:10.1093/ejhf/xuaf016) are paywalled and were not
#       independently confirmed in full text, so the value is omitted rather than guessed.
#   - attribute: delivery-sheath (A-FLUX Reducer System, ver-aflux)
#     note: vahaticor.com "Device & Technology" page describes transvenous delivery but does
#       not publish a French size.
#   - attribute: post-implant-therapy (Corvia Atrial Shunt, ver-corvia-shunt; V-Wave Ventura,
#       ver-vwave-ventura)
#     note: Corvia US patient guide (00697AW Rev01, 2024-02) only says "take your medications
#       as directed"; no specific antithrombotic regimen is publicly stated. The V-Wave
#       ESC Heart Failure 2024 paper and the Structural Heart 2025 review do not state a
#       labeled post-implant antithrombotic regimen for Ventura (investigational device, no
#       US labeling exists yet).
