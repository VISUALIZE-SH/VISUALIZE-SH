      access-route:
        value: 'Femoral venous access'
        loc: 'Section 3.3, FIRE1 System, Now NORM System'
      delivery-sheath:
        value: '16 Fr introducer sheath; custom delivery system'
        loc: 'Section 3.3, FIRE1 System, Now NORM System'
