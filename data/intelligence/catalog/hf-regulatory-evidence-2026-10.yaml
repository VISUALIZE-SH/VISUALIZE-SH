claims:
  - id: claim-wor81-b01-1
    versionId: ver-cardyograft-patch
    category: evidence
    key: aams2-study-configuration
    label: Study scope and evidence limits
    value: >-
      The AAMS2 protocol uses a Hemopatch collagen-based sheet with atrial micrografts in a fibrin matrix; the control
      receives the patch without micrografts.
    availability: reported
    basis: directly_reported
    context: >-
      Academic AAMS2 NCT05632432 protocol; trial-specific materials do not establish current CardYograft kit
      composition.
    limitation: Academic AAMS2 protocol; not a finalized commercial kit specification or an authorization.
    observedAt: "2026-10-26"
    sourceRefs:
      - sourceId: src-wor81-b01-1
        locator: "Methods: Preparation and administration of atrial appendage micrografts; Trial status"
    reviewStatus: reviewed
  - id: claim-wor81-b01-2
    versionId: ver-cardyograft-patch
    category: evidence
    key: aams2-protocol-timeline
    label: Study scope and evidence limits
    value: >-
      The 2026 protocol reports 10 participants recruited at publication and projects recruitment completion in late
      2027 and full completion in mid-2028.
    availability: reported
    basis: directly_reported
    context: >-
      AAMS2 protocol publication 2026-01-02, not current recruitment or a results publication; differs from older
      registry estimates.
    limitation: >-
      Publication-time projection, not current recruitment or actual completion; registry revision 2024-04-19 carries
      older estimates.
    observedAt: "2026-10-26"
    sourceRefs:
      - sourceId: src-wor81-b01-1
        locator: "Methods: Preparation and administration of atrial appendage micrografts; Trial status"
    reviewStatus: reviewed
