families:
  - id: fam-angel-wings
    name: Angel Wings septal occluder
    manufacturer: Not established
    entityIds:
      - dev-angel-wings
    conditionIds:
      - cond-asd
      - cond-pfo
    description: >-
      Opposed fabric-covered square nitinol frames span the septum. In the original feasibility study, incomplete disk
      deployment and device explantation were reported.
  - id: fam-asdos
    name: ASDOS septal occluder
    manufacturer: Not established
    entityIds:
      - dev-asdos
    conditionIds:
      - cond-asd
      - cond-pfo
    description: >-
      Two screw-joined, polyurethane-covered nitinol umbrellas were placed across the septum. Follow-up of the refined
      design documented frame fracture and late tamponade.
  - id: fam-chore
    name: ChoRe chordal repair prototype
    manufacturer: Not established
    entityIds:
      - dev-chore
    conditionIds:
      - cond-mr
    description: >-
      A prototype for attaching and adjusting artificial mitral chords was evaluated in dissected bovine hearts. The
      functional prototype was built at twice the intended scale.
  - id: fam-circular-septal-stapler
    name: Circular septal patch stapler
    manufacturer: Not established
    entityIds:
      - dev-circular-septal-stapler
    conditionIds:
      - cond-asd
    description: Investigators adapted a surgical circular stapler for beating-heart atrial septal defect closure in pigs.
  - id: fam-icoapsys
    name: iCoapsys ventricular reshaping system
    manufacturer: Myocor, Inc.
    entityIds:
      - dev-icoapsys
    conditionIds:
      - cond-mr
      - cond-hf
    description: >-
      Percutaneously placed epicardial pads and a transventricular chord were evaluated in sheep. The registered VIVID
      study’s actual enrollment remains unknown.
  - id: fam-monarc
    name: Edwards MONARC
    manufacturer: Edwards Lifesciences
    entityIds:
      - dev-monarc
    conditionIds:
      - cond-mr
    description: >-
      MONARC used a shortening bridge between coronary venous anchors. EVOLUTION phase I reported coronary compression
      and two myocardial infarctions with the second-generation implant.
  - id: fam-myosplint
    name: Myosplint
    manufacturer: Myocor, Inc.
    entityIds:
      - dev-myosplint
    conditionIds:
      - cond-hf
    description: >-
      Transventricular tension members reshaped the left ventricle in small feasibility studies. The early seven-patient
      report documents intraoperative repositioning.
  - id: fam-ps3
    name: Ample Medical PS3
    manufacturer: Ample Medical
    entityIds:
      - dev-ps3
    conditionIds:
      - cond-mr
    description: >-
      Two temporary implants tested percutaneous septal-lateral shortening before planned mitral surgery. Separate
      healthy-sheep work examined longer implantation.
  - id: fam-quantumcor
    name: QuantumCor radiofrequency annuloplasty
    manufacturer: Not established
    entityIds:
      - dev-quantumcor
    conditionIds:
      - cond-mr
    description: >-
      A flexible multielectrode probe heated the mitral annulus in an open-heart sheep study. Four treated animals
      reached the planned 180-day endpoint.
  - id: fam-viacor-ptma
    name: Viacor PTMA
    manufacturer: Viacor
    entityIds:
      - dev-viacor-ptma
    conditionIds:
      - cond-mr
    description: >-
      The second-generation permanent PTMA used rods in a coronary venous catheter. The trial report attributes two
      deaths to the device and states that development stopped.
  - id: fam-double-biodisk
    name: Double BioDisk
    manufacturer: Cook Medical (prototype work with Dotter Institute)
    entityIds:
      - dev-double-biodisk
    conditionIds:
      - cond-asd
    description: >-
      The experimental double-disk implant paired nitinol rings with porcine small-intestinal submucosa. Two
      deliberately dislodged devices were recaptured in acute sheep tests.
  - id: fam-dyana
    name: MiCardia DYANA
    manufacturer: MiCardia Corp.
    entityIds:
      - dev-dyana
    conditionIds:
      - cond-mr
    description: >-
      The complete nitinol ring could shorten or lengthen after initial repair, depending on the variant. Only the
      shortening variant was activated in the 35-patient study.
  - id: fam-encorsq
    name: MiCardia EnCorSQ
    manufacturer: MiCardia Corp.
    entityIds:
      - dev-encorsq
    conditionIds:
      - cond-mr
    description: >-
      The D-shaped ring was designed for later adjustment using an implanted lead. A clinical report attributed three
      failed adjustments to a wire defect.
  - id: fam-bace
    name: BACE external basal annuloplasty
    manufacturer: Not established
    entityIds:
      - dev-bace
    conditionIds:
      - cond-mr
    description: >-
      An external polyester mesh wrap was tailored to the atrioventricular groove in an early operative series that
      included concomitant cardiac procedures.
  - id: fam-mitra-spacer
    name: Mitra-Spacer
    manufacturer: Cardiosolutions
    entityIds:
      - dev-mitra-spacer
    conditionIds:
      - cond-mr
    description: >-
      The transapical mitral balloon spacer changed volume during the cardiac cycle. Its filling volume was adjusted in
      the published first-human case.
  - id: fam-cierra-pfx
    name: Cierra PFx
    manufacturer: Cierra
    entityIds:
      - dev-cierra-pfx
    conditionIds:
      - cond-pfo
    description: >-
      The catheter used suction and radiofrequency energy to close the PFO without a permanent implant. The published
      feasibility series reports four catheter variants and a separate closure endpoint.
  - id: fam-plcl-bao
    name: PLCL/PGA bioabsorbable septal occluder
    manufacturer: Not established
    entityIds:
      - dev-plcl-bao
    conditionIds:
      - cond-asd
      - cond-pfo
    description: >-
      A sheep study evaluated two generations of a polymer disk occluder. Shape recovery limited the first version.
      Three of the six sheep receiving the revised version reached one year.
  - id: fam-mitral-leaflet-plication-clip
    name: Posterior mitral leaflet plication clip
    manufacturer: Not established
    entityIds:
      - dev-mitral-leaflet-plication-clip
    conditionIds:
      - cond-mr
    description: >-
      A closed nitinol clip gathered a prolapsed posterior leaflet segment under direct vision. Chord entanglement and
      oblique clip placement left residual regurgitation in two pigs.
  - id: fam-reflective-septal-patch-catheter
    name: Light-reflecting septal patch catheter
    manufacturer: Not established
    entityIds:
      - dev-reflective-septal-patch-catheter
    conditionIds:
      - cond-vsd
    description: >-
      Balloon support and a reflective light-delivery surface attached an adhesive patch in acute beating-heart septal
      defect experiments.
  - id: fam-solysafe
    name: Solysafe Septal Occluder
    manufacturer: Swissimplant AG
    entityIds:
      - dev-solysafe
    conditionIds:
      - cond-asd
      - cond-pfo
    description: >-
      Follow-up of the wire-framed septal occluder revealed fractures, including fractures missed by routine chest
      radiography or transthoracic echo in separate cohorts.
  - id: fam-mobius-neochord-prototype
    name: Mobius suction-and-suture neochord prototype
    manufacturer: Edwards Lifesciences (therapy catheter)
    entityIds:
      - dev-mobius-neochord-prototype
    conditionIds:
      - cond-mr
    description: >-
      The pig study repurposed a Mobius therapy catheter and separate apical guide to capture mitral leaflet tissue and
      place artificial chords.
  - id: fam-v-chordal
    name: V-Chordal adjustable neochordae
    manufacturer: Valtech Cardio Ltd.
    entityIds:
      - dev-v-chordal
    conditionIds:
      - cond-mr
    description: >-
      The adjustable concept was evaluated in pigs. A separately registered Edwards feasibility study named V-Chordal
      and terminated after five actual enrollees.
  - id: fam-cardiofit
    name: BioControl CardioFit
    manufacturer: BioControl Medical
    entityIds:
      - dev-cardiofit
    conditionIds:
      - cond-hfref
    description: >-
      The INOVATE-HF system used a cervical stimulation cuff and ventricular sensing lead. An independent monitoring
      board recommended stopping the randomized trial for futility.
