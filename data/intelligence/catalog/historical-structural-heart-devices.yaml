    key: late-tamponade-and-perforation
    label: Late tamponade and perforation
    value: >-
      Three patients developed tamponade 5, 6 and 8 months after implantation. Surgery confirmed a wall perforation in
      two. The report leaves the bleeding site unidentified in the third. The investigators observed device
      endothelialization and defect closure in all three.
    availability: reported
    basis: directly_reported
