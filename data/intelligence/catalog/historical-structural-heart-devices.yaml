    versionId: ver-asdos-refined
    category: evidence
    key: follow-up-frame-fractures
    label: Follow-up frame fractures
    value: >-
      Frame fractures were reported in 23 of 163 follow-up patients, close to the central hub. Two early fractures with
      a change in device position prompted surgery at three days and six weeks. The investigators reported no migration
      of fractured arms in this cohort.
    availability: reported
    basis: directly_reported
    context: Original multicenter feasibility series, distinct from the eight-patient surgical-explant report.
