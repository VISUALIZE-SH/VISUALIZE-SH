  - id: family-omega-laa
    name: OMEGA LAA
    manufacturer: Eclipse Medical
    entityIds: [dev-omega-laa]
    conditionIds: [cond-af]
    description: Historical LAA occluder; manufacturer recalled all unused stock in November 2024.
  - id: family-lacbes
    name: LACbes
    manufacturer: Push Medical
    entityIds: [dev-lacbes]
