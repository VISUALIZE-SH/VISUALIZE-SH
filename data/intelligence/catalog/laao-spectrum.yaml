    name: Ultraseal
    manufacturer: Cardia
    entityIds: [dev-ultraseal, dev-ultraseal-ii]
    conditionIds: [cond-af]
    description: Original and Ultraseal II generations are tracked separately; present availability unverified.
  - id: family-cardioblate-closure
