versions:
  - id: ver-lux-valve-plus
    familyId: family-lux-valve-plus
    graphEntityId: dev-lux-valve-plus
    name: LuX-Valve Plus (transjugular)
    kind: device
    clinicalRole: treats
    summary: >-
      Jenscare transjugular TTVR system with a septal anchor and leaflet graspers, studied in compassionate use, EU
      TRINITY and the US TRINITY studies. Values are for LuX-Valve Plus only; first-generation (transatrial) LuX-Valve
      data are excluded.
    sourceRefs:
      - sourceId: src-luxp-donal-2026
        locator: Device Overview; Technical Characteristics
      - sourceId: src-luxp-ce-news
        locator: News paragraphs 1-2
    reviewStatus: reviewed
specs:
  - version: ver-lux-valve-plus
    category: tricuspid-replacement
    values:
      expansion-mechanism:
        value: Self-expanding
        loc: Technical Characteristics section
        source: src-luxp-donal-2026
      frame-material:
        value: Nitinol stent frame
        loc: Technical Characteristics section
        source: src-luxp-donal-2026
      leaflet-material:
        value: Bovine pericardium, trileaflet
        loc: Technical Characteristics section
        source: src-luxp-donal-2026
      tissue-treatment:
        value: JeniGal anti-calcification treatment (sponsor, 2022)
        loc: PDF pp. 220 and 230 (LuX-Valve valve tissue); p. 241 (Plus valve adopts the same design)
        source: src-luxp-prospectus-2022
        context: The 2022 prospectus states it for the LuX-Valve implant and says the Plus implant has the same design.
        limitation: No Plus-specific statement in a 2026 document was found.
        basis: derived
      sealing-design:
        value: Self-adaptive fabric skirt (sponsor)
        loc: News paragraph 2
        source: src-luxp-ce-news
      anchoring-mechanism:
        value: Septal anchor plus anterior and posterior leaflet graspers
        loc: Technical Characteristics section; Table 1
        source: src-luxp-donal-2026
      repositionable:
        value: Recapture still possible after ventricular-side deployment
        loc: Procedural technique, Step 2
        source: src-luxp-chen-acs-2026
        limitation: Technique description of one procedure; not a labeled device feature.
      access-route:
        value: Transjugular (right internal jugular vein)
        loc: Procedural technique, Step 1
        source: src-luxp-chen-acs-2026
        context: Consistent with Donal 2026 (Device Overview).
      delivery-sheath:
        value: 33 F compatible steerable delivery system
        loc: Technical Characteristics section; Table 1
        source: src-luxp-donal-2026
      available-sizes:
        value: Seven sizes, 40-70 mm (sponsor)
        loc: News paragraph 2
        source: src-luxp-ce-news
        limitation: The US early feasibility record lists models up to 65 mm only.
      anatomy-range-summary:
        value: Annulus up to 70 mm; minimum inner ring 30 mm (sponsor)
        loc: PDF p. 2, paragraph 1
        source: src-luxp-trinity-12m
      imaging-guidance:
        value: CT planning; TEE and fluoroscopy guidance
        loc: Imaging sections (planning and intraprocedural guidance)
        source: src-luxp-donal-2026
      indication-scope:
        value: EU MDR CE certificate (sponsor, Jul 2026)
        loc: News headline and paragraph 1
        source: src-luxp-ce-news
        limitation: No certificate or intended-use statement was opened.
      post-implant-therapy:
        value: DOAC 42.5% or VKA 53.5% after discharge (compassionate use)
        loc: Results, paragraph 3
        source: src-luxp-stolz-ejhf-2025
        context: Observed practice, not a protocol; aspirin in 5.7%.
      pivotal-trials:
        value: "TRINITY pivotal (NCT07454980): vs EVOQUE plus single-arm cohort"
        loc: Design and arms modules
        source: src-luxp-trinity-pivotal-registry
        context: Recruiting; about 680 planned, 400 randomized 2:1 against EVOQUE in eligible patients.
