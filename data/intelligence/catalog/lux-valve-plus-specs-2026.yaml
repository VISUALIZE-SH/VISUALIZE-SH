claims:
  - id: claim-luxp-trinity-12m-eff
    versionId: ver-lux-valve-plus
    category: evidence
    key: luxp-trinity-12m-eff
    label: EU TRINITY 12 months (sponsor)
    value: TR moderate or less 80.6% (n=126); NYHA I/II 92.1% (n=127)
    availability: reported
    basis: directly_reported
    context: >-
      Jenscare voluntary announcement (HKEXnews, 23 Nov 2026): EU TRINITY, prospective single-arm, 20 centers; 12-month
      full analysis set 149; presented at PCR London Valves 2026. Device success 96.6%.
    limitation: Sponsor filing; KCCQ and 6-minute walk denominators not stated.
    observedAt: "2026-11-27"
    sourceRefs:
      - sourceId: src-luxp-trinity-12m
        locator: PDF p. 2, efficacy results
    reviewStatus: reviewed
  - id: claim-luxp-trinity-12m-safety
    versionId: ver-lux-valve-plus
    category: evidence
    key: luxp-trinity-12m-safety
    label: EU TRINITY 12-month events (sponsor)
    value: CV death 6.0%; severe bleeding 6.7%; AV-block pacemaker 8.7% (n=149)
    availability: reported
    basis: directly_reported
    context: >-
      Jenscare voluntary announcement (HKEXnews, 23 Nov 2026): EU TRINITY, prospective single-arm, 20 centers; 12-month
      full analysis set 149; presented at PCR London Valves 2026. Composite event rate 24.8%.
    limitation: Sponsor filing of CEC-adjudicated events; no paper yet.
    observedAt: "2026-11-27"
    sourceRefs:
      - sourceId: src-luxp-trinity-12m
        locator: PDF p. 3, CEC-adjudicated events table
    reviewStatus: reviewed
  - id: claim-luxp-compassionate-1y
    versionId: ver-lux-valve-plus
    category: evidence
    key: luxp-compassionate-1y
    label: Compassionate use, 1 year
    value: Survival 77.7%; TR 1+ or less 78.4%; clinical success 76.9%
    availability: reported
    basis: directly_reported
    context: "Stolz et al. 2025: 74 patients at 16 centers, 2019-2024; one-year follow-up in 39 of 41 eligible."
    limitation: Retrospective; no core laboratory or event committee.
    observedAt: "2026-11-27"
    sourceRefs:
      - sourceId: src-luxp-stolz-ejhf-2025
        locator: Results (one-year outcomes)
    reviewStatus: reviewed
  - id: claim-luxp-large-anatomy-30d
    versionId: ver-lux-valve-plus
    category: evidence
    key: luxp-large-anatomy-30d
    label: Large anatomies, 30 days (EU TRINITY)
    value: "55-70 mm valves (n=114): 30-day clinical success 91.2%"
    availability: reported
    basis: directly_reported
    context: >-
      De Backer et al., EuroIntervention 2026: EU TRINITY patients treated with the four largest sizes; new pacemaker
      6.1% at 30 days.
    limitation: Abstract only; full text not read.
    observedAt: "2026-11-27"
    sourceRefs:
      - sourceId: src-luxp-debacker-eij-2026
        locator: Abstract, Results
    reviewStatus: reviewed
  - id: claim-luxp-annulus-size
    versionId: ver-lux-valve-plus
    category: evidence
    key: luxp-annulus-size
    label: Large vs small annulus (China)
    value: TVARC clinical success 73.8% (large, n=42) vs 94.9% (small, n=117)
    availability: reported
    basis: directly_reported
    context: >-
      Chen et al., JACC: Cardiovascular Interventions 2026: 159 patients at 13 centers, May 2022-Mar 2024; large annulus
      = perimeter-derived diameter 51 mm or more, or maximal diameter 55 mm or more.
    limitation: Abstract only; full text not read.
    observedAt: "2026-11-27"
    sourceRefs:
      - sourceId: src-luxp-chen-jcin-2026
        locator: Abstract, Results
    reviewStatus: reviewed
