families:
  - id: family-lotus-edge
    name: LOTUS
    manufacturer: Boston Scientific
    entityIds:
      - dev-lotus-edge
      - dev-lotus-original
    conditionIds:
      - cond-as
    description: Boston Scientific’s first-generation LOTUS and modified LOTUS Edge systems. US approval and subsequent product discontinuation are recorded with device and cohort scope.
  - id: family-konect-resilia
    name: Edwards KONECT RESILIA
    manufacturer: Edwards Lifesciences
    entityIds:
      - dev-konect-resilia
    conditionIds:
      - cond-complex-aortic-root-disease
    description: FDA supplement P150048/S029 names the KONECT RESILIA Aortic Valved Conduit, model 11060A.
  - id: family-mitris-resilia
    name: Edwards MITRIS RESILIA
    manufacturer: Edwards Lifesciences
    entityIds:
      - dev-mitris-resilia
    conditionIds:
      - cond-mr
      - cond-ms
    description: >-
      FDA supplement P150048/S047 names MITRIS RESILIA and documents changes to the wireform, sewing ring, valve holder
      and handle.
  - id: family-avalus
    name: Avalus
    manufacturer: Medtronic
    entityIds:
      - dev-avalus-ultra
      - dev-avalus
    conditionIds:
      - cond-as
      - cond-ar
    description: Medtronic surgical aortic valve family with separate original Avalus and Avalus Ultra decisions.
  - id: family-perceval
    name: Perceval
    manufacturer: CORCYM
    entityIds:
      - dev-perceval-plus
      - dev-perceval
    conditionIds:
      - cond-as
      - cond-ar
    description: Sutureless surgical aortic valve family with separate original Perceval and Perceval PLUS decisions.
  - id: family-sapien-3-alterra
    name: Edwards SAPIEN 3 with Alterra Adaptive Prestent
    manufacturer: Edwards Lifesciences
    entityIds:
      - dev-sapien-3-alterra
    conditionIds:
      - cond-pv
    description: >-
      SAPIEN 3 transcatheter pulmonary valve system combined with Alterra Adaptive Prestent for severe pulmonary
      regurgitation in a native or surgically repaired right ventricular outflow tract.
  - id: family-inspiris-resilia
    name: Edwards INSPIRIS RESILIA
    manufacturer: Edwards Lifesciences
    entityIds:
      - dev-inspiris-resilia
    conditionIds:
      - cond-as
      - cond-ar
    description: INSPIRIS RESILIA model 11500A was approved for replacement of native or prosthetic aortic valves.
  - id: family-abbott-epic-plus
    name: Biocor and Epic surgical valves
    manufacturer: Abbott
    entityIds:
      - dev-abbott-epic-plus
      - dev-sjm-biocor
      - dev-sjm-epic
    conditionIds:
      - cond-as
      - cond-mr
    description: St. Jude Medical and Abbott surgical tissue valves recorded under P040021. Biocor, Epic, and Epic Plus retain configuration-specific FDA decisions.
  - id: family-on-x
    name: On-X
    manufacturer: On-X Life Technologies
    entityIds:
      - dev-on-x-aortic
      - dev-on-x-mitral
    conditionIds:
      - cond-as
      - cond-ar
      - cond-mr
      - cond-ms
    description: On-X surgical prosthetic heart valve family with separately documented aortic and mitral models.
  - id: family-biotronik-biovalve
    name: BIOTRONIK BIOVALVE
    manufacturer: BIOTRONIK
    entityIds:
      - dev-biotronik-biovalve
    conditionIds:
      - cond-as
    description: >-
      The registered European first-in-human BIOVALVE I/II study evaluates the self-expanding BIOVALVE prosthesis for
      transfemoral treatment of severe symptomatic aortic stenosis.
