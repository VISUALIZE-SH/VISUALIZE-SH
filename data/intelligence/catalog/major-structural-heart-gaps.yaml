    category: fit
    key: source-scope
    label: U.S. approval scope
    availability: reported
    basis: directly_reported
    value: >-
      The original U.S. LOTUS Edge approval covered severe symptomatic native calcific aortic stenosis at high or
      greater surgical risk.
    limitation: >-
      Boston Scientific announced global product discontinuation and recall of unused inventory in November 2020. The
      cited announcement describes a delivery-system recall.
    observedAt: "2019-04-23"
    sourceRefs:
      - sourceId: src-issuer-preview-p180029
        locator: PMA P180029, FDA Device, Decision Date and Approval Order Statement fields
    reviewStatus: reviewed
  - id: claim-issuer-konect-resilia-scope
