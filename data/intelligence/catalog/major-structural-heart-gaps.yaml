    value: >-
      FDA supplement P170006/S025 names the Avalus Ultra design and documents a radiopaque marker plus changes to the
      stent base and sewing ring.
    limitation: The Avalus Ultra design is separate from original Avalus model 400. Material and sizing claims are unreviewed.
    observedAt: "2024-01-31"
    sourceRefs:
      - sourceId: src-issuer-preview-p170006-s025
