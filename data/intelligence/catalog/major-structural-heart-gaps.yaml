    limitation: This is the named design decision. Later tricuspid TRIFORMIS authorization is a separate scoped decision.
    observedAt: "2022-03-16"
    sourceRefs:
      - sourceId: src-issuer-preview-p150048-s047
        locator: PMA P150048/S047, FDA Device, Decision Date and Approval Order Statement fields
