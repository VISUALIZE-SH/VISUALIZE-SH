      shorter inflow ring for the XL size.
    limitation: The inflow-ring modification is scoped to XL. Original Perceval data remains on the original model.
    observedAt: "2020-10-16"
    sourceRefs:
      - sourceId: src-issuer-preview-p150011-s013
        locator: PMA P150011/S013, FDA Device, Decision Date and Approval Order Statement fields
