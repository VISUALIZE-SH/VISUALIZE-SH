claims:
  - id: claim-lv26-maple-bio-1
    versionId: ver-myqorzo
    category: evidence
    key: lv26-maple-bio-1
    label: MAPLE-HCM NT-proBNP change
    value: NT-proBNP −73% with aficamten vs +42% with metoprolol; treatment effect −81% (95% CI −85% to −76%).
    availability: reported
    basis: directly_reported
    context: >-
      MAPLE-HCM (NCT05767346) randomized trial in symptomatic obstructive HCM: aficamten (n=88) vs metoprolol (n=87);
      geometric or mean change from baseline to end of 24-week therapy. Geometric mean NT-proBNP; P<0.001.
    limitation: >-
      Biomarker analysis of a randomized trial; abstract-only. Both biomarkers returned to baseline after washout. Trial
      regimen, not label dosing, and not a clinical-outcome result; the abstract names aficamten, not the Myqorzo brand.
    observedAt: "2026-11-27"
    sourceRefs:
