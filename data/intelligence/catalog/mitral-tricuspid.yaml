specs:
  - version: ver-triclip-g4
    category: [tricuspid-teer]
    source: src-triclip-ifu
    values:
      frame-material:
        value: Cobalt-chromium alloy clip arms/body; nitinol grippers
        source: src-triclip-ifu
        loc: 'PDF p.5, Section 3.0 Contraindications (implant-component hypersensitivity)'
      grasping-mechanism:
        value: Independent or simultaneous leaflet grasping (implant identical to MitraClip G4)
        basis: derived
        loc: 'PDF p.4, Section V Device Description ("identical to...MitraClip G4 implant...in formulation, geometry")'
        source: src-triclip-ssed
        context: TriClip G4 SSED states the implant is identical to the commercially available MitraClip G4 implant; MitraClip G4's own design-change approval (P100009/S029) added independent, simultaneous gripper actuation.
      available-sizes:
        value: 'Four sizes: NT, NTW, XT, XTW'
        loc: 'PDF p.4, Table 2'
        context: 'Grasping width (min): NT/NTW 17 mm, XT/XTW 22 mm. Implant width (nominal): NT/NTW 20 mm, XT/XTW 25 mm. Arm width (max): NT/XT 4 mm, NTW/XTW 6 mm. Max arm (coaptation) length: NT/NTW 9 mm, XT/XTW 12 mm.'
      delivery-sheath:
        value: Guide catheter 8.4 mm (25 Fr); delivery catheter 5.3 mm (16 Fr)
        loc: 'PDF p.4, Table 2'
      access-route:
        value: Transfemoral venous to right atrium; no transseptal puncture
        loc: 'PDF p.3, Device Description (Steerable Guide Catheter)'
      imaging-guidance:
        value: Fluoroscopy and transesophageal echocardiography (TEE)
        loc: 'PDF p.5, Section 5.0/Warnings (implantation technique)'
      indication-scope:
        value: Symptomatic severe TR despite OMT, intermediate-or-greater risk
        loc: 'PDF p.1, Section II Indications for Use'
        source: src-triclip-ssed
        context: OMT = optimal medical therapy; full wording is longer (multidisciplinary heart-team determination that TEER is expected to reduce TR to moderate or less).
      pivotal-trials:
        value: TRILUMINATE Pivotal (NCT03904147)
        loc: 'PDF p.10, Section X Summary of Primary Clinical Study'
        source: src-triclip-ssed

  - version: ver-triclip-g5
    category: [tricuspid-teer]
    source: src-triclip-g5-pma
    values:
      device-design:
        value: Same G4 implant; redesigned delivery handle, simplified IFU
        loc: Approval Order Statement
        context: FDA approval order describes modifications to the Delivery System Handle and simplification of IFU procedural steps to improve ergonomics/usability.
      available-sizes:
        value: NT, NTW, XT, XTW (unchanged from G4 per approval order)
        basis: derived
        loc: Approval Order Statement
        context: FDA states the change is limited to the Delivery System Handle and IFU procedural steps, not the implant.

  - version: ver-mitraclip-g4
    category: [mitral-teer]
    source: src-mitraclip-g4-specs
    values:
      grasping-mechanism:
        value: Independent and simultaneous gripper (leaflet) actuation
        source: src-mitraclip-g4-pma
        loc: Approval Order Statement
        context: Added over the prior NT/NTR/XTR generation per the G4 design-change approval order.
      available-sizes:
        value: 'Four sizes: NT, NTW, XT, XTW'
        loc: 'PDF p.7 (printed pp.12-13), "MitraClip Device (Implant)" figure'
        context: 'Arm length: NT/NTW 15 mm, XT/XTW 18 mm (standard vs long-length arm). Arm width: NT/XT 4 mm, NTW/XTW 6 mm.'
      delivery-sheath:
        value: 25 Fr steerable guide catheter
        loc: 'PDF p.7 (printed pp.12-13), "Steerable Guide Catheter"'
      access-route:
        value: Transfemoral venous, transseptal (left atrium)
        loc: 'PDF p.7 (printed pp.12-13), "Clip Delivery System"'
      imaging-guidance:
        value: Fluoroscopy and transesophageal echocardiography (TEE)
        loc: 'PDF p.7 (printed pp.12-13), "Equipment"'
      indication-scope:
        value: Degenerative MR and secondary MR in heart failure on GDMT
        basis: derived
        loc: Approval Order Statement
