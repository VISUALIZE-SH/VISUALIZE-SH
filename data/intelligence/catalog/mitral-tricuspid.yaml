    reviewStatus: draft
  - id: ver-pascal-precision
    familyId: family-pascal
    name: PASCAL Precision
    kind: device
    clinicalRole: treats
    summary: Central-spacer TEER system with independently actuated clasps; FDA-approved for degenerative MR on CLASP IID.
    sourceRefs:
      - sourceId: src-pascal-pma
        locator: Approval Order Statement
    reviewStatus: draft
  - id: ver-tendyne
    familyId: family-tendyne
    name: Tendyne
    kind: device
    clinicalRole: treats
    summary: Transapical TMVR with an apical-tethered outer frame; FDA-approved specifically for severe MAC unsuitable for surgery/TEER.
    sourceRefs:
      - sourceId: src-tendyne-pma
        locator: Approval Order Statement
    reviewStatus: draft
  - id: ver-sapien-m3
    familyId: family-sapien-m3
    name: SAPIEN M3
    kind: device
    clinicalRole: treats
    summary: Transseptal dock-plus-balloon-expandable-valve TMVR system; FDA-approved for MR and MAC-associated mitral valve dysfunction.
    sourceRefs:
      - sourceId: src-sapienm3-pma
        locator: Approval Order Statement
    reviewStatus: draft
  - id: ver-intrepid
    familyId: family-intrepid
    name: Intrepid
    kind: device
    clinicalRole: treats
    summary: Investigational self-expanding dual-stent TMVR with a conformable outer fixation ring; originally transapical (APOLLO), now also studied via a transfemoral transseptal delivery system.
    sourceRefs:
      - sourceId: src-intrepid-protocol
        locator: Title page and Section 6.1 Product Description
    reviewStatus: draft
  - id: ver-evoque
    familyId: family-evoque
    name: EVOQUE
    kind: device
    clinicalRole: treats
    summary: Self-expanding TTVR with anchors that engage the native tricuspid leaflets; FDA-approved on TRISCEND II.
    sourceRefs:
      - sourceId: src-evoque-pma
        locator: Approval Order Statement
    reviewStatus: draft
  - id: ver-adaptr
    familyId: family-adaptr
    name: adapTR Leaflet Enhancement System
    kind: device
    clinicalRole: treats
    summary: Investigational right-atrium-only device combining a conformable annular-stabilizing frame with a central disk; evidence limited to a single first-in-human case.
    sourceRefs:
      - sourceId: src-adaptr-fih
        locator: Case Summary
    reviewStatus: draft
  - id: ver-cardioband
    familyId: family-cardioband
    name: Cardioband
    kind: device
    clinicalRole: treats
    summary: CE-marked adjustable direct annuloplasty band anchored along the annulus; no US PMA/IDE decision identified.
    sourceRefs:
      - sourceId: src-cardioband-review
        locator: Device description
    reviewStatus: draft

