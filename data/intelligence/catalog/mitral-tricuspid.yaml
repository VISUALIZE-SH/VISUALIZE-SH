families:
  - id: family-pascal
    name: PASCAL
    manufacturer: Edwards Lifesciences
    entityIds:
      - dev-pascal
    conditionIds:
      - cond-mr
    description: PASCAL and the narrower-profile PASCAL Ace are a single FDA-cleared system, not separate product generations.
  - id: family-tendyne
    name: Tendyne
    manufacturer: Abbott
    entityIds:
      - dev-tendyne
    conditionIds:
      - cond-mr
    description: FDA approval is scoped to severe mitral annular calcification (MAC); broader CE-marked MR use is a separate regulatory scope.
  - id: family-sapien-m3
    name: SAPIEN M3
    manufacturer: Edwards Lifesciences
    entityIds:
      - dev-sapien-m3
    conditionIds:
      - cond-mr
    description: Distinct dock-plus-balloon-expandable-valve platform from the aortic SAPIEN family; track the dock and valve as one system.
  - id: family-intrepid
    name: Intrepid
    manufacturer: Medtronic
    entityIds:
      - dev-intrepid
    conditionIds:
      - cond-mr
    description: Investigational; the transapical (APOLLO) and newer transfemoral transseptal delivery generations should be tracked separately as evidence accrues.
  - id: family-evoque
    name: EVOQUE
    manufacturer: Edwards Lifesciences
    entityIds:
      - dev-evoque
    conditionIds:
      - cond-tr
    description: A 56-mm valve was used late in the TRISCEND II trial but is outside the original PMA scope.
  - id: family-adaptr
    name: adapTR
    manufacturer: Versa Vascular
    entityIds:
      - dev-adaptr
    conditionIds:
      - cond-tr
    description: Investigational dual-mechanism (annular stabilization plus leaflet enhancement) tricuspid repair device; public evidence is a single first-in-human case.
  - id: family-cardioband
    name: Cardioband
    manufacturer: Edwards Lifesciences
    entityIds:
      - dev-cardioband
    conditionIds:
      - cond-mr
      - cond-tr
    description: CE-marked direct annuloplasty system for mitral and (later) tricuspid use; no US PMA/IDE approval identified.

versions:
