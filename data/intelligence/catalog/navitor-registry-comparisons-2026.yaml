  - id: claim-lv26-nav-reg-5
    versionId: ver-navitor-pooled-hera-tavi
    category: evidence
    key: lv26-nav-reg-5
    label: HERA-TAVI outcomes, Navitor arm
    value: 1-year composite 12.6%; device success 91.1%; pacemaker 22.1%; major or life-threatening bleeding 2.6%.
    availability: reported
    basis: directly_reported
    context: >-
      HERA-TAVI registry (transfemoral TAVI June 2021–April 2025; 892 propensity-matched pairs from 2,607 patients):
      Navitor or Navitor Vision (intra-annular) vs Evolut FX or FX+ (supra-annular). Evolut arm: 11.3%; 90.9%; 16.3%;
      4.2%. Composite = death, disabling stroke or HF hospitalization at 1 year, HR 1.01 (95% CI 0.77–1.33; p=0.916).
      Device success per VARC-3.
    limitation: >-
      Observational registry; propensity matching adjusts measured covariates only; abstract-only review. Navitor and
      Navitor Vision are pooled and attached to a pooled study-configuration version; values are not specific to the
      NaviSeal Navitor generation. Timepoints of device success, pacemaker and bleeding not stated in the abstract.
    observedAt: "2026-11-27"
    sourceRefs:
      - sourceId: src-lv26-hera-tavi
        locator: Abstract, Results
    reviewStatus: reviewed
  - id: claim-lv26-nav-reg-6
    versionId: ver-evolut-fx-pooled-hera-tavi
    category: evidence
    key: lv26-nav-reg-6
    label: HERA-TAVI outcomes, Evolut FX/FX+ arm
    value: 1-year composite 11.3%; device success 90.9%; pacemaker 16.3%; major or life-threatening bleeding 4.2%.
    availability: reported
    basis: directly_reported
    context: >-
      HERA-TAVI registry (transfemoral TAVI June 2021–April 2025; 892 propensity-matched pairs from 2,607 patients):
      Navitor or Navitor Vision (intra-annular) vs Evolut FX or FX+ (supra-annular). Navitor arm: 12.6%; 91.1%; 22.1%;
      2.6%. Composite = death, disabling stroke or HF hospitalization at 1 year, HR 1.01 (95% CI 0.77–1.33) for Navitor
      vs Evolut.
    limitation: >-
      Observational registry; propensity matching adjusts measured covariates only; abstract-only review. Evolut FX and
      FX+ are pooled in one arm and attached to a pooled study-configuration version; values are not specific to either
      generation. Timepoints of device success, pacemaker and bleeding not stated in the abstract.
    observedAt: "2026-11-27"
    sourceRefs:
      - sourceId: src-lv26-hera-tavi
        locator: Abstract, Results
    reviewStatus: reviewed
