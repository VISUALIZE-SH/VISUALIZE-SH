claims:
  - id: claim-lv26-nav-reg-1
    versionId: ver-navitor
    category: evidence
    key: lv26-nav-reg-1
    label: NAVULTRA 1-year clinical outcomes, Navitor arm
    value: "1 year: all-cause mortality 8.8%; death, disabling stroke or HF hospitalization 11.3%."
    availability: reported
    basis: directly_reported
    context: >-
      NAVULTRA registry (patients with annulus area ≤430 mm²; 524 propensity-matched pairs from 1,617 patients): Navitor
      (NAV) vs SAPIEN 3 Ultra (ULTRA). SAPIEN 3 Ultra arm: 9.0% and 11.8% (adjusted p=0.585 and 0.149).
    limitation: Observational registry; propensity matching adjusts measured covariates only; abstract-only review.
    observedAt: "2026-11-27"
    sourceRefs:
      - sourceId: src-lv26-navultra
        locator: Abstract, Results
    reviewStatus: reviewed
  - id: claim-lv26-nav-reg-2
    versionId: ver-navitor
    category: evidence
    key: lv26-nav-reg-2
    label: NAVULTRA device-oriented and hemodynamic outcomes, Navitor arm
    value: Device-oriented endpoint 6.0%; residual mean gradient 7.3 mmHg; mild PVL 33.5%; permanent pacemaker 20.1%.
    availability: reported
    basis: directly_reported
    context: >-
      NAVULTRA registry (patients with annulus area ≤430 mm²; 524 propensity-matched pairs from 1,617 patients): Navitor
      (NAV) vs SAPIEN 3 Ultra (ULTRA). SAPIEN 3 Ultra arm: 29.3%; 12.7 mmHg; 23.2%; 11.9% (adjusted p<0.01, except mild
      PVL p<0.05). Device-oriented endpoint (30 days): severe PPM, moderate or greater PVL or mean gradient ≥20 mmHg.
    limitation: >-
      Observational registry; propensity matching adjusts measured covariates only; abstract-only review. Timepoints of
      gradient, mild PVL and pacemaker are not stated in the abstract.
    observedAt: "2026-11-27"
    sourceRefs:
      - sourceId: src-lv26-navultra
        locator: Abstract, Results
    reviewStatus: reviewed
