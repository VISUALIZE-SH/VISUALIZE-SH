# needs-fulltext:
#   - dev-amplatzer-pfo (ver-amplatzer-pfo): delivery-sheath French size for the TorqVue system.
#     Only a patient brochure (not a physician IFU) was posted for P120021; needs the Abbott
#     physician IFU. https://www.accessdata.fda.gov/cdrh_docs/pdf12/P120021D.pdf
#   - dev-amplatzer-piccolo (ver-amplatzer-piccolo): delivery-sheath French size, exact occluder/
#     retention-disk diameters, labeled post-implant antiplatelet regimen, fabric-cover/surface-coating.
#     No public SSED/IFU was posted for supplement P020024/S052.
#     https://www.accessdata.fda.gov/scripts/cdrh/cfdocs/cfpma/pma.cfm?id=P020024S052
#   - GORE CARDIOFORM ASD Occluder (ver-gore-cardioform-asd): occluder diameters, delivery-sheath
#     French size, frame/fabric confirmation specific to this configuration, post-implant regimen.
#     No public SSED/labeling was posted for supplement P050006/S071. Full text of the ASSURED
#     study was paywalled/cookie-gated in this review: https://pubmed.ncbi.nlm.nih.gov/31943749/
#   - dev-amplatzer-vsd (ver-amplatzer-vsd): exact labeled post-implant antiplatelet regimen
#     (dosing/duration) -- SSED references anti-platelet therapy only in a contraindication clause.
#     Not encoded as a spec value here because taxonomy.yaml's post-implant-therapy attribute does
#     not list vsd-occluders (or pda-occluders) in its categoryIds.
#     https://www.accessdata.fda.gov/cdrh_docs/pdf4/P040040b.pdf
#   - dev-ecliptis (ver-ecliptis): labeled post-implant antithrombotic regimen -- not specified in
#     the 510(k) summary. https://www.accessdata.fda.gov/cdrh_docs/pdf25/K254232.pdf
#   - dev-lambre (ver-lambre): explicit recapture/reposition capability -- the delivery cable is
#     described as a threaded (screw) system but recapture is not explicitly stated in the reviewed
#     source. https://pmc.ncbi.nlm.nih.gov/articles/PMC9352115/
