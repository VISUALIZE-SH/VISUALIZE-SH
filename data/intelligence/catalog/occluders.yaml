      loc: Press release, paragraph 2
      source: src-gore-cardioform-asd-pr
      context: Including defects without a retro-aortic rim.
    indication-scope:
      value: Percutaneous closure of ostium secundum atrial septal defects (ASD)
      loc: Approval order statement
    pivotal-trials:
      value: ASSURED clinical study
      loc: Article title
      source: src-gore-cardioform-asd-assured
      limitation: Full text of PMID 31943749 was not accessible in this review (cookie-gated); trial name
        is taken from the indexed article title, not the abstract/methods.
