specs:
- version: ver-amulet
  category: laao-occluders
  source: src-amulet-ssed
  values:
    device-design:
      value: 'Dual-seal occluder: Nitinol lobe + larger disc, central waist'
      loc: PDF p.2, Device Description
      context: Braided Nitinol lobe; disc connected to the lobe by the waist.
    frame-material:
      value: Braided Nitinol
      loc: PDF p.2, Device Description
    fabric-cover:
      value: Polyester fabric sewn into both the lobe and the disc
      loc: PDF p.2, Device Description
    anchoring-mechanism:
      value: Lobe wires give radial fixation against LAA wall (passive)
      loc: PDF p.2, Device Description
      context: Passive friction only; no screw/active fixation.
    repositionable:
      value: Recapturable and repositionable by pulling the delivery cable before release
      loc: PDF p.5, Principles of Operation
    access-route:
      value: Transfemoral venous, transseptal puncture
      loc: PDF p.4, Principles of Operation
    delivery-sheath:
      value: 12F or 14F Amplatzer TV45x45 Delivery Sheath
      loc: PDF p.3, Accessories
    available-sizes:
      value: Lobe 16-34 mm; disc 22-41 mm (13 device sizes)
      loc: PDF p.2, Device Description
    imaging-guidance:
      value: Pre-procedure TEE to exclude thrombus; fluoroscopy plus TEE during implantation
      loc: PDF p.4, Principles of Operation
    indication-scope:
      value: LAA thrombus-embolization risk reduction in non-valvular AF
      loc: PDF p.1, Indications for Use
      context: Assessed by CHADS2/CHA2DS2-VASc; suitable for short-term anticoagulation, with rationale
        to seek a non-pharmacologic alternative.
    post-implant-therapy:
      value: 'Amulet IDE protocol: DAPT or aspirin+OAC, physician discretion'
      loc: PDF p.22, Clinical Study
      context: NOAC or VKA. Reflects the FDA-reviewed pivotal-trial regimen (vs. the Watchman control
        arm’s required aspirin+warfarin); may not be the verbatim current IFU wording.
    pivotal-trials:
      value: Amulet IDE Trial (vs. WATCHMAN, PMA P130013)
      loc: PDF p.12, Summary of Primary Clinical Study
- version: ver-lambre
  category: laao-occluders
  source: src-lambre-study
  values:
    device-design:
      value: Umbrella (8 arms + distal hooks) and disc, central pin
      loc: Article body, 'Dispositivo Lambre®' section
      context: Arms have atraumatic tips; disc covers the LAA ostium.
    frame-material:
      value: Self-expanding Nitinol mesh
      loc: Article body, 'Dispositivo Lambre®' section
    fabric-cover:
      value: PET fabric sewn inside the umbrella and disc
      loc: Article body, 'Dispositivo Lambre®' section
      context: PET = polyethylene terephthalate.
    surface-coating:
      value: Titanium nitride (TiN) coating over the Nitinol mesh
      loc: Article body, 'Dispositivo Lambre®' section
    anchoring-mechanism:
      value: Umbrella arms engage LAA trabeculae; distal hooks anchor wall
      loc: Article body, 'Dispositivo Lambre®' section
      context: Atraumatic tips; arms deploy via anterograde rotation, for added stability.
    access-route:
      value: Transseptal, via dedicated dual-curve (45°/30°) long delivery sheath
      loc: Article body, Methods
    delivery-sheath:
      value: 8F to 10F (dual-curve 45°/30° sheaths, sized to the chosen device)
      loc: Article body, Methods
    available-sizes:
      value: 'Standard: umbrella 16-36 mm; Special: umbrella 16-26 mm'
      loc: Article body, Methods
      context: Standard type in 2 mm steps, disc 6 mm larger (16-30 mm umbrella) or 4 mm larger (32-36
        mm umbrella). Special type disc 12-14 mm larger.
    anatomy-range-summary:
      value: Umbrella 2-8 mm larger than LAA landing zone
      loc: Article body, Methods
      context: Sized by intraoperative angiography/TEE (implantation zone).
    imaging-guidance:
      value: Intraoperative angiography plus transesophageal echocardiography (TEE)
      loc: Article body, Methods
    post-implant-therapy:
      value: Aspirin 100 mg + clopidogrel 75 mg post-procedure
      loc: Article body, Methods
      context: Clopidogrel stopped at 3 months, aspirin continued; follow-up TEE at 3 and 6 months. Single-center/multicenter
        Brazilian registry protocol, not an FDA label (device has no US marketing authorization).
    indication-scope:
      availability: not_applicable
      basis: directly_reported
      loc: Press release body
      source: src-lambre-us-status
      context: No FDA-approved US indication as of 2026-09-23. Available in the US only through an FDA-approved
        investigator-initiated IDE trial (LAmbre Plus, approved March 2022); CE-marked and China NMPA-approved
        for LAA occlusion in non-valvular AF outside the US (see data/therapies.yaml).
- version: ver-ecliptis
  category: laao-occluders
  source: src-ecliptis-510k
  values:
    device-design:
      value: Curved mechanical clip, U-shape opening, tip-first closure
      loc: PDF p.5-6, Device Description and Table 1
      context: Surgical LAA exclusion clip, not a transcatheter occluder.
    frame-material:
      value: Nitinol spring plus polyether ether ketone (PEEK) bars
      loc: PDF p.5, Device Description
    fabric-cover:
      value: Silicone overmold covering the PEEK implant bars
      loc: PDF p.5, Device Description
    anchoring-mechanism:
      value: Spring-loaded clip compresses across the LAA base
      loc: PDF p.6, Table 1 (Clip Mechanics)
      context: Not a radial-friction endovascular anchor.
    repositionable:
      value: Recapturable and re-deployable, same delivery system
      loc: PDF p.7, Table 1 (Adjustment after deployment)
      context: After initial deployment.
    access-route:
      value: Surgical, epicardial, under direct visualization
      loc: PDF p.5, Indications for Use
      context: Performed with other cardiac surgical procedures (not transcatheter/femoral).
    delivery-sheath:
      availability: not_applicable
      loc: PDF p.5, Device Description
      context: Delivered via a malleable-shaft, pre-loaded surgical applicator; no transcatheter sheath
        French size applies.
    available-sizes:
      value: 35, 40, 45, 50 mm clip sizes
      loc: PDF p.5, Device Description
    imaging-guidance:
      value: Direct surgical visualization; no fluoro/echo required
      loc: PDF p.5, Indications for Use
      context: With or without camera/endoscope assistance.
    indication-scope:
      value: Exclusion of the heart's left atrial appendage
      loc: PDF p.5, Indications for Use
      context: Performed under direct visualization, in conjunction with other cardiac surgical procedures.
    post-implant-therapy:
      availability: not_publicly_disclosed
      loc: PDF p.5-7
      context: The 510(k) summary does not specify a device-specific post-implant antithrombotic regimen.
    pivotal-trials:
      availability: not_applicable
      loc: PDF p.7, Performance Data
      context: Cleared via 510(k) substantial equivalence to the AtriCure AtriClip (K210293) using bench,
        animal, and biocompatibility testing; no human pivotal trial was required.
- version: ver-amplatzer-pfo
  category: pfo-occluders
  source: src-amplatzer-pfo-ssed
  values:
    device-design:
      value: Self-expanding double-disc device, articulating waist
      loc: PDF p.2, Device Description
      context: Two discs linked by a short connecting waist that articulates to conform to the septal
        wall.
    frame-material:
      value: Nitinol wire mesh
      loc: PDF p.2, Device Description
    fabric-cover:
      value: Polyester fabric sewn to each disc with polyester thread
      loc: PDF p.2, Device Description
    repositionable:
      value: End-screw delivery-cable attachment allows recapture if required, before release
      loc: PDF p.2, Device Description
    access-route:
      value: 'Transseptal, via the AMPLATZER TorqVue Delivery System'
      loc: PDF p.2, Device Description
      context: 510(k)-cleared; right atrium to left atrium.
    available-sizes:
      value: 18, 25, 35 mm (device size = right atrial disc diameter)
      loc: PDF p.2, Device Description
    imaging-guidance:
      value: TEE at ~6 months post-implant to assess closure
      loc: PDF p.15, Study Protocol
      context: ICE may substitute for TEE at the time of the procedure.
    indication-scope:
      value: Transcatheter PFO closure to reduce recurrent stroke risk
      loc: PDF p.1, Indications for Use
      context: In patients (predominantly 18-60 y) with cryptogenic stroke due to presumed paradoxical
        embolism.
    post-implant-therapy:
      value: 'RESPECT protocol: clopidogrel 30 days + aspirin 6 months'
      loc: PDF p.15, Study Protocol
      context: Additional therapy beyond 6 months at investigator discretion.
    pivotal-trials:
      value: RESPECT trial (IDE G990318)
      loc: PDF p.10, Summary of Primary Clinical Study
- version: ver-gore-cardioform-septal
  category:
  - pfo-occluders
  - asd-occluders
  source: src-gore-cardioform-septal-ssed
  values:
    device-design:
      value: 'Double-disc occluder: platinum-filled Nitinol, ePTFE cover'
      loc: PDF p.2, Device Description
      context: Forms a double-disc configuration when deployed.
    frame-material:
      value: Platinum-filled Nitinol wire frame
      loc: PDF p.2, Device Description
    fabric-cover:
      value: Expanded polytetrafluoroethylene (ePTFE) cover
      loc: PDF p.2, Device Description
    surface-coating:
      value: Hydrophilic surface treatment on the ePTFE to aid echocardiographic visibility
      loc: PDF p.2, Device Description
    repositionable:
      value: Handle repositions/retrieves via Retrieval Cord before release
      loc: PDF p.2, Device Description
    access-route:
      value: Transcatheter, conventional delivery; 0.035 in guidewire
      loc: PDF p.2, Device Description
    delivery-sheath:
      value: 10 Fr outer-diameter Delivery Catheter, 75 cm working length
      loc: PDF p.2, Device Description
    available-sizes:
      value: 20, 25, 30 mm occluder diameters
      loc: PDF p.2, Device Description
    anatomy-range-summary:
      value: Not recommended for defects larger than 17 mm
      loc: PDF p.4, Warnings
      source: src-gore-cardioform-septal-ifu
    imaging-guidance:
      value: TEE/ICE with color-flow Doppler for sizing
      loc: PDF p.4, Warnings (device sizing)
      source: src-gore-cardioform-septal-ifu
      context: TTE or TEE used to assess closure post-implant.
    indication-scope:
      value: Transcatheter closure of secundum ASD and PFO
      loc: PDF p.1, Indications for Use
      context: PFO closure to reduce recurrent ischemic stroke risk in patients (predominantly 18-60
        y) with cryptogenic stroke due to presumed paradoxical embolism.
    post-implant-therapy:
      value: 'ASD: antiplatelet 6 months. PFO: antiplatelet indefinitely'
      loc: PDF p.5, Post Procedure
      source: src-gore-cardioform-septal-ifu
      context: 'ASD continuation beyond 6 months at physician discretion. REDUCE trial regimen: clopidogrel
        75 mg for 3 days, then aspirin 81-325 mg alone (or aspirin+dipyridamole, or clopidogrel 75 mg
        alone).'
    pivotal-trials:
      value: REDUCE trial
      loc: PDF p.5, Summary of Primary Clinical Study
- version: ver-gore-cardioform-asd
  category: asd-occluders
  source: src-gore-cardioform-asd-decision
  values:
    device-design:
      value: Same CARDIOFORM platform (Nitinol frame, ePTFE cover)
      loc: Approval order statement
      context: As the GORE CARDIOFORM Septal Occluder, in a labeled configuration for larger ASDs.
      basis: derived
      limitation: No public SSED or labeling document was posted for supplement P050006/S071; the shared
        platform is inferred from the approval order's description of this as an 'addition ... to the
        GORE HELEX Septal Occluder product line' plus the original CARDIOFORM Septal Occluder SSED device
        description.
    anatomy-range-summary:
