  - id: claim-ocean-laac-flx-pro-1y-3
    versionId: ver-watchman-flx-pro
    category: evidence
    key: ocean-laac-flx-pro-1y-3
    label: Bleeding versus WATCHMAN FLX after matching
    value: >-
      After propensity matching (574 pairs), all bleeding 6.4% vs 10.4% and major bleeding 3.7% vs 7.0% with FLX Pro vs
      FLX; death (5.1% vs 7.2%), HF hospitalization (3.3% vs 5.5%), stroke and device-related thrombus were broadly
      similar.
    availability: reported
    basis: directly_reported
    context: >-
      Yamamoto et al., Structural Heart journal pre-proof (DOI registered 2026-11-25): Japanese multicenter OCEAN-LAAC
      registry, May 2021 to December 2024; successful implants WATCHMAN FLX 1,509 vs FLX Pro 577; 574 propensity-matched
      pairs; one-year outcomes.
    limitation: >-
      Journal pre-proof full text; observational registry in Japan; era not a matching covariate; FLX Pro used in a
      later era with earlier antithrombotic simplification (authors: no causal pathway established). Not significant in
      a day-7 landmark analysis.
    observedAt: "2026-11-27"
    sourceRefs:
      - sourceId: src-ocean-laac-flx-pro-1y-2026
        locator: Results (one-year outcomes)
    reviewStatus: reviewed
  - id: claim-ocean-laac-flx-pro-1y-4
    versionId: ver-watchman-flx-pro
    category: evidence
    key: ocean-laac-flx-pro-1y-4
    label: Antithrombotic therapy at 3 months versus WATCHMAN FLX
    value: >-
      Single antiplatelet therapy 53.4% vs 39.9% and dual antiplatelet therapy 5.5% vs 21.7% at 3 months (FLX Pro vs
      FLX); differences decreased by one year.
    availability: reported
    basis: directly_reported
    context: >-
      Yamamoto et al., Structural Heart journal pre-proof (DOI registered 2026-11-25): Japanese multicenter OCEAN-LAAC
      registry, May 2021 to December 2024; successful implants WATCHMAN FLX 1,509 vs FLX Pro 577; 574 propensity-matched
      pairs; one-year outcomes.
    limitation: >-
      Journal pre-proof full text; observational registry in Japan; era not a matching covariate; FLX Pro used in a
      later era with earlier antithrombotic simplification (authors: no causal pathway established). Unmatched cohort,
      patients alive and under follow-up; matched figures differ slightly (single 53.2% vs 41.1%, dual 5.5% vs 19.3%).
    observedAt: "2026-11-27"
