claims:
  - id: claim-ocean-laac-flx-pro-1y-1
    versionId: ver-watchman-flx-pro
    category: evidence
    key: ocean-laac-flx-pro-1y-1
    label: One-year outcomes (OCEAN-LAAC)
    value: >-
      One-year estimates after successful WATCHMAN FLX Pro implantation (n=577): all-cause death 5.3%, heart failure
      hospitalization 3.5%, stroke 2.4%, device-related thrombus 3.0%, all bleeding 6.4%.
    availability: reported
    basis: directly_reported
    context: >-
      Yamamoto et al., Structural Heart journal pre-proof (DOI registered 2026-11-25): Japanese multicenter OCEAN-LAAC
      registry, May 2021 to December 2024; successful implants WATCHMAN FLX 1,509 vs FLX Pro 577; 574 propensity-matched
      pairs; one-year outcomes.
    limitation: >-
      Journal pre-proof full text; observational registry in Japan; era not a matching covariate; FLX Pro used in a
      later era with earlier antithrombotic simplification (authors: no causal pathway established). Reported before the
      matched analysis; similar to FLX for death, stroke and DRT.
    observedAt: "2026-11-27"
    sourceRefs:
      - sourceId: src-ocean-laac-flx-pro-1y-2026
        locator: Results (one-year outcomes)
    reviewStatus: reviewed
