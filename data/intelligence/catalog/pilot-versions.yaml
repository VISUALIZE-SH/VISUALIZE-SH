#       No public SSED or IFU was posted for supplement P100009/S015 (MitraClip NT,
#       2016-05-10). The gripper material change (from Elgiloy) is reported as "Nickel" in
#       the cited review rather than by a formal alloy/trade designation; an Abbott IFU for
#       the NT-labeled device would be needed to confirm exact terminology.
#     url: https://pmc.ncbi.nlm.nih.gov/articles/PMC13189608/

