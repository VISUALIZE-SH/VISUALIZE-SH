    category: evidence
    key: submission-distance-validation
    label: Submission distance-measurement validation
    value: MAE 0.42 cm (95% CI, 0.38–0.47); 963 clips from 186 patients
    availability: reported
    basis: directly_reported
    reviewStatus: reviewed
    observedAt: "2026-10-27"
    context: >-
      Manufacturer-submitted K252235 testing, under Non-Clinical Performance Data, against experienced US
      board-certified cardiac-sonographer annotations. CI upper-bound acceptance criterion <0.5 cm.
    limitation: >-
