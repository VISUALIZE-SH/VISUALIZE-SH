specs:
  - version: ver-autus-size-adjustable
    category: surgical-pulmonary-valves
    source: src-autus-fda-announcement-20261001
    values:
      manufacturer:
        reviewStatus: reviewed
        value: Edwards Lifesciences (approval holder)
        loc: Final paragraph naming approval recipient and original developer
        context: FDA names Autus Valve Technologies as developer; legal manufacturing-site details are not established here.
      device-design:
        reviewStatus: reviewed
        value: Stented bileaflet synthetic valve; ePTFE sleeve around the frame for suturing
        source: src-autus-fda-ssed-p260007
        loc: PDF p.2, Section V Device Description
        context: The ePTFE stretch-graft sleeve extends below the frame for suture fixation and allows the frame to expand under balloon dilation.
      expansion-mechanism:
        reviewStatus: reviewed
        value: Balloon-expandable frame; pre-implant expansion or postimplant transcatheter balloon dilation
        source: src-autus-fda-ifu-p260007
        loc: PDF p.5, Sections 7.2-7.3
        context: Both use a non-compliant percutaneous balloon dilation catheter.
        limitation: "IFU Section 5: the safety and effectiveness of post-implant expansion have not been established, and there is no clinical experience with more than one expansion in a patient."
      leaflet-material:
        reviewStatus: reviewed
        value: Expanded polytetrafluoroethylene (ePTFE), 0.1 mm
        source: src-autus-fda-ssed-p260007
        loc: PDF p.2, Section V Device Description
      frame-material:
        reviewStatus: reviewed
        value: 316L stainless steel
        source: src-autus-fda-ssed-p260007
        loc: PDF p.2, Section V Device Description; PDF p.6, nonclinical testing table (Finite Element Analysis)
        context: The IFU for Model AUT001 posted with the PMA gives the same frame material (PDF p.1, Section 1.1).
      access-route:
        reviewStatus: reviewed
        value: Surgical implantation; subsequent transcatheter balloon dilation
        loc: Opening paragraph; diameter paragraph
      available-sizes:
        reviewStatus: reviewed
        value: "Single size: 12.7 mm internal diameter (Model AUT001)"
        source: src-autus-fda-ssed-p260007
        loc: PDF p.2, Section V Device Description
        context: Model number from the IFU title (PDF p.1).
      adjustable-diameter:
        reviewStatus: reviewed
        value: 12.7, 14, 16, 18, 20 or 22 mm internal diameter, before or after implantation
        source: src-autus-fda-ssed-p260007
        loc: PDF p.2, Section V Device Description and Table 1
        context: The SSED describes 2 mm increments within the 12.7 to 22 mm range. Table 1 lists outer diameter 15.7 to 25 mm and length 25.1 to 20.5 mm across these diameters.
        limitation: Leaflet coaptation height decreases as the frame expands.
      development-status:
        reviewStatus: reviewed
        value: US FDA PMA P260007 approved October 1, 2026
        source: src-autus-fda-ssed-p260007
        loc: PDF p.1, Section I General Information
        context: Breakthrough Device designation granted August 25, 2023. The SSED states the valve had not been marketed in the US or any other country (PDF p.3, Section VII).
      indication-scope:
        reviewStatus: reviewed
        value: Pediatric patients >=10 kg needing surgical pulmonary valve replacement for a dysfunctional native or surgically repaired RVOT
        source: src-autus-fda-ssed-p260007
        loc: PDF p.1, Section II Indications for Use
        context: "Echocardiographic criteria: severe pulmonary stenosis (RV-PA peak gradient >=60 mmHg), at least moderate pulmonary regurgitation, or at least moderate stenosis (>=40 mmHg) with at least moderate regurgitation."
      pivotal-trials:
        reviewStatus: reviewed
        value: AUT-CP-001 / NCT05006404
        source: src-autus-pivotal-registry
        loc: API protocolSection.identificationModule; descriptionModule; designModule (retrieved 2026-10-07)
        context: Pivotal registry reports 62 actual participants. Continued access has a separate registry record and snapshot. The earlier 11-patient feasibility report is not merged with this cohort.
