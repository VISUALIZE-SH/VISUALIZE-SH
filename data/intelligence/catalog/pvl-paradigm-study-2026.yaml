claims:
  - id: claim-wor85-pvl-paradigm-study-2026-1
    versionId: ver-apvl3-paradigm-study
    category: evidence
    key: wor85-pvl-paradigm-study-2026-1
    label: PARADIGM primary composite
    value: 188/200 (94.0%); one-sided 96% lower confidence bound 90.2%, versus 65% performance goal (P<.0001).
    availability: reported
    basis: directly_reported
    context: >-
      Prospective APVL3 study:200 implant attempts,24 centers; acute placement/PVL reduction/no procedural
      death plus no device-related reintervention through 30 days.
    limitation: >-
      Single-arm selected anatomy; not 30-day complication-free success. No revision/Paraclose identity
      bridge.
    observedAt: '2026-11-02'
    sourceRefs:
      - sourceId: src-wor85-paradigm
        locator: Article PDF pp10–12 Endpoints/Statistics; Table 3 PDFp28.
    reviewStatus: reviewed
  - id: claim-wor85-pvl-paradigm-study-2026-2
    versionId: ver-apvl3-paradigm-study
    category: evidence
    key: wor85-pvl-paradigm-study-2026-2
    label: Separate 30-day procedural success and safety
    value: >-
      Procedural success 140/181 (77.3%); mortality 4/200 (2.0%,95% CI0.55–5.04); major bleeding 13/200
      (6.5%).
    availability: reported
    basis: directly_reported
    context: >-
      Procedural success adds absence of device/procedure-related serious adverse events;19 nonevaluable
      excluded from its denominator.
    limitation: >-
      Endpoints have different denominators; missing imaging and short follow-up. No comparison to other
      plugs.
    observedAt: '2026-11-02'
    sourceRefs:
      - sourceId: src-wor85-paradigm
        locator: PDFpp11,16–17; Table 4 PDFpp29–30.
