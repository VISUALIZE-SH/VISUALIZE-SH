claims:
  - id: claim-tempus-ecg-mr-input-output
    versionId: ver-tempus-ecg-mr-k254297
    category: digital
    key: inputOutput
    label: Inputs and output
    value: Resting, non-ambulatory 12-lead ECG; binary detected/not detected result or unclassifiable
    availability: reported
    basis: directly_reported
    observedAt: '2026-10-12'
    context: >-
      Clinical diagnostic ECGs collected at a healthcare facility; inputs include ECG tracing, patient age,
      and sex. Compatible 12-lead diagnostic ECG machines with 500 Hz digital output; software-only, no
      dedicated UI.
    limitation: >-
      Specific compatible ECG machine models are not enumerated in the reviewed summary; 500 Hz compatibility
      must not be generalized to all machines.
    sourceRefs:
      - sourceId: src-tempus-ecg-mr-fda-k254297
        locator: 'PDF pp.5–6, Device Description; p.9, comparison table: Input, Output, Hardware, and PCCP'
    reviewStatus: draft
  - id: claim-tempus-ecg-mr-sensitivity
    versionId: ver-tempus-ecg-mr-k254297
    category: evidence
    key: clinicalPerformance.sensitivity
    label: Sensitivity for moderate/severe MR
    value: 75
    unit: '%'
    availability: reported
    basis: directly_reported
    observedAt: '2026-10-12'
    context: >-
      Point estimate; lower bound of the 95% confidence interval was 70%, above the prespecified 65%
      acceptance criterion. Retrospective observational cohort; 6,341 ECGs from four geographically distinct
      US sites.
    limitation: >-
      No upper CI bound or full protocol/statistical details in the reviewed summary; do not extrapolate
      beyond the intended-use population.
    sourceRefs:
      - sourceId: src-tempus-ecg-mr-fda-k254297
        locator: PDF p.6 (Summary p.3), Summary of Clinical Studies; pp.7–8, Table 2
    reviewStatus: draft
  - id: claim-tempus-ecg-mr-specificity
