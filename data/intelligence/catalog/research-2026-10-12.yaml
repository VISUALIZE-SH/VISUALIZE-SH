    graphEntityId: dig-tempus-ecg-mr
    name: Tempus ECG-MR (K254297)
    kind: digital
    clinicalRole: detects
    digitalSubtype: diagnostic
    summary: >-
      FDA 510(k) substantially-equivalent clearance dated 2026-09-25. Intended for resting, non-ambulatory
      12-lead ECGs collected at a healthcare facility from patients aged 65+ at cardiovascular risk, without
      prior mitral intervention or known moderate/severe MR. Produces a binary interpretive result (or
      unclassifiable). Not a diagnosis, rule-out test, treatment-directing tool, stand-alone tool, serial
      monitor, or for paced rhythms.
