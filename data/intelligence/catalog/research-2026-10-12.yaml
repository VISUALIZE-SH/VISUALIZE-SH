    versionId: ver-daxor-bva-200
    category: evolution
    key: predecessorComparison
    label: Difference from BVA-100 predicate
    value: >-
      BVA-200 processes whole blood rather than requiring BVA-100 plasma fractionation; touchscreen workflow
      with integrated gamma counter
    availability: reported
    basis: directly_reported
    observedAt: '2026-10-12'
    context: FDA K251087 comparison with BVA-100 (K964406) also describes battery/main power and portable case.
    limitation: >-
      Do not use company claims of 3x speed, 50% less blood, or >95% accuracy as FDA-established
      characteristics; the reviewed FDA documents do not establish these marketing figures. K261099 summary
