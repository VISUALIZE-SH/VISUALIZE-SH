    unit: '%'
    availability: reported
    basis: directly_reported
    observedAt: '2026-10-12'
    context: >-
      Point estimate; lower bound of the 95% confidence interval was 69%, above the prespecified 65%
      acceptance criterion. Same retrospective validation cohort.
    limitation: >-
      No upper CI bound or full protocol/statistical details in the reviewed summary; do not extrapolate
      beyond the intended-use population.
    sourceRefs:
