    label: Respiratory-rate algorithm continuity
    value: Same RR sensor units/algorithm as K223681; no new clinical studies required for K250934
    availability: reported
    basis: directly_reported
    reviewStatus: reviewed
    observedAt: "2026-10-27"
    context: K250934 separately describes home-use, gateway/server/dashboard, charging-port, casing and patch changes.
