claims:
  - id: claim-lv26-retavi-1
    versionId: ver-sapien-3-platform-retavi
    category: evidence
    key: lv26-retavi-1
    label: ReTAVI cohort
    value: >-
      143 patients; median age 84; median STS 7.0%; failing valves SAPIEN 3 30.1%, CoreValve/Evolut 53.1%, ACURATE
      14.0%.
    availability: reported
    basis: directly_reported
    context: >-
      ReTAVI registry (NCT05601453): prospective, international, 59 centers; consecutive patients with a failed aortic
      THV undergoing redo-TAVI with a balloon-expandable SAPIEN 3 valve; 143 patients; central imaging analysis and
      independent event adjudication. Failure mode: isolated regurgitation 48.6%, stenosis 35.2%, mixed 16.2%.
    limitation: >-
      Single-arm registry; abstract-only. The abstract says "SAPIEN 3 platform"; the exact generation (SAPIEN 3, Ultra
      or Ultra RESILIA) is not stated.
    observedAt: "2026-11-27"
    sourceRefs:
      - sourceId: src-lv26-retavi
        locator: Abstract, Results
    reviewStatus: reviewed
  - id: claim-lv26-retavi-2
    versionId: ver-sapien-3-platform-retavi
    category: evidence
    key: lv26-retavi-2
    label: ReTAVI 30-day outcomes
    value: Successful implantation 95.1%; 30-day mortality 3.5%, stroke 0.7%, pacemaker 6.3%; coronary obstruction 1.4%.
    availability: reported
    basis: directly_reported
    context: >-
      ReTAVI registry (NCT05601453): prospective, international, 59 centers; consecutive patients with a failed aortic
      THV undergoing redo-TAVI with a balloon-expandable SAPIEN 3 valve; 143 patients; central imaging analysis and
      independent event adjudication.
    limitation: >-
      Single-arm registry; abstract-only. The abstract says "SAPIEN 3 platform"; the exact generation (SAPIEN 3, Ultra
      or Ultra RESILIA) is not stated. Success definition not stated in the abstract.
    observedAt: "2026-11-27"
    sourceRefs:
      - sourceId: src-lv26-retavi
