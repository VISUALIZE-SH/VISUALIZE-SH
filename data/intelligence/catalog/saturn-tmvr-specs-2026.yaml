claims:
  - id: claim-saturn-ta-30d
    versionId: ver-saturn-ta-pilot
    category: evidence
    key: saturn-ta-30d
    label: Transapical pilot, 30 days
    value: No 30-day death or stroke; MVARC technical and device success in all 5
    availability: reported
    basis: directly_reported
    context: >-
      Five high-risk men with MR 3+ (n=3) or 4+ (n=2), single center (Vilnius), Aug 2020-Aug 2022; procedural success
      also met in all.
    limitation: Five patients; no comparator.
    observedAt: "2026-11-27"
    sourceRefs:
      - sourceId: src-saturn-ta-atssr-2024
        locator: Procedural Results
    reviewStatus: reviewed
  - id: claim-saturn-ta-1y
    versionId: ver-saturn-ta-pilot
    category: evidence
    key: saturn-ta-1y
    label: Transapical pilot, 1 year
    value: Median MR and paravalvular leak grade 0; median gradient 6.7 mmHg
    availability: reported
    basis: directly_reported
    context: Five patients; all completed 1 year, three completed 2 years.
    limitation: Five patients; LVEF fell from 42.2% at screening to 34.1% at 30 days and was stable thereafter.
    observedAt: "2026-11-27"
    sourceRefs:
      - sourceId: src-saturn-ta-atssr-2024
        locator: Table 2 (1-year echocardiography)
    reviewStatus: reviewed
  - id: claim-saturn-ts-lv26
    versionId: ver-saturn-ts
    category: evidence
    key: saturn-ts-lv26
    label: Transseptal 30 days (sponsor summary)
    value: "15 patients: 93.3% implanted; CV death 0%; major vascular 13.3%"
    availability: reported
    basis: directly_reported
    context: >-
      InnovHeart-hosted summary of the London Valves 2026 late-breaking presentation (Denti et al.): prospective
      multicenter single-arm study, grade 3+ functional MR, high risk.
    limitation: >-
      Sponsor-posted; denominators not printed; the company page credits the CASSINI-EU investigators. May differ from
      the sponsor's count of 15 patients treated globally.
    observedAt: "2026-11-27"
    sourceRefs:
      - sourceId: src-saturn-lv26-summary
        locator: Main findings panel
    reviewStatus: reviewed
