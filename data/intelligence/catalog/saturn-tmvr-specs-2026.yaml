families:
  - id: family-saturn-tmvr
    name: SATURN TMVR
    manufacturer: InnovHeart
    entityIds:
      - dev-innovheart-saturn-ts-tmvr
    conditionIds:
      - cond-mr
    description: >-
      Investigational TMVR system with a subannular annular structure joined to a central valve; first used
      transapically, now delivered transseptally (SATURN TS).
versions:
  - id: ver-saturn-ta-pilot
    familyId: family-saturn-tmvr
    graphEntityId: dev-innovheart-saturn-ts-tmvr
    name: SATURN TMVR, transapical (2020-2022 pilot)
    kind: device
    clinicalRole: treats
    summary: >-
      Transapical SATURN valve used in a five-patient single-center early feasibility study (Vilnius, 2020-2022);
      predecessor of the transseptal SATURN TS system. Values do not transfer to SATURN TS.
    sourceRefs:
      - sourceId: src-saturn-ta-atssr-2024
        locator: Device Description; Procedural Technique
    reviewStatus: reviewed
  - id: ver-saturn-ts
    familyId: family-saturn-tmvr
    graphEntityId: dev-innovheart-saturn-ts-tmvr
    name: SATURN TS TMVR System (transseptal)
    kind: device
    clinicalRole: treats
    summary: >-
      Transfemoral transseptal SATURN system studied in CASSINI-EU and CASSINI-US early feasibility studies;
      investigational and not commercially available.
    sourceRefs:
      - sourceId: src-graph-0f649889340718ea
        locator: Detailed description
      - sourceId: src-saturn-ts-jaccas-2025
        locator: Management; Discussion
    reviewStatus: reviewed
specs:
  - version: ver-saturn-ta-pilot
    category: mitral-replacement
    values:
      expansion-mechanism:
        value: Self-expanding nitinol valve with separate annular structure
        loc: Device Description
        source: src-saturn-ta-atssr-2024
      leaflet-material:
        value: Three bovine leaflets
        loc: Device Description
        source: src-saturn-ta-atssr-2024
      anchoring-mechanism:
        value: Subannular annular segments joined to the valve by arms
        loc: Device Description; Procedural Technique
        source: src-saturn-ta-atssr-2024
      access-route:
        value: Transapical (apical port)
        loc: Procedural Technique
        source: src-saturn-ta-atssr-2024
      available-sizes:
        value: 28 mm (all 5 patients); 31 mm later available
        loc: Device Description; Comment
        source: src-saturn-ta-atssr-2024
      post-implant-therapy:
        value: Aspirin plus warfarin (INR 2.5-3.5) or a NOAC
        loc: Procedural Technique
        source: src-saturn-ta-atssr-2024
  - version: ver-saturn-ts
    category: mitral-replacement
    values:
      expansion-mechanism:
        value: Self-expandable nitinol valve joined to annular segments
        loc: Detailed description, paragraph 2
        source: src-graph-0f649889340718ea
      frame-material:
        value: Nitinol valve frame
        loc: Detailed description, paragraph 2
        source: src-graph-0f649889340718ea
        limitation: Annular segment material not disclosed.
      leaflet-material:
        value: Bovine pericardium, three leaflets
        loc: Detailed description, paragraph 2
        source: src-graph-0f649889340718ea
        limitation: The sponsor technology page describes a bovine and porcine pericardial valve; not reconciled.
      anchoring-mechanism:
        value: Subannular annular ring mechanically connected to the valve
        loc: Management; Discussion
        source: src-saturn-ts-jaccas-2025
        context: The annular structure also allows the annulus to be reduced.
      access-route:
        value: Percutaneous transfemoral, transseptal
        loc: Management
        source: src-saturn-ts-jaccas-2025
      delivery-sheath:
        value: 29 Fr delivery system
        loc: Management
        source: src-saturn-ts-jaccas-2025
        limitation: Inner or outer diameter not stated.
      available-sizes:
        value: Two valve sizes
        loc: Discussion
        source: src-saturn-ts-jaccas-2025
        context: The 2024 transapical paper names 28 and 31 mm; the case used a 28 mm valve.
      anatomy-range-summary:
        value: Annular perimeter 90-146 mm across both sizes
        loc: Discussion
        source: src-saturn-ts-jaccas-2025
        limitation: Statement in a case report by sponsor-affiliated authors.
      imaging-guidance:
        value: CT planning with neo-LVOT modeling; TEE guidance
        loc: Management
        source: src-saturn-ts-jaccas-2025
      tissue-treatment:
        availability: not_publicly_disclosed
        loc: Detailed description (not stated)
        source: src-graph-0f649889340718ea
      indication-scope:
        value: Investigational; not commercially available in any country
        loc: Caution statement
        source: src-saturn-us-first-release
        context: The release describes CASSINI as studies in moderate-severe or severe symptomatic MR.
