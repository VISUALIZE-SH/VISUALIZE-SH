claims:
  - id: claim-wor86-simplaafy-1
    versionId: ver-watchman-flx-pro
    category: evidence
    key: wor86-simplaafy-1
    label: Population and regimen timing
    value: >-
      1857 randomized after successful uncomplicated FLX Pro implant: 624 DAPT 6 months then aspirin; 620
      reduced-dose NOAC 3 months then aspirin; 613 aspirin 12 months.
    availability: reported
    basis: directly_reported
    context: SIMPLAAFY NVAF participants eligible for all 3 regimens, site-assessed 0 mm implant seal.
    limitation: >-
      Primary analysis 1,797 (596/603/598); not failed/complicated implants, other devices or a full-dose NOAC
      comparison.
    observedAt: '2026-11-02'
    sourceRefs:
      - sourceId: src-wor86-simplaafy
        locator: Original PDF E1–E4, Figure 1, E4.
    reviewStatus: reviewed
  - id: claim-wor86-simplaafy-2
    versionId: ver-watchman-flx-pro
    category: evidence
    key: wor86-simplaafy-2
    label: Six-month primary noninferiority comparisons
    value: >-
      Composite death/stroke/systemic embolism/ISTH major bleeding: 6.9% DAPT, 5.1% NOAC, 3.3% aspirin. Both
      monotherapies noninferior (P<.001 each; 7.2 pp margin).
    availability: reported
    basis: directly_reported
    context: >-
      SIMPLAAFY primary analysis 596/603/598; monotherapy-minus-DAPT differences −1.7 pp and −3.5 pp; 97.5%
      upper 1.2 pp and −0.8 pp.
    limitation: >-
      No prespecified clinical superiority claim. Control event rate 6.9% below 15.9% design assumption;
      incomplete follow-up excluded absent events.
    observedAt: '2026-11-02'
    sourceRefs:
      - sourceId: src-wor86-simplaafy
        locator: PDF E3 Statistical Analysis/Primary End Point; Table 2, E7.
    reviewStatus: reviewed
  - id: claim-wor86-simplaafy-3
    versionId: ver-watchman-flx-pro
    category: evidence
    key: wor86-simplaafy-3
    label: Exploratory bleeding and imaging
    value: Major bleeding 4.5%/2.7%/1.7%; CRNMB 8.7%/4.8%/3.8%; 45 day DRT 3.4%/0.9%/2.7% (DAPT/NOAC/aspirin).
    availability: reported
    basis: directly_reported
    context: 'SIMPLAAFY FLX Pro: major bleeding 27/596, 16/603, 10/598; DRT 20/584, 5/584, 16/582.'
    limitation: >-
      Exploratory/unadjusted; no prespecified imaging hypothesis. Not proof of lower DRT with aspirin or
      stroke equivalence.
    observedAt: '2026-11-02'
    sourceRefs:
      - sourceId: src-wor86-simplaafy
        locator: Tables 2–3E 7–E8 and footnotes; Statistical AnalysisE 3.
    reviewStatus: reviewed
  - id: claim-wor86-simplaafy-4
    versionId: ver-watchman-flx-pro
    category: evidence
    key: wor86-simplaafy-4
    label: Follow-up and applicability limits
    value: >-
      Six-month clinical and 45 day imaging report only; 12 month secondary analysis incomplete. Ischemic
      stroke 4 events per group (0.7% each).
    availability: reported
    basis: directly_reported
    context: >-
      SIMPLAAFY successful uncomplicated FLX Pro cohort; no residual leak by implanting site before
      randomization.
    limitation: >-
      Low event counts do not establish stroke equivalence; core-lab seal discordance disclosed. No
      other-device/full-dose NOAC inference.
    observedAt: '2026-11-02'
    sourceRefs:
      - sourceId: src-wor86-simplaafy
        locator: PDF E2–E3 follow-up/eligibility; Tables 2–3E 7–E8; LimitationsE 9–E10.
    reviewStatus: reviewed
