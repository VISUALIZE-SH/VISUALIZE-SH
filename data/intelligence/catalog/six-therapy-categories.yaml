versions:
  - id: ver-occlutech-pvl
    familyId: family-occlutech-pvl
    graphEntityId: dev-occlutech-pvl
    name: Occlutech Paravalvular Leak Device
    kind: device
    clinicalRole: treats
    summary: Dedicated plug for selected mitral and aortic prosthetic PVL closure; 144 enrolled; the 112-patient full-analysis set reported >90% procedural success by leak stratum; 80 had two-year follow-up.
    sourceRefs: [{ sourceId: src-pvl-pld-outcomes, locator: "Abstract; enrollment and procedural-success results; Tables 2-3"}]
    reviewStatus: reviewed
  - id: ver-neochord-ds1000
    familyId: family-neochord
    graphEntityId: dev-neochord-ds1000
    name: NeoChord DS1000
    kind: device
    clinicalRole: treats
    summary: Transapical system for beating-heart placement of artificial mitral chordae.
    sourceRefs: [{ sourceId: src-rechord-registry, locator: "Study Status; Study Plan; last update 2026-04-08"}]
    reviewStatus: reviewed
  - id: ver-mi-chord
    familyId: family-mi-chord
    graphEntityId: dev-mi-chord
    name: Mi-CHORD System
    kind: device
    clinicalRole: treats
    summary: FDA De Novo authorized surgical artificial chordae system; clinical evidence comprises an OUS 12-patient feasibility cohort.
    sourceRefs: [{ sourceId: src-michord-fda, locator: "pp. 5, 11-14; implant materials and clinical information"}]
    reviewStatus: reviewed
  - id: ver-tricvalve
    familyId: family-tricvalve
    graphEntityId: dev-tricvalve
    name: TricValve Transcatheter Bicaval Valve System
    kind: device
    clinicalRole: treats
    summary: EU CE-marked bicaval system. TRICUS EURO reported technical success in 34/35 (97%) and procedural success in 33/35 (94%).
    sourceRefs: [{ sourceId: src-tricvalve-tricus-euro, locator: "Results: procedural outcomes and primary outcomes"}]
    reviewStatus: reviewed
  - id: ver-sapien-xt-caval
    familyId: family-sapien-caval
    graphEntityId: dev-edwards-sapien-xt-caval
    name: SAPIEN XT IVC caval implantation (TRICAVAL use)
    kind: device
    clinicalRole: treats
    summary: Investigational/off-label IVC use; TRICAVAL enrolled 28 and was terminated due to safety concerns.
    sourceRefs: [{ sourceId: src-tricaval-registry, locator: "Study Status: Terminated; reason: Safety concerns; enrollment 28"}]
    reviewStatus: reviewed
  - id: ver-revivent-tc
    familyId: family-revivent
    graphEntityId: dev-revivent-tc
    name: Revivent TC System
    kind: device
    clinicalRole: treats
    summary: "ALIVE trial: 12-month hierarchical efficacy composite not significantly different (win ratio 1.13; P=0.32)."
    sourceRefs: [{ sourceId: src-revivent-alive, locator: "Abstract; primary efficacy outcome"}]
    reviewStatus: reviewed
  - id: ver-corcap
    familyId: family-corcap
    graphEntityId: dev-corcap
    name: CorCap Cardiac Support Device
    kind: device
    clinicalRole: treats
    summary: Historical experimental polyester mesh cardiac restraint; 5-year follow-up of 107 no-MVR cohort showed similar survival but reduced LVEDV and improved NYHA status.
    lifecycleStatus: retired
    lifecycleDetail: A peer-reviewed review states the investigational product was completely withdrawn from the market after FDA non-approval; this is not an FDA recall.
    sourceRefs: [{ sourceId: src-corcap-five-year, locator: "Abstract; Methods and Results; five-year no-MVR cohort"}, { sourceId: src-corcap-retired-review, locator: "CorCap review; passage describing FDA non-approval and product market withdrawal"}]
    reviewStatus: reviewed
  - id: ver-heartnet
    familyId: family-heartnet
    graphEntityId: dev-heartnet
    name: Paracor HeartNet
    kind: device
    clinicalRole: treats
    summary: Investigational elastic restraint device in PEERLESS-HF, which stopped enrollment after interim futility.
    sourceRefs: [{ sourceId: src-peerless-hf, locator: "Abstract; early stop for futility"}]
    reviewStatus: reviewed
  - id: ver-avp3-pvl
    familyId: family-avp3-pvl
    graphEntityId: dev-amplatzer-pvl-plug-iii
    name: Amplatzer Valvular Plug III (PVL use)
    kind: device
    clinicalRole: treats
    summary: Plug used in observational PVL closures; the KISS registry included 171 transcatheter procedures, most commonly using AVP III (140 procedures), with 78.9% technical success overall in the transcatheter arm.
    sourceRefs: [{ sourceId: src-avp3-kiss, locator: "Table 3: PVL closure devices and overall transcatheter technical success" }]
    reviewStatus: reviewed
  - id: ver-tricento
    familyId: family-tricento
    graphEntityId: dev-tricento
    name: TRICENTO bicaval valved stent
    kind: device
    clinicalRole: treats
    summary: In a 21-patient multicenter registry, technical success was 100%, asymptomatic stent fractures occurred in 3, and one-year survival was 76%; follow-up median 61 days.
    sourceRefs: [{ sourceId: src-tricento-registry, locator: "Abstract; results and follow-up" }]
    reviewStatus: reviewed
  - id: ver-accucinch
    familyId: family-accucinch
    graphEntityId: dev-accucinch
    name: AccuCinch Ventricular Restoration System
    kind: device
    clinicalRole: treats
    summary: Investigational transcatheter LV restoration system; CORCINCH-HF is a randomized pivotal study with estimated enrollment 400. Early-study two-year follow-up has been reported separately.
    sourceRefs: [{ sourceId: src-accucinch-corcinch, locator: "Study Design; enrollment target and status" }, { sourceId: src-accucinch-two-year-paper, locator: "Abstract; two-year follow-up results" }]
    reviewStatus: reviewed
  - id: ver-heartmate-ii
    familyId: family-heartmate-ii
    graphEntityId: dev-heartmate-ii
    name: HeartMate II LVAS
    kind: device
    clinicalRole: treats
    summary: FDA PMA authorized axial-flow LVAD; evaluated as the comparator against HeartMate 3 in MOMENTUM 3.
    sourceRefs: [{ sourceId: src-heartmate-ii-pma, locator: "PMA approval order; decision date 2008-04-21" }, { sourceId: src-heartmate3-ssed, locator: "Clinical Studies; randomized comparator group" }]
    reviewStatus: reviewed
  - id: ver-heartmate-3
    familyId: family-heartmate-3
    graphEntityId: dev-heartmate-3
    name: HeartMate 3 LVAD
    kind: device
    clinicalRole: treats
    summary: FDA-approved durable LVAD evaluated in MOMENTUM 3; see five-year trial readout for long-term outcomes.
    sourceRefs: [{ sourceId: src-heartmate3-ssed, locator: "Device description and indications"}, { sourceId: src-heartmate3-five-year, locator: "Five-year overall survival"}, { sourceId: src-heartmate3-acc-five-year, locator: "Contextual summary"}]
    reviewStatus: reviewed
  - id: ver-heartmate-3-kit-106524us
    familyId: family-heartmate-3
    graphEntityId: dev-heartmate-3-lvas-kit-106524us
    name: Affected 11V backup batteries in HeartMate 3 kit 106524US
    kind: device
    clinicalRole: treats
    lifecycleStatus: recalled
    lifecycleDetail: FDA Class II recall Z-2518-2026 applies to specified 11V lithium-ion backup batteries in LVAS kit model 106524US, limited to affected serial numbers; the action does not designate every implanted HM3 pump as recalled.
    summary: Only specified 11V lithium-ion backup batteries in model 106524US kits, identified by affected serial numbers, are included in the open FDA recall; other kits and implanted pumps are not flagged by this record.
    sourceRefs: [{ sourceId: src-heartmate3-recall-kit, locator: "Recall identifiers, product/model, date initiated/posted, status"}]
    reviewStatus: reviewed
