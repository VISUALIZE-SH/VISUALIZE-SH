      pivotal-trials:
        availability: not_applicable
        loc: n/a
        context: No US pivotal trial applies because the device was never FDA-authorized.

  # --------------------------------------------------------------- Trilogy
  - version: ver-trilogy
    category: aortic-regurgitation-tavr
    source: src-trilogy-ssed
    values:
      frame-material:
        value: Self-expanding nitinol with 3 Locators bearing tantalum radiopaque markers
        loc: 'p.2, V. Device Description'
      expansion-mechanism:
        value: Self-expanding
        loc: 'p.2, V. Device Description'
      leaflet-material:
        value: Trileaflet porcine pericardium, sewn with polyester sutures
        loc: 'p.2, V. Device Description'
      tissue-treatment:
        availability: not_publicly_disclosed
        loc: 'p.2 device description and p.9 tissue-characterization testing (glutaraldehyde crosslinking confirmed; no named proprietary process disclosed)'
        context: The SSED describes "glutaraldehyde crosslinking" and "proprietary tissue processing" (bench comparability testing, p.9-11) without naming a branded tissue-treatment process.
      sealing-design:
        value: Flared Sealing Ring extending from the LVOT inflow to the annular basal plane
        loc: 'p.2, V. Device Description'
      anchoring-mechanism:
        value: 3 Locators clip and capture native leaflets (no calcium anchor)
        loc: 'p.2, V. Device Description'
        context: Between the Locators and stent body. This active-anchoring mechanism is what allows THV fixation in patients with pure aortic regurgitation, who typically lack the annular calcium that anchors conventional TAVR valves.
      repositionable:
        value: Locators repositionable before Sealing Ring release only
        source: src-trilogy-ifu
        loc: 'p.19–20, Deployment/recapture warnings'
        context: Partial deployment only; not repositionable/retrievable once the Sealing Ring has deployed.
      access-route:
        value: Transfemoral (percutaneous or cutdown); vessel >=7.0 mm
        source: src-trilogy-ifu
        loc: 'p.10, Patient selection criteria; p.4, Device Description'
        context: Minimum femoral/iliac vessel diameter 7.0 mm.
      delivery-sheath:
        value: 22 Fr Introducer Sheath OD; 20 Fr Delivery Catheter OD
        loc: 'p.2–3, V. Device Description'
      available-sizes:
        value: 23, 25, 27 mm
        loc: 'p.2, V. Device Description'
      anatomy-range-summary:
        value: 'Aortic annulus diameter 21–28.6 mm (annulus perimeter 66–90 mm), by MDCT or TEE'
        source: src-trilogy-ifu
        loc: 'p.7, Table 2 THV Sizing Chart'
        context: 'By size: 23 mm 21–24.2 mm; 25 mm 24.2–26.4 mm; 27 mm 26.4–28.6 mm annulus diameter.'
      indication-scope:
        value: Symptomatic severe native AR, high or greater surgical risk
        loc: 'p.1, II. Indications for Use'
        context: 'AR = aortic regurgitation; not endocarditis/rheumatic/dissection-related. Exact wording: "...treatment of symptomatic, severe native tricuspid aortic valve regurgitation... in patients who are judged by a Heart Team, including a cardiac surgeon, to be at high or greater risk for surgical aortic valve replacement (i.e., predicted risk of surgical mortality >=8% at 30 days...)."'
      pivotal-trials:
        value: ALIGN-AR study (IDE G150035) + ALIGN-AR continued access program (CAP) cohort
        loc: 'p.13, X. Summary of Primary Clinical Study'

