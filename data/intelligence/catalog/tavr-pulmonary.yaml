        loc: 'p.1, Valve Size table'
      anatomy-range-summary:
        value: 'S 21–23mm; M 23–25mm; L 25–27mm (CT perimeter-derived)'
        loc: 'p.1, Valve Size table'
        context: Aortic annulus diameter. Annulus perimeter ranges also given (66–85 mm across S/M/L).
      indication-scope:
