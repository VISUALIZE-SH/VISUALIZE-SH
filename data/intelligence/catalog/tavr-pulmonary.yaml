        loc: 'p.1–2 (not stated in this spec sheet)'
        context: The IFU that would normally document recapture/reposition capability (51081293-01A_ACURATEneo2_IFU_OUS_ML_s.pdf) returns HTTP 404 as of 2026-09-23 and no Wayback Machine snapshot was found.
