families:
  - id: family-navitor
    name: Navitor
    manufacturer: Abbott
    entityIds: [dev-navitor]
    conditionIds: [cond-as]
    description: Built on the Portico (P190023) delivery/frame platform; the Navitor trade name and NaviSeal outer sealing cuff were introduced by a 2023 design-change supplement, not a fresh original PMA.
  - id: family-acurate
    name: ACURATE neo2
    manufacturer: Boston Scientific
    entityIds: [dev-acurate-neo2]
    conditionIds: [cond-as]
    description: CE-marked self-expanding TAVR; no PMA or 510(k) record exists in the FDA PMA/510(k) databases (openFDA, checked 2026-09-23), confirming it was never FDA authorized. Boston Scientific discontinued the platform worldwide in 2025.
  - id: family-trilogy
    name: Trilogy
    manufacturer: JenaValve Technology
    entityIds: [dev-trilogy]
    conditionIds: [cond-ar, cond-as]
    description: Anatomically-aligned leaflet Locators anchor the frame without relying on annular calcium, the mechanism behind the first FDA approval for native aortic regurgitation.
  - id: family-melody
    name: Melody
    manufacturer: Medtronic
    entityIds: [dev-melody]
    conditionIds: [cond-pv]
    description: Bovine-jugular-vein valve for dysfunctional RVOT conduits; converted from a 2010 Humanitarian Device Exemption to a full 2015 PMA approval for the same conduit population.
  - id: family-harmony
    name: Harmony
    manufacturer: Medtronic
    entityIds: [dev-harmony]
    conditionIds: [cond-pv]
    description: Self-expanding nitinol platform sized for the native/surgically-repaired RVOT and main pulmonary artery, distinct from Melody's conduit-only indication.

versions:
  - id: ver-navitor
    familyId: family-navitor
    name: Navitor
    kind: device
    clinicalRole: treats
    summary: NaviSeal-cuffed evolution of the Portico platform; introduced in the US by a 2023 design-change supplement to PMA P190023.
    sourceRefs:
      - sourceId: src-navitor-s002
        locator: Approval Order Statement and Device field
    reviewStatus: draft
  - id: ver-acurate-neo2
    familyId: family-acurate
    name: ACURATE neo2
    kind: device
    clinicalRole: treats
    summary: Top-down-deployed, supra-annular self-expanding valve; CE-marked only — never reached FDA authorization, and the platform was discontinued in 2025.
    sourceRefs:
      - sourceId: src-acurate-neo2-specsheet
        locator: p.1, Specifications table
    reviewStatus: draft
  - id: ver-trilogy
    familyId: family-trilogy
    name: Trilogy
    kind: device
    clinicalRole: treats
    summary: First transcatheter heart valve with a US indication for native aortic regurgitation, approved under PMA P250024.
    sourceRefs:
      - sourceId: src-trilogy-ssed
        locator: p.1, General Information and Indications for Use
    reviewStatus: draft
  - id: ver-melody
    familyId: family-melody
    name: Melody TPV
    kind: device
    clinicalRole: treats
    summary: Balloon-expandable bovine-jugular-vein valve for dysfunctional RVOT conduits; the device identity is unchanged between the 2010 HDE and 2015 PMA.
    sourceRefs:
      - sourceId: src-melody-ssed
        locator: p.1, General Information
    reviewStatus: draft
  - id: ver-harmony
    familyId: family-harmony
    name: Harmony TPV
    kind: device
    clinicalRole: treats
    summary: Self-expanding nitinol valve for severe pulmonary regurgitation in a native or surgically-repaired RVOT, available in two sizes (TPV 22, TPV 25).
    sourceRefs:
      - sourceId: src-harmony-ssed
        locator: p.1-2, General Information and Device Description
    reviewStatus: draft

