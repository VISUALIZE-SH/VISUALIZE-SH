# tavr-pulmonary.yaml — aortic TAVR (SAPIEN 3 family, Evolut family, Navitor, ACURATE neo2),
# JenaValve Trilogy (aortic regurgitation), and Medtronic Melody/Harmony (pulmonary valves).
#
# Non-paywall gaps (not listed as needs-fulltext because no paywall is involved):
#  - ACURATE neo2 IFU (51081293-01A_ACURATEneo2_IFU_OUS_ML_s.pdf) returns HTTP 404 as of
#    2026-09-23; the 2-page product spec sheet was used instead. Delivery-catheter true OD and
#    repositionability are not stated in the spec sheet and are left not_publicly_disclosed.
#  - SAPIEN 3 Ultra RESILIA (PMA P140031/S141) has no public SSED or labeling PDF (design-change
#    supplement; FDA lists only a one-line Approval Order Statement). Design attributes are
#    sourced to the shared SAPIEN 3 Ultra platform IFU (S085D) plus Edwards' RESILIA launch
#    release; available-sizes for the RESILIA-tissue configuration specifically is left
#    not_publicly_disclosed.
#  - Navitor (PMA P190023/S002) likewise has no public SSED/labeling PDF; design/sizing data
#    comes from the Abbott eIFU (ARTMT600163776 Rev B, dated 2022), which predates the 35 mm
#    "Navitor Titan" size added by supplement S013 (2023-09-15).

