specs:
  # ---------------------------------------------------------------- SAPIEN 3
  - version: ver-sapien-3
    category: aortic-tavr-valves
    source: src-sapien-ifu-s085
    values:
      tissue-treatment:
        value: Carpentier-Edwards ThermaFix leaflet treatment
        loc: 'PDF p.100, Device Description §1.0'
      repositionable:
        value: Not repositionable — single balloon-inflation deployment
        loc: 'PDF p.100, Device Description §1.0'
        context: 'No recapture/resheath mechanism described. Balloon-expandable design; "device recapture or retrieval" appears only as a procedural adverse-event category in the SSED, not as a designed feature.'
      access-route:
        value: 'Transfemoral (primary); transapical, transaortic (alternative)'
        loc: 'PDF p.6 (eSheath access exclusions); PDF p.17 (clinical TF/TA/TAo access breakdown)'
      delivery-sheath:
        value: 14 Fr or 16 Fr Edwards eSheath introducer set
        loc: 'PDF p.6, Contraindications/exclusion criteria'
        context: Labeled introducer size, not a measured maximum delivery-system OD.
      available-sizes:
        value: '20, 23, 26, 29 mm (valve heights 15.5–22.5 mm)'
        loc: 'PDF p.100, Table 2'
      anatomy-range-summary:
        value: '20mm 16–19mm; 23mm 18–22mm; 26mm 21–25mm; 29mm 24–28mm'
        loc: 'PDF p.101, Table 3'
        context: 'By size, TEE annulus diameter. CT area-derived range is also given per size (e.g. 20 mm = 273–345 mm²); valve-in-valve sizing for a failed surgical bioprosthesis uses a separate true-ID table (PDF p.101, Table 4).'
      indication-scope:
        value: Native AS, any surgical risk; ViV for failed AV/MV, high+ risk
        loc: 'PDF p.103, §2.0 Indications'
        context: 'AS = aortic stenosis; ViV = valve-in-valve; risk per Heart Team judgment. Exact wording: (1) "relief of aortic stenosis in patients... judged... to be appropriate for the transcatheter heart valve replacement therapy" (no risk-stratum language — reflects the low-risk-inclusive label); (2) valve-in-valve for failed surgical aortic/mitral bioprosthesis, "high or greater risk... predicted risk of surgical mortality >=8% at 30 days."'
      pivotal-trials:
        value: PARTNER II trial — SAPIEN 3 high-risk cohort (PIIS3HR) + Nested Registry #7 (NR7); IDE G090216
        source: src-sapien-ssed
        loc: 'p.21, Section X Summary of Primary Clinical Study'

  # ------------------------------------------------------- SAPIEN 3 Ultra RESILIA
  - version: ver-sapien-ultra-resilia
    category: aortic-tavr-valves
    source: src-sapien-ifu-s085
    values:
      frame-material:
        value: Cobalt-chromium (shared SAPIEN 3 Ultra platform frame)
        loc: 'PDF p.100, Device Description §1.0'
        context: S141 (the RESILIA-specific supplement) changes tissue and skirt material only; frame design is inherited from the SAPIEN 3 Ultra platform described in this combined IFU.
      expansion-mechanism:
        value: Balloon-expandable
        loc: 'PDF p.100, Device Description §1.0'
      leaflet-material:
        value: Trileaflet bovine pericardium
        loc: 'PDF p.100, Device Description §1.0'
      sealing-design:
        value: Polyethylene terephthalate (PET) inner and outer fabric skirts
        loc: 'PDF p.100, Device Description §1.0'
        context: The added outer skirt (vs. the base SAPIEN 3's single skirt) is what defines the "Ultra" platform; not specific to the RESILIA tissue change.
      tissue-treatment:
        value: 'RESILIA tissue: anti-calcification treatment, dry packaging'
        source: src-edwards-resilia-launch
        loc: 'Press release body, paragraphs 2–4'
        context: 'Non-glutaraldehyde-storage packaging. Edwards: "RESILIA tissue is a bovine pericardial tissue treated with advanced anti-calcification technology... dry tissue packaging conditions that facilitate ease of use... the only dry storage transcatheter heart valve on the U.S. market today" (as of the 2022-09-12 launch). This differs from the ThermaFix process used on non-RESILIA SAPIEN 3/SAPIEN 3 Ultra valves.'
      repositionable:
        value: Not repositionable — single balloon-inflation deployment
        loc: 'PDF p.100, Device Description §1.0'
        context: Same mechanism as base SAPIEN 3 Ultra platform.
      access-route:
        value: 'Transfemoral (primary); transapical, transaortic (alternative)'
        loc: 'PDF p.6 (eSheath access exclusions, shared platform document); no RESILIA-specific access statement located'
      delivery-sheath:
        value: 14 Fr or 16 Fr Edwards eSheath introducer set
        loc: 'PDF p.6, Contraindications/exclusion criteria'
        context: Shared Ultra-platform delivery system.
      available-sizes:
        availability: not_publicly_disclosed
        loc: 'S141 Approval Order Statement (no size table); no RESILIA-specific IFU located'
        context: The shared SAPIEN 3 Ultra platform (this IFU) lists 20/23/26 mm only (no 29 mm) — PDF p.100 Table 1 — but no source confirms this identically for the RESILIA-tissue configuration.
      anatomy-range-summary:
        value: 'Platform range (20/23/26 mm only): 16–19 to 21–25 mm TEE'
        loc: 'PDF p.101, Table 3 (Ultra sizes only)'
        context: SAPIEN 3 Ultra platform; TEE annulus diameter. Not confirmed as RESILIA-specific; no dedicated RESILIA sizing table was located.
      indication-scope:
        value: Native AS, any surgical risk; failed AV/MV bioprosthesis, high+
        loc: 'PDF p.103, §2.0 Indications (shared platform document)'
        context: AS = aortic stenosis; risk per Heart Team judgment. S141's approval order does not state an indication change; RESILIA is a tissue/material substitution on the existing Ultra indication.
      pivotal-trials:
        availability: not_applicable
        loc: 'S141 Approval Order Statement'
        context: S141 is a device/material-change supplement (RESILIA tissue substitution on the existing SAPIEN 3 Ultra platform); the approval order does not reference a dedicated clinical trial, consistent with a bench/comparability-based design-change review.

  # ---------------------------------------------------------------- Evolut FX
  - version: ver-evolut-fx
    category: aortic-tavr-valves
    source: src-evolut-ifu
    values:
      tissue-treatment:
        value: Alpha-amino oleic acid (AOA) anti-mineralization treatment
        loc: 'PDF p.32, §1.1 Evolut FX transcatheter aortic valve'
      leaflet-position:
        value: Supra-annular
        loc: 'Supra-annular design benefits'
        source: src-medtronic-evolut-durability
        context: Manufacturer statement for the Evolut platform; the working leaflets sit above the native annulus.
      repositionable:
        value: Recapturable, up to 3 attempts
        loc: 'PDF p.33, §1.2 Delivery catheter system; PDF p.20, deployment/recapture instructions'
        context: 'Before the "point of no recapture"; deployment-knob mechanism.'
      access-route:
        value: 'Transfemoral (primary); subclavian/axillary, direct aortic (alternative)'
        loc: 'PDF p.10, Warnings and precautions (access-site criteria)'
      delivery-sheath:
        value: '23–29mm: 18 Fr (6.0mm) capsule; 34mm: 22 Fr (7.33mm) capsule'
        loc: 'PDF p.33, §1.2 Delivery catheter system and Figure 2'
        context: 14 Fr equivalent inline sheath (23-29mm valves); 18 Fr equivalent inline sheath (34mm valve).
      available-sizes:
        value: 23, 26, 29, 34 mm
        loc: 'PDF p.32, Table 2'
      anatomy-range-summary:
        value: '23mm 17/18–20mm; 26mm 20–23mm; 29mm 23–26mm; 34mm 26–30mm'
        loc: 'PDF p.32, Table 2'
        context: Aortic annulus diameter by size. Annulus perimeter equivalents also given per size (diameter × π); TAV-in-SAV/TAV-in-TAV criteria apply to the failed valve's measured inner diameter.
      indication-scope:
        value: Native AS, appropriate for THV; ViV for failed AV, high+ risk
        loc: 'PDF p.35, §2 Indications'
        context: THV per Heart Team; failed surgical/transcatheter bioprosthetic AV.
      pivotal-trials:
        value: STS/ACC TVT Registry real-world redo-TAVR analysis (basis for PMA P130021/S174)
        source: src-evolut-ssed
        loc: 'p.5 (repo tmp/pdfs/P130021S174B.txt), Section X Summary of Primary Clinical Study'
        context: This registry analysis specifically supports the 2025 redo-TAVR indication (decision-evolut-s174). The base Evolut FX device generation itself was introduced by a 2021 design-change supplement (decision-evolut-fx-s094) that cites no dedicated new clinical trial.

  # -------------------------------------------------------------- Evolut FX+
  - version: ver-evolut-fx-plus
    category: aortic-tavr-valves
    source: src-evolut-ifu
    values:
      frame-material:
        value: Self-expanding nitinol, multi-level frame, 3 gold markers
        loc: 'PDF p.60, §1.1 Evolut FX+ transcatheter aortic valve'
        context: Radiopaque markers near the inflow.
      leaflet-material:
        value: Processed porcine pericardium (3 leaflets + inner skirt)
        loc: 'PDF p.60, Table 1'
        context: Single-layer; 23 mm valve also uses ePTFE suture.
      sealing-design:
        value: Porcine pericardial outer skirt (wrap), 1.5 cells tall
        loc: 'PDF p.60, §1.1 Evolut FX+ transcatheter aortic valve'
        context: Sutured at the inflow.
      tissue-treatment:
        value: Alpha-amino oleic acid (AOA) anti-mineralization treatment
        loc: 'PDF p.60, §1.1 Evolut FX+ transcatheter aortic valve'
      leaflet-position:
        value: Supra-annular
        loc: 'Supra-annular design benefits'
        source: src-medtronic-evolut-durability
        context: Manufacturer statement for the Evolut platform; the working leaflets sit above the native annulus.
      repositionable:
        value: Recapturable, up to 3 attempts
        loc: 'PDF p.60–61, §1.2 Delivery catheter system'
        context: 'Before the "point of no recapture"; same deployment-knob mechanism as Evolut FX.'
      access-route:
        value: 'Transfemoral (primary); subclavian/axillary, direct aortic (alternative)'
        loc: 'PDF p.10, Warnings and precautions (shared access-site criteria in this combined labeling)'
      delivery-sheath:
        value: '23–29mm: 18 Fr (6.0mm) capsule; 34mm: 22 Fr (7.33mm) capsule'
        loc: 'PDF p.60–61, §1.2 Delivery catheter system'
        context: 14 Fr equivalent inline sheath (23-29mm valves); 18 Fr equivalent inline sheath (34mm valve). Same delivery-catheter models (D-EVOLUTFX-2329 / D-EVOLUTFX-34) as Evolut FX.
      available-sizes:
        value: 23, 26, 29, 34 mm
        loc: 'PDF p.60–61, Table 2'
      anatomy-range-summary:
        value: '23mm 17/18–20mm; 26mm 20–23mm; 29mm 23–26mm; 34mm 26–30mm'
        loc: 'PDF p.60–61, Table 2'
        context: Aortic annulus diameter by size. Identical anatomical sizing table to Evolut FX; FX+ differs by the added frame windows (coronary-access-feature), not by annulus range.
      indication-scope:
        value: Native AS, appropriate for THV; ViV for failed AV, high+ risk
        loc: 'PDF p.63, §2 Indications'
        context: THV per Heart Team; failed surgical/transcatheter bioprosthetic AV.
      pivotal-trials:
        value: STS/ACC TVT Registry real-world redo-TAVR analysis (basis for PMA P130021/S174)
        source: src-evolut-ssed
        loc: 'p.5 (repo tmp/pdfs/P130021S174B.txt), Section X Summary of Primary Clinical Study'
        context: Supports the 2025 redo-TAVR indication. The FX+ generation itself was introduced by a 2024 design-change supplement (decision-evolut-fx-plus-s155) that cites no dedicated new clinical trial.

  # ---------------------------------------------------------------- Navitor
  - version: ver-navitor
    category: aortic-tavr-valves
    source: src-navitor-ifu
    values:
      manufacturer:
        value: Abbott
        source: src-navitor-s002
        loc: Applicant field
      family:
        value: Navitor
        source: src-navitor-s002
        loc: Device/trade-name field
      exact-version:
        value: Navitor
        source: src-navitor-s002
        loc: Device/trade-name field
      frame-material:
        value: Nitinol (self-expanding, radiopaque)
        loc: 'PDF p.3, Description'
      expansion-mechanism:
        value: Self-expanding
        loc: 'PDF p.3, Description'
      leaflet-material:
        value: Trileaflet bovine pericardium
        loc: 'PDF p.3, Description'
      sealing-design:
        value: 'NaviSeal cuff: inner/outer polyethylene layers fill voids'
        loc: 'PDF p.3, Description'
        context: Between the native valve and stent.
      tissue-treatment:
        value: Glutaraldehyde-crosslinked leaflet, Linx anticalcification
        loc: 'PDF p.3, Description'
        context: Leaflet pericardium preserved/crosslinked in glutaraldehyde.
      leaflet-position:
        value: Intra-annular leaflets
        loc: 'PDF p.9, Performance Characteristics'
        context: 'Exact wording: "contains intra-annular leaflets which provide early function and hemodynamic stability prior to final valve deployment."'
      repositionable:
        value: Re-sheathable/repositionable up to 2 times
        loc: 'PDF p.4, FlexNav Delivery System'
        context: Provided the valve has not been fully deployed.
      access-route:
        value: 'Transfemoral (primary); subclavian, axillary (alternative)'
        loc: 'PDF p.4, FlexNav Delivery System'
      delivery-sheath:
        value: '23/25mm: 14 Fr (6.0mm); 27/29mm: 15 Fr (6.3mm) capsule'
        loc: 'PDF p.4, Table 3'
        context: Compatible with separate 18 Fr / 19 Fr introducer sheaths. FlexNav's own integrated sheath is reported as an "equivalent" French size (labeled), not a directly measured true OD; the capsule OD in mm is directly measured.
      available-sizes:
        value: 23, 25, 27, 29 mm
        loc: 'PDF p.3, Table 1'
        context: A larger 35 mm "Navitor Titan" size was added by FDA supplement P190023/S013 (2023-09-15, per openFDA), after this 2022 IFU revision; not covered by this document.
      anatomy-range-summary:
        value: '23mm 19–21mm; 25mm 21–23mm; 27mm 23–25mm; 29mm 25–27mm'
        loc: 'PDF p.3–4, Table 2'
        context: Annulus diameter by size. Ascending aorta diameter, annulus area (mm²) and perimeter (mm) ranges are also tabulated per size.
      indication-scope:
        value: Native AS, high+ surgical risk (STS mortality >=8% at 30d)
        source: src-navitor-original
        loc: Approval Order Statement (base PMA P190023, 2021-09-17)
        context: 'STS-based predicted mortality. This is the base-PMA indication inherited via the S002 design-change supplement; no US labeling supplement broadening the risk category (e.g. to intermediate/low risk) was identified among P190023 supplements through S034 (2026-07-09, per openFDA). The international IFU used for design attributes states a similar but not identical "high or extreme risk" phrasing (p.5, Indications) — not used here because it is not the US-specific label.'
      pivotal-trials:
        value: NCT04011722 (trial number listed against the P190023/S002 FDA record)
        source: src-navitor-s002
        loc: Clinical Trials field
        context: The public FDA record lists this trial number but does not name the study or describe its design; S002 is a bench/comparability-based design-change supplement (NaviSeal outer skirt), and the approval order itself references no clinical trial.

