    hierarchy: secondary
    measureType: continuous
    timeframe: 5 years
    analysisPopulation: No-MVR randomized stratum; 107 enrolled, 57 did not complete five-year follow-up due to death, loss to follow-up, or withdrawal.
    sourceRefs:
      - sourceId: src-corcap-five-year
        locator: 'Results; longitudinal regression analysis of LVEDV'
    reviewStatus: reviewed
  - id: endpoint-kiss-technical-success
    name: KISS procedural technical success
    definition: Technical success of the assigned paravalvular leak closure strategy.
    hierarchy: secondary
    measureType: binary
    timeframe: Procedure
    analysisPopulation: Transcatheter closure and surgery groups, 171 and 164 patients respectively; registry-level, not AVP III-specific.
    sourceRefs:
