scopeNote: >-
  Six of sixteen candidate News records are analyzed.
  Connections are analytical interpretations. Internal links show current catalog context, not a historical
  snapshot or independent corroboration. The selection does not establish a field-wide trend.
opening:
  - text: >-
      Selected developments in this window concern pediatric eligibility, computational validation, and patient-facing
      monitoring. Across these domains, the scope of a claim depends on the population, conditions, and observation period
      evaluated. This edition examines those boundaries and identifies evidence that could extend them.
    sourceIds: [autus-fda, camzyos-fda, tavr-fsi, mitral-fsi, echodino, cardioguide]
    interpretation: true
sections:
  - heading: 'Pediatric evidence and duration of follow-up'
    role: insight
    paragraphs:
      - text: >-
          FDA approved AUTUS, a surgical pulmonary valve designed for subsequent balloon expansion as a child grows.
          The announcement reports two expansions and ongoing longer-term study. Lifetime reductions in reoperation
          remain unestablished.
        sourceIds: [autus-fda]
        contextLinks: [{label: 'AUTUS evidence', versionId: ver-autus-size-adjustable}]
      - text: >-
          CAMZYOS eligibility now includes US pediatric patients weighing at least 30 kg with symptomatic obstructive HCM.
          FDA describes SCOUT-HCM as 44 patients aged 12–18, evaluated against placebo for Valsalva outflow-tract gradient
          at Week 28. Functional and symptom benefit in pediatric patients is described as expected. The heart-failure
          boxed warning and REMS requirements remain.
        sourceIds: [camzyos-fda, camzyos-date]
        contextLinks: [{label: 'CAMZYOS evidence', versionId: ver-camzyos}]
      - text: >-
          These separate indications share a longitudinal evidence question: how well do observations represent later
          patient states? AUTUS requires evaluation after expansion; CAMZYOS requires distinction between authorized
          eligibility, studied ages, endpoints, and follow-up. Neither announcement resolves the full pediatric time horizon.
        sourceIds: [autus-fda, camzyos-fda]
        interpretation: true
        contextLinks:
          - {label: 'AUTUS', versionId: ver-autus-size-adjustable}
          - {label: 'CAMZYOS', versionId: ver-camzyos}
  - heading: 'Model inputs and independent validation'
    role: connection
    paragraphs:
      - text: >-
          Three modeling studies illustrate different validation boundaries. Interpretation requires identifying supplied
          inputs, calibration data, independent observations, and intended use. Shared terminology does not make their
          tests equivalent.
        sourceIds: [tavr-fsi, mitral-fsi, echodino]
        interpretation: true
      - text: >-
          The TAVR preprint evaluates a 26-mm CoreValve Evolut R. Parameters calibrated at 70 bpm are retained at 60 and
          80 bpm, while upstream forcing remains measurement-informed at each rate. Independent downstream checks
          therefore constitute conditional bench validation. They do not establish patient-level prediction or applicability
          to Evolut FX/FX+.
        sourceIds: [tavr-fsi]
      - text: >-
          The mitral study uses one representative geometry per disease etiology, simplified anatomy, and no direct
          volumetric or in-vivo validation. EchoDino reports patient-disjoint downstream tests and external benchmarks;
          its internal TCH-SHD evaluation overlaps the unlabeled pretraining corpus. This distinction concerns pretraining
          independence and does not establish label leakage or invalidate external benchmarks. Longitudinal adult congenital-heart
          validation and clinical actionability remain unresolved.
        sourceIds: [mitral-fsi, echodino]
    table:
      caption: 'Validation scope. Original analytical comparison; TAVR FSI and EchoDino are preprints. Atlas links provide broad context, not paper-specific evidence.'
      columns: ['Study', 'Inputs or assumptions', 'Evaluation', 'Unresolved scope']
      rows:
        - cells: ['TAVR FSI · Evolut R', 'Measured forcing; 70-bpm calibration.', 'Downstream pressure and projected valve area at 60/80 bpm.', 'New loading, patient anatomy, other generations.']
          sourceIds: [tavr-fsi]
          contextLinks: [{label: 'Evolut lineage context', nodeId: dev-evolut}]
        - cells: ['Mitral-stenosis FSI', 'Selected geometries; modeled loading.', 'Exploratory flow/energetics; prior planar comparisons.', 'Matched-loading volumetric validation; population variation.']
          sourceIds: [mitral-fsi]
          contextLinks: [{label: 'Mitral stenosis context', nodeId: cond-ms}]
        - cells: ['EchoDino', 'Pediatric pretraining; internal corpus overlap.', 'Downstream patient-disjoint and external task tests.', 'Internal-test pretraining independence; longitudinal adult congenital-heart use.']
          sourceIds: [echodino]
          contextLinks: [{label: 'Congenital-heart context: ASD', nodeId: cond-asd}]
  - heading: 'Evaluating patient-facing monitoring'
    role: insight
    paragraphs:
      - text: >-
          Abbott announced care-team-enabled access to CardioMEMS pressure trends and clinician-configured medication
          instructions through CardioGuide HF, with availability planned later in 2026. The FDA approval claim remains
          sponsor-attributed pending decision-specific verification; the software build is unspecified.
        sourceIds: [cardioguide]
        contextLinks:
          - {label: 'CardioGuide announced capabilities', versionId: ver-cardioguide-hf-announced-2026}
          - {label: 'CardioMEMS system evidence', versionId: ver-cardiomems}
      - text: >-
          These capabilities introduce a patient-facing workflow for existing monitoring information. Evaluation should
          isolate their contribution to timely action, adherence, clinician workload, safety, and outcomes. Benefits from
          earlier CardioMEMS studies cannot establish the incremental effect of this update.
        sourceIds: [cardioguide]
        interpretation: true
        contextLinks: [{label: 'CardioGuide evidence scope', versionId: ver-cardioguide-hf-announced-2026}]
    atlasSnapshot:
      file: atlas-cardioguide.jpg
      nodeId: dig-cardioguide-hf
      conditionId: cond-hfpef
      caption: >-
        Current Atlas, filtered to HFpEF, with CardioGuide HF and its recorded condition relationship highlighted.
        Graph links show catalog relationships; they do not establish compatibility, causal effects, or incremental benefit. The capture retains the catalog review state at the time it was made.
closing:
  heading: 'Evidence priorities for the next edition'
  role: next-question
  paragraphs:
    - text: >-
        The next discriminating evidence would include post-expansion AUTUS valve function and reintervention;
        longer pediatric CAMZYOS functional and safety follow-up; TAVR tests against withheld outputs under new loading;
        matched-loading volumetric mitral comparisons; longitudinal postoperative adult congenital-heart measurements for EchoDino;
        and a comparison isolating the added CardioGuide capabilities. Each would address a specific limit identified above.
      sourceIds: [autus-fda, camzyos-fda, tavr-fsi, mitral-fsi, echodino, cardioguide]
      interpretation: true
