  title: "CMS finalizes expanded Medicare coverage for TAVR, including asymptomatic severe aortic stenosis"
  summary: "CMS finalized a major update to the U.S. National Coverage Determination for TAVR. Medicare coverage now extends to selected patients with asymptomatic severe aortic stenosis under coverage-with-evidence-development, while symptomatic severe AS no longer carries that CED requirement. CMS also preserved the multidisciplinary heart-team model while allowing more flexibility in chart-review triage, operator configuration, and volume criteria."
