  title: "TRISCEND II analysis quantifies hospital-cost and length-of-stay drivers after Evoque TTVR"
  summary: "A TRISCEND II analysis of 155 patients undergoing Edwards Evoque transcatheter tricuspid valve replacement found index-admission costs of about $80,005, including a $49,000 device-acquisition cost. New renal-replacement therapy and new pacemaker/CIED implantation were the largest independent contributors to incremental cost, while renal replacement, stroke, and new pacemaker/CIED implantation had the largest effects on length of stay."
