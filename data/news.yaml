- id: news-2026-11-02-progress-primary-results
  publishedAt: "2026-11-02"
  title: "PROGRESS: early TAVR lowers two-year death/HF-event composite in at-risk moderate AS"
  summary: >-
    In PROGRESS, 744 patients aged ≥65 with at-risk moderate AS were randomized to early TAVR (SAPIEN 3/Ultra/Ultra
    RESILIA permitted) or surveillance. Two-year death/HF-event estimates were 16.7% vs 23.9% (difference −7.2 pp; 95%
    CI −13.1 to −1.3; P=.02). Death alone was 8.4% vs 7.3%; mortality benefit was not established. The 30 day TAVR
