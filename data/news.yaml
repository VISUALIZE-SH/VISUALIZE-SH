- id: news-2026-10-17-moderate-secondary-mr-after-optimized-medical-therapy-prognosis
  publishedAt: "2026-10-17"
  title: Prognostic Impact of Moderate Secondary Mitral Regurgitation After Optimized Medical Therapy in Heart Failure
  summary: >-
    Among 2,468 ambulatory heart-failure patients with echocardiography at baseline and again after 12 months of
    optimized guideline-directed therapy, 15.6% had moderate and 3.9% severe mitral regurgitation at 12 months. Over a
    median 6.9 years, moderate MR was independently associated with a higher risk of death or first heart-failure
    hospitalization (HR 1.69) and of all-cause death (HR 1.54); severe MR carried HR 1.81 for the composite. This is an
    observational prognostic analysis and does not evaluate mitral intervention.
  sourceName: ESC Heart Failure (PubMed record)
  sourceUrl: https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=pubmed&id=42888505&retmode=xml
  additionalSources:
