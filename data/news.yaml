  title: "Transapical mitral valve-in-ring implantation: Results of the real-world European Tendyne valve-in-ring registry"
  summary: >-
    TEND-RING: 16 patients at 8 European centres (2017-2024) had off-label Tendyne valve-in-ring, all with the smallest
    size 29 low-profile valve. Technical success 100%, MR eliminated in 14 of 16, no LVOT obstruction, 30-day mortality
    6.3%, one fatal atrialisation migration, median follow-up 11 months with 5 deaths. The suggested minimums (36 mm
    rigid or semi-rigid ring, 30 mm flexible band) come from 3D reconstruction, where a 32 mm complete ring deformed the
