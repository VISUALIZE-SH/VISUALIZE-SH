- id: news-2026-10-31-season-ar-vitaflow-tavr-pure-aortic-regurgitation
  publishedAt: "2026-10-31"
  title: "Transcatheter Aortic Valve Replacement in Pure Aortic Regurgitation: The Randomized SEASON-AR Clinical Trial"
  summary: >-
    SEASON-AR randomized 210 patients with severe pure aortic regurgitation at 18 centres in China (64.8% at one centre)
    to transfemoral TAVR with the VitaFlow valve plus GDMT (n=109) or GDMT alone (n=101). The 1-year composite of death,
    disabling stroke or HF rehospitalization was 8.3% vs 24.8% (HR 0.31, 95% CI 0.14-0.66), driven by HF
    rehospitalization; bleeding and new pacemakers were higher with TAVR. Open-label, single non-dedicated valve
