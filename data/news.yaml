  publishedAt: "2026-09-18"
  title: "Single-center study links TAVR performed more than 6 months after AS diagnosis to worse outcomes"
  summary: "A retrospective single-center study of 149 severe aortic stenosis patients (2021-2023) found the composite of heart-failure hospitalization or death occurred more often when TAVR was performed more than 6 months after diagnosis (n=49) than within 6 months (n=100), over a median 729-day follow-up. Guidelines already call for surveillance within roughly 6-12 months for patients who do not meet immediate-intervention criteria; the authors say the findings support timelier evaluation but call for larger, multicenter confirmation given the small, single-site, non-randomized design."
  sourceName: "Open Heart"
