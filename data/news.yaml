  publishedAt: "2026-11-03"
  title: "Accuracy of Virtual Circle Method and Valve-to-Aorta Distance Change After Redo-TAVR: Multicenter Paired CT Analysis"
  summary: >-
    In a retrospective paired-CT analysis of 58 redo-TAVR patients at 5 sites (Evolut-in-SAPIEN 17, SAPIEN-in-SAPIEN 13,
    SAPIEN-in-Evolut 28), the virtual circle method predicted index-valve frame diameter within 1 mm in 31 of 53
    evaluable patients (58.5%), overestimated in 14 and underestimated in 8. Authors report the method was accurate or
    conservative in about 85% and caution when pre/post-dilatation is used. Small retrospective sample;
