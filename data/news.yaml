  summary: "A core-laboratory analysis of the randomized Amulet IDE cohort found high-risk device-related thrombus through 12 months in 4.0% of WATCHMAN 2.5 recipients (35/885) versus 2.2% with Amulet (20/903; P=0.030); high-risk thrombus was often detected after 45 days. Across device groups, patients with high-risk DRT had more five-year stroke/systemic embolism/cardiovascular-death events than those with low-risk or no DRT (30.4% vs 19.9%). This post-randomization subgroup analysis does not prove device-related causation or apply to WATCHMAN FLX/FLX Pro."
