- id: news-2026-10-18-teer-systemic-av-valve-transposition-anatomies-case-series
  publishedAt: "2026-10-18"
  title: >-
    Anatomy-Driven Transcatheter Edge-to-Edge Repair of the Systemic Atrioventricular Valve in Complex Transposition
    Anatomy
  summary: >-
    A single-centre series of four consecutive high-risk adults (two with congenitally corrected transposition, two
    after atrial-switch repair) describes transcatheter edge-to-edge repair of the systemic atrioventricular valve,
    using PASCAL ACE in three and MitraClip in one. Implantation succeeded in all four, regurgitation fell from severe
    to mild and no major acute complications occurred. The authors suggest right internal jugular access when inferior
    venous anatomy is absent or likely to give unfavourable curvature, and present the cases as technique notes, not
    comparative evidence of efficacy or safety.
