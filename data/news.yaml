- id: news-2026-11-06-shortcut-mechanical-bicorn-valve-in-valve-first-in-human
  publishedAt: "2026-11-06"
  title: >-
    First-in-Human Mechanical Bilateral Iatrogenic Coronary Leaflet Obstruction Risk Nullification (BICORN) for
    Transcatheter Aortic Valve-in-Valve Replacement
  summary: >-
    A single 80-year-old woman with a failing 23 mm SAPIEN 3 (mean gradient 32 mm Hg, STS 16.8%) and extreme bilateral
    coronary-obstruction risk (valve-to-coronary 2.0 and 1.7 mm) had basal splits made in both coronary leaflets with
    the ShortCut device, a mechanical alternative to electrosurgical traversal for BICORN. The left cusp was
    translocated with an 18 mm balloon and a 20 mm SAPIEN 3 Ultra deployed through the right-cusp split; coronary flow
    was preserved, mean gradient 5 mm Hg, 8 mm Hg at 1 month. One case; acute aortic insufficiency and a 16 F sheath are
    noted limits.
  sourceName: "JACC: Case Reports"
