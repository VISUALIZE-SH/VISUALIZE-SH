    The DUOTAP Randomized Clinical Trial
  summary: >-
    In the single-center, single-blinded DUOTAP trial in Vienna, 148 patients with severe aortic stenosis undergoing
    transfemoral balloon-expandable TAVI were randomized 1:1 to routine post-dilation with the delivery balloon (n=74)
    or sham (n=74). The median fluoroscopic THV asymmetry index was 1.2% versus 2.8% (geometric mean ratio 0.30; 95% CI
    0.18-0.47). HALT and mild-or-worse PVL were less frequent with post-dilation; procedure-related adverse events did
