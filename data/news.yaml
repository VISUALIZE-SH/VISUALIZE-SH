- id: news-2026-11-02-simplaafy-primary-results
  publishedAt: "2026-11-02"
  title: "SIMPLAAFY: two monotherapy strategies meet six-month noninferiority after FLX Pro"
  summary: >-
    After successful uncomplicated FLX Pro implantation, 1,857 patients were randomized to DAPT, 3 months reduced-dose
    NOAC then aspirin, or aspirin alone. In 1,797 primary-analysis patients, the 6 month death/stroke/systemic
    embolism/major bleeding composite was 6.9%, 5.1%, 3.3%, respectively. Both monotherapies met noninferiority versus
    DAPT (7.2 pp margin; P<.001 each). Bleeding/45 day DRT findings are exploratory; 12 month results are pending. No
    equivalence to full-dose NOACs, other devices or complicated implants is established.
