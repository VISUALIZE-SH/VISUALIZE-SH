    Failure: The ENGAGE-HF Trial Outcomes
  summary: >-
    ENGAGE-HF randomized 134 recently hospitalized patients with LVEF below 50% and suboptimal therapy at three academic
    centres to a patient app plus clinician dashboard or usual care for 90 days. The medication optimization score was
    higher with the app (83.7% vs 74.0%, P=.010), with larger gains in MRA and SGLT2 inhibitor use; KCCQ did not differ.
