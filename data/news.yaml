  title: "TRIC-I-HF shows transcatheter tricuspid repair can improve hard clinical outcomes"
  summary: "TRIC-I-HF randomized 360 patients with symptomatic severe tricuspid regurgitation and elevated heart-failure risk to transcatheter tricuspid valve repair plus medical therapy or medical therapy alone. At one year, repair was superior on a hierarchical endpoint incorporating death, HF hospitalization and quality-of-life improvement, with a win ratio of 2.42. Longer-term follow-up also showed a lower risk of the composite of death or HF hospitalization through three years."
