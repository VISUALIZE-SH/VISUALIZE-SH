  title: "ACASA-TAVI: ongoing NOAC monotherapy reduces subclinical leaflet thrombosis after TAVR"
  summary: "ACASA-TAVI randomized 360 post-TAVR patients to NOAC monotherapy or aspirin and found significantly less hypoattenuated leaflet thickening with anticoagulation. HALT occurred in 16.2% of the NOAC group versus 28.6% of patients receiving aspirin, while the composite safety endpoint of bleeding, thromboembolism or death was noninferior. The result suggests that anticoagulation can materially suppress subclinical valve thrombosis without an obvious safety penalty in this trial population."
