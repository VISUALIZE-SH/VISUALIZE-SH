- id: news-2026-10-26-cfd-newer-prosthetic-aortic-valves-doppler-gradient-ppm
  publishedAt: "2026-10-26"
  title: Computational Fluid Dynamics Simulations Provide Insights into the Paradox of Newer Prosthetic Aortic Valves
  summary: >-
    Steady-state axisymmetric CFD of surgical, balloon-expandable and self-expanding valve geometries, 25 anatomical and
    size variations each. Doppler peak velocity estimated the total gradient with a slope of 1.01 for surgical valves
    but overestimated it for balloon-expandable (1.19) and self-expanding (1.42) valves; at identical dimensions the
    gradient was highest for surgical, lower for balloon-expandable and lowest for self-expanding. In ARIC data, stroke
    volume correlated with LVOT area (r 0.76) better than with BSA (r 0.60). The authors propose LVOT-area-based PPM
    measures, pending in vitro and in vivo confirmation.
