  title: "CLOSURE-AF sex-specific analysis raises new caution about LAAO in older women who can tolerate DOAC therapy"
  summary: "A sex-specific analysis of the randomized CLOSURE-AF trial found that worse outcomes with LAAO versus best medical therapy were concentrated in women. Among women, the primary composite endpoint occurred in 58.7% with LAAO versus 35.1% with medical therapy, while no comparable adverse treatment effect was seen in men; the strongest interaction involved cardiovascular or unexplained death."
