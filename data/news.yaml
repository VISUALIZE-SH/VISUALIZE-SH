  publishedAt: "2026-10-17"
  title: >-
    Dapagliflozin in phenotypically stratified HFpEF without myocardial fibrosis: the STADIA-HFpEF randomized crossover
    trial
  summary: >-
    In a 34-week double-blind crossover against placebo (32 randomized, 29 completed; median age 73, 88% women),
    dapagliflozin 10 mg showed no significant difference from placebo in the co-primary measures of left ventricular
    distensibility (E/e'/LVEDVi) and relaxation (mean e') in HFpEF patients phenotyped with a multi-level work-up,
    including cardiac MRI, to exclude structural cardiomyopathies and significant myocardial fibrosis
    (extracellular-matrix remodeling). Most secondary measures showed no clear change; an isolated improvement in left
    atrial conduit strain and numerical falls in inflammatory biomarkers are described as exploratory.
