  title: "PREVUE-VALVE shows AI-ECG structural-heart screening loses accuracy when moved into the community"
  summary: "The PREVUE-VALVE study tested the EchoNext AI-ECG structural-heart disease model in a community cohort of adults aged 65–85 who received in-home ECG and echocardiography. Among 2,402 analyzable participants, structural-heart disease prevalence was only about 7.5% and the AI model’s discrimination fell to an AUC of 0.71, compared with approximately 0.83 in hospital-based cohorts; performance improved to about 0.79 in people with an abnormal ECG."
