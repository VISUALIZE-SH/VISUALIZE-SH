- id: news-2026-10-21-fdm-printed-tpu-sebs-leaflets-polymer-tavi
  publishedAt: "2026-10-21"
  title: Experimental study of TPU and SEBS additively manufactured leaflets for novel aortic valve polymer TAVI prosthesis
  summary: >-
    Open-access full text. Dog-bone specimens (8 per material per orientation; TPU-87A and Filaflex SEBS, FDM with
    axial, transversal and diagonal filament alignment, ISO 527-2 geometry) and 6 printed leaflet samples per material
    were tested quasi-statically at 23 C, with DIC and Mooney-Rivlin fits. Axial alignment gave the highest strength;
    SEBS was stiffer (tensile modulus above five times TPU's) and TPU more ductile. No fatigue, hydrodynamic, 37 C,
