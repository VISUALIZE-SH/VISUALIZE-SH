  summary: "A propensity-matched NCDR LAAO Registry analysis compared 27,141 WATCHMAN FLX recipients with 27,141 first-generation WATCHMAN recipients from 641 U.S. sites. At one year, FLX was associated with lower adjusted hazards of major adverse events (HR 0.84), ischemic stroke (HR 0.82), and ischemic stroke/systemic embolism (HR 0.74); 45-day peridevice leak was also lower (14.7% vs 23.5%), while device-related thrombus was similar. This was an observational comparison across different treatment eras, so residual confounding remains possible."
