  title: "Large U.S. study highlights persistent heart-failure risk and underuse of guideline-directed therapy after TAVR"
  summary: "An analysis of more than 37,000 U.S. TAVR patients found that heart failure remains common before and after valve replacement and that evidence-based HF medications are frequently underused. Within one year of TAVR, 18.6% experienced an acute HF episode; HF hospitalization and all-cause mortality reached 8.8% and 9.8% at one year, rising to 13.8% and 17.9% at two years."
