- id: news-2026-11-04-low-risk-tavi-savr-pooled-late-mortality
  publishedAt: "2026-11-04"
  title: >-
    Transcatheter aortic valve implantation vs surgical replacement in low-risk aortic stenosis: time-dependent late
    mortality in a pooled analysis of trials
  summary: >-
    A European Heart Journal rapid communication pooled reconstructed patient data from PARTNER 3, Evolut Low Risk and
    NOTION (2,644 low-risk patients). Seven-year mortality was 26.9% after TAVI vs 23.7% after SAVR (RR 1.14, 95% CI
    0.99-1.29). Hazards were not proportional: they crossed at 1.9 years, and in an exploratory piecewise model
    mortality was higher after TAVI in years 5-7 (HR 1.64, 1.27-2.12). Data were reconstructed from published curves;
    earlier-generation valves in both arms.
  sourceName: European Heart Journal
  sourceUrl: https://academic.oup.com/eurheartj/advance-article/doi/10.1093/eurheartj/ehag877/9011571
