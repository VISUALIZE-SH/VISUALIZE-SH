- id: news-2026-10-19-viv-tavi-vs-redo-savr-failed-surgical-bioprostheses-netherlands-registry
  publishedAt: "2026-10-19"
  title: >-
    Treatment selection and long-term survival in patients aged 50 to < 75 years undergoing valve reintervention for
    failed surgical aortic bioprostheses: insights from the Netherlands Heart Registration
  summary: >-
    In the Netherlands Heart Registration, 345 patients aged 50 to under 75 with a failed surgical aortic bioprosthesis
    (2015-2020) received valve-in-valve TAVI (41%) or redo surgical aortic valve replacement (59%). ViV-TAVI went to
    older, higher-risk patients; Kaplan-Meier survival estimates at 4 years were 74.4% after ViV-TAVI and 88.4% after
    redo-SAVR (89.6% and 89.8% at 2 years). The authors describe the study as observational and say it cannot show that
    either strategy is better.
  sourceName: Clinical Research in Cardiology (PubMed record)
