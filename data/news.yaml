- id: news-2026-10-19-ultrasound-guided-femoral-access-tavi-laac-outcomes
  publishedAt: "2026-10-19"
  title: >-
    Ultrasound-Guided versus Fluoroscopy-Guided Femoral Access for Structural Heart Procedures: Outcomes From
    Transcatheter Aortic Valve Implantation and Left Atrial Appendage Closure
  summary: >-
    A single-centre retrospective cohort of 165 consecutive patients having transfemoral TAVI (93) or LAAC (72) in
    2022-2024 compared ultrasound-guided with conventional puncture; ultrasound was used in 34.5%. Haemoglobin fell less
    with ultrasound in both venous and arterial access. After 1:1 propensity matching of arterial cases (31 per group),
    complications were 3.2% with ultrasound versus 29.0% without; in the venous cohort the difference (3.8% vs 17.4%)
    was not significant (p=0.143).
  sourceName: Anatolian Journal of Cardiology (PubMed record)
