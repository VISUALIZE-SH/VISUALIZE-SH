  title: Percutaneous Multivalvular Endocarditis Debulking With a Whole-Body Embolic Protection Device
  summary: >-
    A JACC: Case Reports paper of two patients reports, to the authors' knowledge, the first use of whole-body embolic
    protection during percutaneous debulking of aortic and combined tricuspid/mitral endocarditis. The authors call the
    Emboliner filter investigational, note it had previously been studied in transcatheter aortic valve replacement, and
    used it as an adjunct to AngioVac in one patient with aortic valve and one with combined tricuspid and mitral
