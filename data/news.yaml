  summary: "In a 2,118-patient randomized trial of people without preoperative AF undergoing valve surgery, the primary composite of ischemic stroke, TIA, or cardiovascular death occurred in 6.9% with concomitant surgical LAA closure and 8.2% without it (HR 0.83, 95% CI 0.61–1.14; P=0.25). A possible signal in the CHA2DS2-VASc ≥3 subgroup is exploratory; follow-up is being extended. The intervention was surgical suture excision/closure, not a comparison of named marketed clip devices, so the results should not be assigned to AtriClip or another specific device."
