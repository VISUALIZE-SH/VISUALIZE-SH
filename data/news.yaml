    to generate synthetic chordae for a finite-element tricuspid valve model (Texas TriValve 1.1) without in vivo
    chordal attachments. Shape matching reproduced the end-systolic geometry with mean inter-surface distance 0.29 +/-
    0.35 mm. With 202, 225 and 450 chordal insertions, informed by eight explanted human tricuspid valves, more
