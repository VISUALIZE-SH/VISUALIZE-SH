- id: news-2026-10-20-verina-vericiguat-phase-iv-india-worsening-hfref
  publishedAt: "2026-10-20"
  title: >-
    VERINA: A Phase IV Prospective Multicenter Study of Vericiguat in Indian Patients with Worsening Heart Failure and
    Reduced Ejection Fraction
  summary: >-
    VERINA, a single-arm, open-label phase IV study, gave vericiguat on top of foundational therapy to 205 Indian adults
    with chronic HFrEF who had experienced a worsening heart-failure episode (203 in the full analysis set), followed
    for about 48 weeks. At week 48 Kaplan-Meier estimates were 10.1% for cardiovascular death or first heart-failure
    hospitalization and 3.3% for cardiovascular death; 91.6% attained the target dose, drug-related adverse events were
    3.4%, and no new safety signal was observed. There is no comparator.
  sourceName: Cardiology and Therapy (PubMed record)
