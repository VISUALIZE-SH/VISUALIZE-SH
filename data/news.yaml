  title: "NOTION-4 tempers enthusiasm for short-course anticoagulation solely to prevent HALT"
  summary: "NOTION-4 randomized 352 post-TAVR patients without another indication for oral anticoagulation to lifelong single antiplatelet therapy or three months of a DOAC followed by antiplatelet therapy. At three months, HALT was markedly lower with DOAC therapy—12.1% versus 31.8%—but by one year the difference had largely disappeared after anticoagulation was stopped, with HALT rates of 28.3% versus 32.2%."
