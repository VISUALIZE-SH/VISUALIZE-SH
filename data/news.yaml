  publishedAt: "2026-09-14"
  title: >-
    Erosion and embolization after transcatheter atrial septal defect closure: Findings from a multicenter international
    survey
  summary: >-
    International survey of 30 centres that contributed anonymous aggregate retrospective data on 13,155 transcatheter
    ASD closures performed 2011 to 2021 (40% in children; Amplatzer device in 58%). Seventeen erosions (0.13%) were
    reported, 10 in children (0.19%) and 7 in adults (0.09%); all were treated surgically and one patient died.
    Embolization occurred in 91 cases (0.7%), 60% in children and 80% within 24 hours; surgical retrieval was used in
    29%, and the abstract reports no fatal complications irrespective of management. The authors describe both
    complications as exceedingly rare.
