- id: "news-2026-02-06-veritas-amulet-360-early-outcomes"
  publishedAt: "2026-02-06"
  title: "VERITAS reports early procedural and seal outcomes for investigational Amulet 360"
  summary: "The prospective, single-arm VERITAS study implanted Amulet 360 in 400 patients at 34 sites; 399 implants succeeded, and all 376 patients with 45-day echocardiography met the seal endpoint of leak ≤5 mm, with 94% complete occlusion and no leak ≥3 mm. Seven-day/discharge safety endpoint events were zero, while device-related thrombus was observed in 2.4% and 3.3% had a major bleed during follow-up. The study has no randomized comparator or demonstrated stroke-reduction efficacy, and the device was investigational in this report."
