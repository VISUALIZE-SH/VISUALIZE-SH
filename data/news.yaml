  title: "TCT-1415 Leaflet Modification using Split Line Concept in Redo-TAVR: a First Reported Bench Validation Study"
  summary: >-
    A benchtop study tested BASILICA laceration at split lines deviated from the midline in redo-TAVR with commissural
    misalignment (SAPIEN 3 and Evolut platforms), against midline laceration and UNICORN. Modestly deviated split lines
    gave neoskirt clearance comparable to midline; more lateral lines gave diminishing leaflet splay; basal traversal
    was needed in TAV-in-TAV. UNICORN cleared from midline to near the commissures. The authors say the approach appears
