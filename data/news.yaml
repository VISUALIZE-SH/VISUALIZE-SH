  publishedAt: "2026-10-28"
  title: Effects of segment chemistry on mechanical performance and hemocompatibility in polyurethane heart valve scaffolds
  summary: >-
    Bench comparison of five commercial thermoplastic polyurethanes (carbothane AC-4095A, carbothane AC-4075A,
    carbothane PC-3575A, chronoflex C65D and quadrasil ARCS 90A) as polymeric heart valve scaffold materials. Chronoflex
    and carbothane AC-4095A were stiffest and strongest; carbothane AC-4075A had the lowest hysteresis and best elastic
    recovery but low tear resistance and slightly elevated hemolysis (about 4%). All five kept platelet counts and
    partial thromboplastin time within ASTM-defined ranges. A carbothane AC-4095A polymeric mitral valve showed no gross
    thrombotic attachment after 22 days in a preliminary ovine implant.
