  publishedAt: "2026-10-06"
  title: "Acute deoxygenation during M-TEER: a note of caution"
  summary: >-
    Single-centre retrospective analysis of 444 consecutive patients with successful mitral TEER (2017 to 2026): 6
    patients (1.3%) needed emergency closure of the iatrogenic ASD for right-to-left shunting with acute deoxygenation
    (saturation fell by 3-8%), one developing cardiogenic shock. All six had severe tricuspid regurgitation, RV
    dilatation and impaired RV function; right atrial pressure exceeded left atrial pressure after M-TEER in five.
    Versus the rest: TAPSE 15 vs 19 mm, fractional area change 27% vs 43%, RV free-wall strain -13% vs -22%. The authors
    suggest comprehensive RV assessment and invasive haemodynamics for risk stratification.
