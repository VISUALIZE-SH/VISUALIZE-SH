- id: news-2026-10-20-deep-learning-ct-body-composition-mortality-after-tavr
  publishedAt: "2026-10-20"
  title: >-
    Deep Learning-Based 3D CT Body Composition Is Associated With Mortality in Patients Undergoing Transcatheter Aortic
    Valve Replacement
  summary: >-
    A retrospective multicentre study applied a deep-learning pipeline to preprocedural noncontrast CT in 915 TAVR
    patients included from 2014 to 2023 (median age 84; 160 deaths, 17.5%, over a median 22 months). Mortality was
    higher with lower subcutaneous fat volume and higher adipose-tissue attenuation, and lower with greater
    skeletal-muscle volume and attenuation. Adding the body-composition measures to demographics and cardiometabolic
    risk factors raised Harrell C from 0.66 to 0.71; this shows association and discrimination, not a tested clinical
    use.
  sourceName: "Circulation: Cardiovascular Imaging (PubMed record)"
