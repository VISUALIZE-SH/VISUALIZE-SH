- id: news-2026-09-18-reaces-puncturable-asd-occluder-randomized-trial
  publishedAt: "2026-09-18"
  title: "Comparison of a Novel Occluder Versus Traditional Occluder in Atrial Septal Defect: A Randomized Trial"
  summary: >-
    In a multicenter randomized noninferiority trial, the ReAces ASD occluder, whose central region is a 3-layer
    polyethylene terephthalate membrane instead of nitinol mesh (about 60% less metal, designed to be puncturable and
    endothelialize), matched an Amplatzer-like occluder: complete closure at 12 months 61/62 vs 63/64 (98.4% each) in
    the abstract. Central thickness was lower (6.8 vs 12.2 mm) and nonzero migraine scores were fewer at 1 month (3/54
    vs 10/55), with no significant difference at 6 or 12 months. No puncture was needed in follow-up, so puncturability
    remains unproven.
