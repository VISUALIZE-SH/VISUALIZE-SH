    should not be used
  summary: >-
    NICE posted draft guidance (HTG10881, review of its interventional-procedures guidance) on 16 Sep 2026 that
    recommends against using percutaneous cerebral embolic protection during TAVI. The committee cited a rapid review (4
    systematic reviews, 1 randomised trial, 2 retrospective studies) and said randomised evidence, including a large UK
    trial, shows no significant effect on stroke or death. Observational data suggest benefit but are at high risk of
    bias. Consultation closed 6 Oct 2026; the second committee meeting was cancelled on 27 Oct, so guidance moves to
