- id: news-2026-11-02-cfd-la-wall-motion-sampling-laa-stasis
  publishedAt: "2026-11-02"
  title: Effect of Wall Motion Sampling on CFD-Derived Left Atrial Flow Metrics
  summary: >-
    Using electromechanical simulations as high-frame-rate reference in 5 patient-specific atrial geometries with a
    history of AF, the authors downsampled wall motion to 5, 10, 20 and 40 frames per cycle and ran CFD. Global
    left-atrial indices differed by under 9%, whereas left atrial appendage kinetic-energy and residence-time metrics
    differed by up to 31%; at least 20 frames per cycle agreed best and patient ranking by stasis was largely preserved.
    Five geometries, in silico only.
  sourceName: International Journal for Numerical Methods in Biomedical Engineering · free full text (PMC)
