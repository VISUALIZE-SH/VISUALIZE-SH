  type: therapy
  therapyType: pharmaceutical
  subtype: "cardiac myosin inhibitor"
  name: "Aficamten"
  company: co-cytokinetics
  treats: [cond-hcm]
  regulatoryStatus: investigational
  regulatoryDetail: "Next-generation myosin inhibitor; FDA review pending after SEQUOIA-HCM. VERIFY current approval status."
  mechanism: "Selective cardiac myosin inhibitor reducing LVOT gradients with a wider therapeutic window."
  pulse: 9
  curation:
    status: curated
    lastUpdated: 2026-06-22
    notes: "CONFIRMED: FDA approved 2025-12-19 under the brand name Myqorzo for symptomatic obstructive HCM (NYHA II-III), based on SEQUOIA-HCM (see trial-sequoia-hcm). Also approved in China (NMPA, 2025-12-17) and the EU (European Commission, 2026-02-17); first EU commercial launch (Germany) 2026-06-01. A second pivotal trial, ACACIA-HCM, met both primary endpoints in non-obstructive HCM (topline 2026-05-05); full data plus a MAPLE-HCM subgroup analysis are slated as late-breaking presentations at ESC Congress 2026 (announced 2026-07-07). Sources: https://ir.cytokinetics.com/press-releases/press-release-details/2025/Cytokinetics-Announces-FDA-Approval-of-MYQORZO-aficamten-for-the-Treatment-of-Adults-with-Symptomatic-Obstructive-Hypertrophic-Cardiomyopathy-to-Improve-Functional-Capacity-and-Symptoms/default.aspx ; https://www.healio.com/news/cardiology/20251219/fda-approves-aficamten-for-adults-with-obstructive-hcm ; https://www.globenewswire.com/news-release/2026/07/07/3323061/35409/en/Cytokinetics-Announces-Three-Late-Breaking-Science-Abstracts-at-the-European-Society-of-Cardiology-ESC-Congress-2026.html. Human curator: update name to 'Aficamten (Myqorzo)', regulatoryStatus to approved, regulatoryDetail, and add an fda-approval timeline (2025-12-19)."

