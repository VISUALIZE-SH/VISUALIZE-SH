  regulatoryDetail: >-
    Investigational: the clinical series in a 2025 meeting abstract used prototype devices, and the company describes
    injection-molded production instruments as planned. No regulatory status is documented.
  mechanism: >-
    Sponsor-described: single-use instruments standardize building a symmetric trileaflet valve from the patient's own
    tissue (autologous pericardium in the reported series) and its semi-automated implantation. The neo-valve has no
    rigid frame and, for children, is intentionally oversized so the annulus can grow.
