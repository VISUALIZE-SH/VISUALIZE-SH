  subtype: "surgical septal reduction"
  name: "Surgical Septal Myectomy"
  treats: [cond-hcm]
  regulatoryStatus: approved
  regulatoryDetail: "Established surgical standard of care for obstructive HCM at experienced centers."
  mechanism: "Surgical resection of hypertrophied basal septum to relieve LVOT obstruction."
  description: >-
    Surgical removal of hypertrophied septal muscle to relieve LV outflow tract obstruction in selected symptomatic obstructive HCM patients,
    generally when symptoms persist despite medical treatment. Septal reduction should be performed by experienced HCM centers.
  links:
