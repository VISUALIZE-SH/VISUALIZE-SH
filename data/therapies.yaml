      the guideline; the graph status approved denotes an established procedure, not an FDA product approval. Procedures do not have a
      manufacturer or product marketing-authorization date.

- id: proc-alcohol-septal-ablation
  type: therapy
  therapyType: procedure
  subtype: "percutaneous septal reduction"
  name: "Alcohol Septal Ablation"
  treats: [cond-hcm]
  regulatoryStatus: approved
  regulatoryDetail: "Established percutaneous alternative to myectomy in selected patients."
  mechanism: "Catheter-delivered ethanol infarcts a septal perforator to thin the basal septum and reduce obstruction."
  description: >-
    Percutaneous ethanol injection into a suitable septal perforator induces a localized septal infarct to reduce LV outflow tract
    obstruction. It is an option for selected symptomatic obstructive HCM patients, particularly when surgical risk is unacceptable; coronary
    anatomy and experienced-center assessment are required.
  links:
    - label: 2024 AHA/ACC HCM guideline
