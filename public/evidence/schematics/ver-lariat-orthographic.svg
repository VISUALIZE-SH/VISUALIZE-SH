<title id="title">LARIAT LAA Ligation System - orthographic oblique - original illustrative schematic</title>
<desc id="desc">LARIAT II-era ligature only | expanded explanatory loop and knot. Reference +Z: from knot toward loop apex; no intrinsic distal axis. Fixed orthographic projection. Original parametric geometry; mesh, proportions and repeated features simplified. Not to scale. Technical review only; human signoff pending. See SOURCES.md.</desc>
